 polluting the beach. Tourists often **(5) prefer boutique resorts to** crowded hotels because they offer **(6) a gift** (or *a complimentary gift*) upon arrival. Furthermore, one of the hotel **(7) managers** told us that **(8) economics is** the main driver of local employment. Before guests **(9) reach** the resort, the staff ensures that all **(10) baggage** is sanitized.", "ten_mistakes": ["1. **sceneries -> scenery**: 'Scenery' is uncountable.", "2. **emphasize on -> emphasize**: Remove 'on'.", "3. **ordered for -> ordered**: Remove 'for'.", "4. **guilty for -> guilty of**: Always 'guilty of'.", "5. **prefer... than -> prefer... to**: Always 'prefer X to Y'.", "6. **free gift -> gift**: 'Free' is redundant before 'gift'.", "7. **one of the hotel manager -> one of the hotel managers**: Plural noun after 'one of the'.", "8. **Economics are -> Economics is**: Singular verb with '-ics' noun.", "9. **reach at -> reach**: Remove 'at'.", "10. **baggages are -> baggage is**: 'Baggage' is uncountable."]}, {"id": 13, "title": "Common Mistakes Passage 13: Annual General Meeting (AGM) Minutes", "faulty": "After the shareholders (1) entered into the auditorium, the chairman called the Annual General Meeting to order. He stated that the board had reached a (2) consensus of opinion regarding dividend distribution. Although global inflation rose sharply, (3) but our company’s net profit remained stable. The finance director (4) discussed about the audit report and showed that our debt ratio is (5) inferior than last year's benchmark. Several investors (6) requested for detailed (7) informations on the upcoming factory expansion. The chairman promised to (8) revert back with a written breakdown and thanked the members for their (9) advance planning and (10) positive feedbacks.", "corrected": "After the shareholders **(1) entered** the auditorium, the chairman called the Annual General Meeting to order. He stated that the board had reached a **(2) consensus** regarding dividend distribution. Although global inflation rose sharply, **(3) [delete 'but']** our company’s net profit remained stable. The finance director **(4) discussed** the audit report and showed that our debt ratio is **(5) lower than / inferior to** last year's benchmark. Several investors **(6) requested** detailed **(7) information** on the upcoming factory expansion. The chairman promised to **(8) revert** (or *reply*) with a written breakdown and thanked the members for their **(9) planning** and **(10) positive feedback**.", "ten_mistakes": ["1. **entered into the auditorium -> entered the auditorium**: Physical entry takes no 'into'.", "2. **consensus of opinion -> consensus**: 'Of opinion' is redundant.", "3. **Although..., but -> Although..., [remove 'but']**: Redundant conjunction.", "4. **discussed about -> discussed**: Remove 'about'.", "5. **inferior than -> inferior to (or lower than)**: 'Inferior' takes 'to'.", "6. **requested for -> requested**: Remove 'for'.", "7. **informations -> information**: Uncountable noun.", "8. **revert back -> revert / reply**: Remove 'back'.", "9. **advance planning -> planning**: 'Advance' is redundant before 'planning'.", "10. **feedbacks -> feedback**: Uncountable noun."]}, {"id": 14, "title": "Common Mistakes Passage 14: Formal Inquiry Email to University Registrar", "faulty": "Subject: (1) Transcript inquiry request\nDear Registrar (2) [missing comma]\nI am writing to inquire about my academic transcript which I applied for (3) in last Tuesday. Could you please tell me when (4) will the certificate be ready for collection. I need to submit (5) all the informations to a scholarship committee before next Friday. I (6) also attach a copy of my payment receipt for your verification. Please (7) repeat the verification process again if my student ID does not appear immediately. I hope you will (8) answer to my email soon so that I do not (9) loose the scholarship opportunity.\n(10) Sincerely\nRafi.", "corrected": "Subject: **(1) Inquiry Regarding Academic Transcript Application**\nDear Registrar**, (2)**\nI am writing to inquire about my academic transcript, which I applied for **(3) last Tuesday** [delete 'in']. Could you please tell me when **(4) the certificate will be** ready for collection**?** I need to submit **(5) all the information** to a scholarship committee before next Friday. I **(6) have also attached** (or *Please find attached*) a copy of my payment receipt for your verification. Please **(7) verify** (or *repeat the verification process* [delete 'again']) if my student ID does not appear immediately. I hope you will **(8) answer** (or *reply to*) my email soon so that I do not **(9) lose** the scholarship opportunity.\n**(10) Sincerely,**\nRafi [no period]", "ten_mistakes": ["1. **Transcript inquiry request**: Redundant ('inquiry' and 'request' mean the same) and lacks proper capitalization.", "2. **Dear Registrar -> Dear Registrar,**: Missing comma after salutation.", "3. **in last Tuesday -> last Tuesday**: Never use a preposition (in/on/at) before 'last/next/this/every + day'.", "4. **when will the certificate be... . -> when the certificate will be... ?**: Indirect question word order + direct request 'Could you please...?' requires a question mark.", "5. **informations -> information**: Uncountable noun.", "6. **I also attach -> I have also attached / Please find attached**: Formal business email standard.", "7. **repeat... again -> repeat**: 'Again' is redundant.", "8. **answer to -> answer (or reply to)**: Verb 'answer' takes no 'to'.", "9. **loose -> lose**: Spelling confusion ('lose' = verb).", "10. **Sincerely / Rafi. -> Sincerely, / Rafi**: Comma after closing, no period after signature name."]}, {"id": 15, "title": "Common Mistakes Passage 15: Healthcare Supply & Laboratory Upgrade", "faulty": "Our diagnostic centre recently purchased (1) two dozens microscopes and modern (2) equipments for the pathology lab. Because the supplier offered a discount, (3) therefore we saved a significant amount of funds. Each of the lab (4) technician is now (5) capable to conduct PCR tests with (6) less errors. The chief pathologist, who is (7) married with a university professor, (8) insisted to follow international biosafety standards. Furthermore, the staff members (9) collaborated together to dispose of hazardous waste safely. The (10) end result was a faster turnaround time for patients.", "corrected": "Our diagnostic centre recently purchased **(1) two dozen** microscopes and modern **(2) equipment** for the pathology lab. Because the supplier offered a discount, **(3) [delete 'therefore']** we saved a significant amount of funds. Each of the lab **(4) technicians** is now **(5) capable of conducting** PCR tests with **(6) fewer errors**. The chief pathologist, who is **(7) married to** a university professor, **(8) insisted on following** international biosafety standards. Furthermore, the staff members **(9) collaborated** to dispose of hazardous waste safely. The **(10) result** was a faster turnaround time for patients.", "ten_mistakes": ["1. **two dozens -> two dozen**: 'Dozen' takes no -s after a specific number.", "2. **equipments -> equipment**: Uncountable noun.", "3. **Because..., therefore -> Because..., [remove 'therefore']**: Redundant double connector.", "4. **Each of the lab technician -> Each of the lab technicians**: Plural noun required after 'Each of the'.", "5. **capable to conduct -> capable of conducting**: 'Capable' takes 'of + V-ing'.", "6. **less errors -> fewer errors**: Countable plural 'errors' takes 'fewer'.", "7. **married with -> married to**: Always 'married to'.", "8. **insisted to follow -> insisted on following**: 'Insist' takes 'on + V-ing'.", "9. **collaborated together -> collaborated**: Remove redundant 'together'.", "10. **end result -> result**: Remove redundant 'end'."]}], "cmSentences": [{"no": 1, "wrong": "The board members discussed about the annual budget for two hours.", "right": "The board members discussed the annual budget for two hours.", "rule": "'Discuss' is transitive—never use 'about' after 'discuss'."}, {"no": 2, "wrong": "Professor Rahman emphasized on the importance of green supply chains.", "right": "Professor Rahman emphasized the importance of green supply chains.", "rule": "'Emphasize' never takes the preposition 'on'."}, {"no": 3, "wrong": "The advisory panel comprises of six industry experts.", "right": "The advisory panel comprises six industry experts. (OR consists of)", "rule": "Active 'comprise' never takes 'of'."}, {"no": 4, "wrong": "Many interns find it difficult to cope up with corporate pressure.", "right": "Many interns find it difficult to cope with corporate pressure.", "rule": "The correct phrasal expression is 'cope with', not 'cope up with'."}, {"no": 5, "wrong": "Most young professionals prefer flexible hours than rigid schedules.", "right": "Most young professionals prefer flexible hours to rigid schedules.", "rule": "'Prefer' takes 'to', never 'than'."}, {"no": 6, "wrong": "The new software is far superior than the legacy system.", "right": "The new software is far superior to the legacy system.", "rule": "Adjectives ending in -ior (superior, inferior, senior, junior, prior) take 'to'."}, {"no": 7, "wrong": "Could you please provide me with all the informations about the course?", "right": "Could you please provide me with all the information about the course?", "rule": "'Information' is uncountable and never takes a plural -s."}, {"no": 8, "wrong": "The university purchased modern equipments for the computer lab.", "right": "The university purchased modern equipment for the computer lab.", "rule": "'Equipment' is an uncountable noun."}, {"no": 9, "wrong": "All the furnitures in the seminar room were replaced yesterday.", "right": "All the furniture in the seminar room was replaced yesterday.", "rule": "'Furniture' is uncountable and takes a singular verb ('was')."}, {"no": 10, "wrong": "We received many positive feedbacks from our international clients.", "right": "We received much positive feedback (or many positive comments) from our international clients.", "rule": "'Feedback' is uncountable."}, {"no": 11, "wrong": "Although the market was volatile, but the company achieved record sales.", "right": "Although the market was volatile, the company achieved record sales.", "rule": "Do not use 'but' or 'yet' after 'Although/Though'."}, {"no": 12, "wrong": "Because the flight was delayed, so the delegates missed the opening session.", "right": "Because the flight was delayed, the delegates missed the opening session.", "rule": "Do not use 'so' or 'therefore' in a sentence starting with 'Because/Since/As'."}, {"no": 13, "wrong": "Please revert back to my email at your earliest convenience.", "right": "Please revert (or reply) to my email at your earliest convenience.", "rule": "'Revert' already means 'go/reply back'; 'back' is redundant."}, {"no": 14, "wrong": "The two departments collaborated together to launch the campaign.", "right": "The two departments collaborated to launch the campaign.", "rule": "'Together' is redundant after 'collaborate'."}, {"no": 15, "wrong": "One of the participant forgot to sign the attendance sheet.", "right": "One of the participants forgot to sign the attendance sheet.", "rule": "'One of the' must be followed by a plural noun."}, {"no": 16, "wrong": "Could you tell me where is the conference hall located?", "right": "Could you tell me where the conference hall is located?", "rule": "Indirect questions require statement word order (Subject + Verb)."}, {"no": 17, "wrong": "The manager insisted to inspect the warehouse personally.", "right": "The manager insisted on inspecting the warehouse personally.", "rule": "'Insist' takes 'on + V-ing'."}, {"no": 18, "wrong": "Our team succeeded to complete the audit before Friday.", "right": "Our team succeeded in completing the audit before Friday.", "rule": "'Succeed' takes 'in + V-ing'."}, {"no": 19, "wrong": "She is very good in analyzing financial statements.", "right": "She is very good at analyzing financial statements.", "rule": "Use 'good at' (not 'good in') for skills and activities."}, {"no": 20, "wrong": "We congratulated the team leader for winning the innovation award.", "right": "We congratulated the team leader on winning the innovation award.", "rule": "Always 'congratulate someone ON something'."}, {"no": 21, "wrong": "The cashier was accused for misappropriating company funds.", "right": "The cashier was accused of misappropriating company funds.", "rule": "Always 'accused of' (or 'charged with')."}, {"no": 22, "wrong": "All visitors must abide with the security regulations of the campus.", "right": "All visitors must abide by the security regulations of the campus.", "rule": "The phrasal verb is 'abide by'."}, {"no": 23, "wrong": "Our manufacturing process is fully compliant to ISO standards.", "right": "Our manufacturing process is fully compliant with ISO standards.", "rule": "Always 'compliant with' / 'comply with'."}, {"no": 24, "wrong": "When the delegates entered into the hall, everyone stood up.", "right": "When the delegates entered the hall, everyone stood up.", "rule": "Physical entry into a room/building takes 'enter' without 'into'."}, {"no": 25, "wrong": "The train reached at Kamalapur Station twenty minutes late.", "right": "The train reached Kamalapur Station twenty minutes late.", "rule": "'Reach' takes no preposition before a destination."}, {"no": 26, "wrong": "We have been awaiting for the ministry's approval since June.", "right": "We have been awaiting (or waiting for) the ministry's approval since June.", "rule": "'Await' means 'wait for'; never use 'for' after 'await'."}, {"no": 27, "wrong": "The procurement officer ordered for three hundred laptops.", "right": "The procurement officer ordered three hundred laptops.", "rule": "As a verb, 'order' does not take 'for'."}, {"no": 28, "wrong": "The applicant requested for an online interview.", "right": "The applicant requested an online interview.", "rule": "As a verb, 'request' does not take 'for'."}, {"no": 29, "wrong": "There were less participants in the afternoon workshop than expected.", "right": "There were fewer participants in the afternoon workshop than expected.", "rule": "Use 'fewer' with countable plural nouns ('participants')."}, {"no": 30, "wrong": "High fuel prices had a severe affect on logistics expenses.", "right": "High fuel prices had a severe effect on logistics expenses.", "rule": "'Effect' is the noun; 'affect' is the verb."}, {"no": 31, "wrong": "My supervisor gave me a very practical advise before the presentation.", "right": "My supervisor gave me very practical advice before the presentation.", "rule": "'Advice' is an uncountable noun (spelled with C, no 'a')."}, {"no": 32, "wrong": "The startup lost it's competitive advantage due to slow innovation.", "right": "The startup lost its competitive advantage due to slow innovation.", "rule": "Possessive 'its' has no apostrophe ('it's' = 'it is')."}, {"no": 33, "wrong": "Be careful not to loose the original receipts during the trip.", "right": "Be careful not to lose the original receipts during the trip.", "rule": "'Lose' is the verb; 'loose' is an adjective meaning not tight."}, {"no": 34, "wrong": "Both the CFO as well as the internal auditor signed the balance sheet.", "right": "Both the CFO and the internal auditor signed the balance sheet.", "rule": "'Both' pairs with 'and', never 'as well as'."}, {"no": 35, "wrong": "The reason for the system crash is because the server was overloaded.", "right": "The reason for the system crash is that the server was overloaded.", "rule": "Write 'The reason is that...', never 'The reason is because...'."}, {"no": 36, "wrong": "Unless the vendor does not sign the NDA, we cannot share the dataset.", "right": "Unless the vendor signs the NDA, we cannot share the dataset.", "rule": "Never use a negative verb inside an 'unless' clause."}, {"no": 37, "wrong": "Hardly had the presentation begun than the microphone stopped working.", "right": "Hardly had the presentation begun when the microphone stopped working.", "rule": "'Hardly/Scarcely' pairs with 'when/before', not 'than'."}, {"no": 38, "wrong": "No sooner had we submitted the bid when the tender was cancelled.", "right": "No sooner had we submitted the bid than the tender was cancelled.", "rule": "'No sooner' pairs with 'than', not 'when'."}, {"no": 39, "wrong": "The profit was divided equally between the four partners.", "right": "The profit was divided equally among the four partners.", "rule": "Use 'among' for three or more people/entities; 'between' is for two."}, {"no": 40, "wrong": "Beside reducing costs, automation also improves accuracy.", "right": "Besides reducing costs, automation also improves accuracy.", "rule": "'Besides' means 'in addition to'; 'beside' means 'next to'."}, {"no": 41, "wrong": "The news regarding the merger are completely confidential.", "right": "The news regarding the merger is completely confidential.", "rule": "'News' is singular uncountable and takes 'is'."}, {"no": 42, "wrong": "Business Mathematics are taught in the first semester.", "right": "Business Mathematics is taught in the first semester.", "rule": "Subjects ending in -ics take a singular verb."}, {"no": 43, "wrong": "Our company adheres to strict moral principals in advertising.", "right": "Our company adheres to strict moral principles in advertising.", "rule": "'Principles' = rules/ethics; 'principals' = heads/main sums."}, {"no": 44, "wrong": "The new mobile app compliments our web platform perfectly.", "right": "The new mobile app complements our web platform perfectly.", "rule": "'Complement' = complete/enhance; 'compliment' = praise."}, {"no": 45, "wrong": "Please order ten boxes of A4 paper from the stationary store.", "right": "Please order ten boxes of A4 paper from the stationery store.", "rule": "'Stationery' (with e) = office supplies; 'stationary' (with a) = not moving."}, {"no": 46, "wrong": "Electric vans are much more economic for city deliveries.", "right": "Electric vans are much more economical for city deliveries.", "rule": "'Economical' = money-saving/cost-effective."}, {"no": 47, "wrong": "The consultant conducted several researches on consumer behaviour.", "right": "The consultant conducted extensive research (or several studies) on consumer behaviour.", "rule": "'Research' is uncountable."}, {"no": 48, "wrong": "Heavy rains prevented the construction crew to complete the bridge.", "right": "Heavy rains prevented the construction crew from completing the bridge.", "rule": "'Prevent' takes 'from + V-ing'."}, {"no": 49, "wrong": "The new recruits are not yet accustomed with the ERP software.", "right": "The new recruits are not yet accustomed to the ERP software.", "rule": "'Accustomed' always takes 'to'."}, {"no": 50, "wrong": "The project coordinator is capable to resolve conflicts diplomaticallly.", "right": "The project coordinator is capable of resolving conflicts diplomatically.", "rule": "'Capable' takes 'of + V-ing'."}, {"no": 51, "wrong": "Please repeat the safety instructions again for the new interns.", "right": "Please repeat the safety instructions for the new interns.", "rule": "'Again' is redundant after 'repeat'."}, {"no": 52, "wrong": "The two banks merged together to form a larger financial institution.", "right": "The two banks merged to form a larger financial institution.", "rule": "'Together' is redundant after 'merge'."}, {"no": 53, "wrong": "Reviewing the quarterly ledger, several rounding errors were discovered.", "right": "Reviewing the quarterly ledger, the auditor discovered several rounding errors.", "rule": "Fix dangling participle: the subject after the comma must be the person reviewing."}, {"no": 54, "wrong": "The internship requires drafting reports, analyzing data, and presentation of findings.", "right": "The internship requires drafting reports, analyzing data, and presenting findings.", "rule": "Parallelism: use matching gerund forms in a series."}, {"no": 55, "wrong": "My colleague is two years junior than the department head.", "right": "My colleague is two years junior to the department head.", "rule": "'Junior' takes 'to', never 'than'."}, {"no": 56, "wrong": "We met the marketing director in last Friday at the trade fair.", "right": "We met the marketing director last Friday at the trade fair.", "rule": "Never use 'in/on/at' before 'last/next/this/every + day'."}, {"no": 57, "wrong": "The factory invested five millions taka in solar panels.", "right": "The factory invested five million taka in solar panels.", "rule": "'Million/thousand/hundred/dozen' stays singular after a number."}, {"no": 58, "wrong": "He told to the manager that the server was down.", "right": "He told the manager that the server was down.", "rule": "'Tell' takes an object directly without 'to'."}, {"no": 59, "wrong": "I also attach the budget spreadsheet for your kind perusal.", "right": "I have also attached (or Please find attached) the budget spreadsheet for your kind perusal.", "rule": "Standard formal email attachment phrasing (Previous Year Q3)."}, {"no": 60, "wrong": "I am writing to enquire about a meeting scheduled next Monday.", "right": "I am writing to inquire about the meeting scheduled for next Monday.", "rule": "Use definite article 'the meeting' and 'scheduled for [day]' (Previous Year Q3)."}], "verbPassages": [{"id": 1, "title": "Verb Passage 1: Policy Implementation & Feasibility Review (Previous Year Q2a Style)", "instructions": "In the passage below, 10 numbered verbs are given in the WRONG form. Write the correct form of each numbered verb.", "faulty": "Before the new cybersecurity policy (1) [implement] last month, multiple risk assessments (2) [conduct] by the technical committee. Although the firewall initially (3) [was appeared] reliable, several vulnerabilities (4) [observe] once the system (5) [apply] across all branches. While these flaws (6) [addressed], emergency funds (7) [allocate] to upgrade the servers. The director insisted that no confidential data (8) [transfer] until the patch (9) [install]. Having (10) [complete] the verification, the IT team restored full network access.", "answers": ["1. **implemented -> was implemented** (Rule 40 & 17: Past Simple Passive; a policy receives the action).", "2. **conduct -> had been conducted** (Rule 17 & 40: Past Perfect Passive for the earlier past action before 'last month').", "3. **was appeared -> appeared** (Rule 40 Note: 'Appear' is an intransitive verb and CANNOT be passive!).", "4. **observe -> were observed** (Rule 40: Past Simple Passive with plural subject 'several vulnerabilities').", "5. **apply -> was applied** (Rule 40: Past Simple Passive with singular subject 'the system').", "6. **addressed -> were being addressed** (Rule 40: Past Continuous Passive after 'While').", "7. **allocate -> were allocated** (Rule 40: Past Simple Passive with plural subject 'emergency funds').", "8. **transfer -> be transferred / should be transferred** (Rule 18 & 40: Subjunctive/Modal Passive after 'insisted that').", "9. **install -> was installed / had been installed** (Rule 40: Passive voice in time clause).", "10. **complete -> completed** ('Having completed' — Rule 37: Perfect Participle 'Having + V3')."]}, {"id": 2, "title": "Verb Passage 2: Corporate Training & Annual Evaluation", "faulty": "Neither the department head nor the trainees (1) [was] aware of the venue change yesterday. The coordinator, along with two assistants, (2) [are] currently setting up the projector. All participants look forward to (3) [attend] the interactive session on financial modeling. By the time the guest speaker arrived, the handouts (4) [already distribute] to the audience. The trainees were advised (5) [review] the case study before the workshop started. Each of the participants (6) [receive] a digital badge upon completion. Without (7) te] by the consultant highlights three major bottlenecks. If the port authority (10) [automate] customs clearance, delays would decrease significantly.", "answers": ["1. **have -> has** (Rule 2 & 15: Head subject is singular 'The quality', not 'materials').", "2. **reach -> reached** (Rule 23: 'Hardly had + Subject + V3').", "3. **to recheck -> recheck** (Rule 31: Active 'make + object' takes bare infinitive V1).", "4. **make -> making** (Rule 28: 'avoid' is followed by Gerund V-ing).", "5. **inspect -> had been inspected** (Rule 17 & 40: Past Perfect Passive before 'were unloaded').", "6. **operate -> has been operating** (Rule 16: 'since 2019' requires Present Perfect Continuous).", "7. **to ignore -> ignoring (or ignore)** (Rule 32: Perception verb 'noticed + object' takes V-ing or bare V1, never 'to + V1').", "8. **penalize -> should be penalized** (Rule 22 & 40: 'lest + subject + should be + V3' in passive).", "9. **write -> written** (Rule 36: Past participle V3 modifier 'The report written by...').", "10. **automate -> automated** (Rule 43: Second Conditional 'If + Past Simple V2, would + V1')."]}, {"id": 4, "title": "Verb Passage 4: Banking Digitization & Customer Trust", "faulty": "Every commercial bank and financial institution (1) [are] required to protect client data. In our branch, the employees are accustomed to (2) [verify] biometric records before opening accounts. Yesterday, the system crashed while transactions (3) [process] at the counter. No sooner had the backup generator (4) [begin] working than the main power returned. The branch manager wished he (5) [install] a faster cloud server earlier. One of the senior cashiers behaves as though he (6) [own] the entire bank. The furniture in the customer lounge (7) [replace] two weeks ago. Three hours (8) [are] too long for customers to wait for a demand draft. (9) [Finish] the daily reconciliation, the accountant locked the vault. If a customer enters an incorrect PIN three times, the card automatically (10) [block].", "answers": ["1. **are -> is** (Rule 6: 'Every X and Y' takes a singular verb).", "2. **verify -> verifying** (Rule 26: 'be accustomed to' takes Gerund V-ing).", "3. **process -> were being processed** (Rule 40: Past Continuous Passive after 'while').", "4. **begin -> begun** (Rule 23: 'No sooner had + S + V3' — V3 of begin is 'begun').", "5. **install -> had installed** (Rule 20: Past regret after 'wished' requires Past Perfect 'had + V3').", "6. **own -> owned** (Rule 21: 'as though' for unreal present takes Past Simple V2 'owned').", "7. **replace -> was replaced** (Rule 13 & 40: Uncountable singular 'furniture' + 'two weeks ago' = Past Simple Passive 'was replaced').", "8. **are -> is** (Rule 8: Unit of time 'Three hours' treated as one single duration takes 'is').", "9. **Finish -> Having finished** (Rule 37: Perfect Participle 'Having + V3' for completed prior action).", "10. **block -> is blocked** (Rule 41 & 40: Zero Conditional Passive — the card is blocked)."]}, {"id": 5, "title": "Verb Passage 5: E-Commerce Startup & Investor Pitch", "faulty": "Developing a scalable mobile platform and securing venture capital (1) [is] our two main goals this quarter. Neither of the two funding proposals (2) [seem] acceptable to the angel investors. The CEO, together with the co-founders, (3) [have] just arrived at the convention hall. They went to Singapore with a view to (4) [attract] international partners. During the pitch, the investors asked the team (5) [demonstrate] the live payment gateway. The young entrepreneur spoke as if he (6) [be] a seasoned billionaire. The financial projections (7) [prepare] by the analysts after the market survey had been completed. We could not help (8) [admire] the clarity of their business model. I would prefer to bootstrap the startup rather than (9) [surrendering] majority equity. If the app (10) [launch] on time next month, we will reach ten thousand users quickly.", "answers": ["1. **is -> are** (Rule 4 & 24: Two distinct gerund phrases joined by 'and' take a plural verb 'are').", "2. **seem -> seems** (Rule 6: 'Neither of the + plural noun' takes a singular verb 'seems').", "3. **have -> has** (Rule 9 & 15: Singular subject 'The CEO' ignores 'together with the co-founders').", "4. **attract -> attracting** (Rule 26: 'with a view to' takes Gerund V-ing).", "5. **demonstrate -> to demonstrate** (Rule 33: 'ask + object' takes full infinitive 'to + V1').", "6. **be -> were** (Rule 21: Subjunctive 'were' after 'as if' for unreal state).", "7. **prepare -> were prepared** (Rule 17 & 40: Past Simple Passive before 'after + Past Perfect').", "8. **admire -> admiring** (Rule 29: 'could not help' takes V-ing).", "9. **surrendering -> surrender** (Rule 34: 'would prefer to V1 rather than V1').", "10. **launch -> is launched / launches** (Rule 42: First Conditional 'If + Present Simple')."]}, {"id": 6, "title": "Verb Passage 6: Pharmaceutical Lab & Vaccine Trial", "faulty": "A team of biochemists (1) [test] the new vaccine formula in the laboratory at present. The research director let the interns (2) [observe] the clinical trial data. Before the results were published, every sample (3) [analyze] twice for accuracy. One of the lead scientists (4) [work] on this pathogen since 2020. The committee objected to (5) [reduce] the safety observation period. Scarcely had the trial phase (6) [conclude] when the regulatory board requested a full audit. The intern (7) [stand] beside the centrifuge is a graduate of our university. By (8) [maintain] strict temperature control, the lab prevented sample degradation. It is high time the ministry (9) [approve] the emergency distribution grant. If the cold-chain freezer had failed, the entire batch (10) [ruin].", "answers": ["1. **test -> is testing** (Rule 7 & 12: Collective noun 'A team' + 'at present' = 'is testing').", "2. **to observe -> observe** (Rule 31: 'let + object' takes bare infinitive V1).", "3. **analyze -> had been analyzed** (Rule 17 & 40: Past Perfect Passive before 'Before the results were published').", "4. **work -> has been working** (Rule 16: 'since 2020' + singular 'One of the scientists' = 'has been working').", "5. **reduce -> reducing** (Rule 26: 'object to' takes Gerund V-ing).", "6. **conclude -> concluded** (Rule 23: 'Scarcely had + S + V3').", "7. **stand -> standing** (Rule 35: Present participle modifier 'standing beside...').", "8. **maintain -> maintaining** (Rule 27: 'By + V-ing').", "9. **approve -> approved** (Rule 19: 'It is high time + S + V2').", "10. **ruin -> would have been ruined** (Rule 44 & 40: Third Conditional Passive)."]}, {"id": 7, "title": "Verb Passage 7: Garment Factory Safety & Export Compliance", "faulty": "Either the factory owner or the floor managers (1) [is] responsible for fire safety drills. Last month, international buyers insisted on (2) [inspect] the electrical wiring personally. While the audit (3) [carry] out, production on the third floor was temporarily halted. The management promised (4) [upgrade] the ventilation system within sixty days. We saw several workers (5) [to leave] the building during the mock alarm. The safety manual (6) [distribute] to the supervisors contains clear evacuation maps. Without (7) [obtain] the green building certificate, the factory cannot secure European orders. The compliance officer checks every exit door lest any passage (8) [block] by cartons. Five million taka (9) [have] been allocated for fire hydrants. If I (10) [am] the plant director, I would conduct unannounced safety checks every week.", "answers": ["1. **is -> are** (Rule 5: Proximity Rule — closer subject 'the floor managers' is plural).", "2. **inspect -> inspecting** (Rule 25: Preposition 'on' + V-ing).", "3. **carry -> was being carried** (Rule 40: Past Continuous Passive after 'While').", "4. **upgrade -> to upgrade** (Rule 30: 'promise' takes full infinitive 'to + V1').", "5. **to leave -> leave / leaving** (Rule 32: Perception verb 'saw + object' takes bare V1 'leave' or 'leaving', never 'to leave').", "6. **distribute -> distributed** (Rule 36: Past participle V3 modifier 'The safety manual distributed to...').", "7. **obtain -> obtaining** (Rule 27: 'Without + V-ing').", "8. **block -> should be blocked** (Rule 22 & 40: 'lest + S + should be + V3').", "9. **have -> has** (Rule 8: Sum of money treated as a single unit takes singular 'has').", "10. **am -> were** (Rule 43: Second Conditional 'If I were...')."]}, {"id": 8, "title": "Verb Passage 8: University Library Digitization Project", "faulty": "There (1) [is] over fifty thousand academic journals in our digital repository. The chief librarian, as well as the cataloguers, (2) [work] tirelessly to index new e-books. Students used to (3) [borrowing] printed reference books, but now they prefer digital copies. However, first-year students are still getting used to (4) [search] the online database. Yesterday, a rare manuscript (5) [damage] when a water pipe burst in the basement. The maintenance crew was made (6) [repair] the pipeline immediately. (7) [Restore] the archive room, the staff reopened the reading hall this morning. Not only the students but also the faculty adviser (8) [have] praised the new search interface. If you (9) [will enter] a valid student ID, the portal automatically grants remote access. We look forward to (10) [subscribe] to three more international research databases next semester.", "answers": ["1. **is -> are** (Rule 3: 'There are' agrees with plural subject 'over fifty thousand academic journals').", "2. **work -> works** (Rule 9: Singular 'The chief librarian' ignores 'as well as the cataloguers').", "3. **borrowing -> borrow** (Rule 29 Note: Past habit 'used to + V1', NOT V-ing!).", "4. **search -> searching** (Rule 29 Note: 'get used to + V-ing' = become accustomed to).", "5. **damage -> was damaged** (Rule 13 & 40: Past Simple Passive with 'Yesterday').", "6. **repair -> to repair** (Rule 40 Note: In the PASSIVE voice, 'was made' takes 'to + V1'!).", "7. **Restore -> Having restored** (Rule 37: Perfect participle 'Having + V3').", "8. **have -> has** (Rule 5: Proximity Rule — nearest subject 'the faculty adviser' is singular).", "9. **will enter -> enter** (Rule 41: Zero Conditional 'If + Present Simple, Present Simple' — never use 'will' in the 'If' clause).", "10. **subscribe -> subscribing** (Rule 26: 'look forward to + V-ing')."]}, {"id": 9, "title": "Verb Passage 9: Renewable Energy Grid Integration", "faulty": "Generating solar electricity from rooftop panels (1) [require] advanced grid controllers. When sunlight (2) [strike] photovoltaic cells, direct current is produced instantly. The ministry has decided (3) [subsidize] rooftop solar panels for commercial buildings. Before the national grid was upgraded, frequent voltage drops (4) [experience] in industrial zones. The project engineer suggested (5) [to install] automated inverters at every substation. Each of the solar parks (6) [contribute] twenty megawatts to the regional network. The weather (7) [was] cloudy yesterday, the solar output dropped by forty percent. I wish our city (8) [adopt] clean energy policies ten years ago. No sooner had the tariff reduction (9) [announce] than hundreds of factories applied for permits. All applications must (10) [verify] by the energy regulator before Friday.", "answers": ["1. **require -> requires** (Rule 24: Single gerund phrase 'Generating solar electricity...' as subject takes singular verb 'requires').", "2. **strike -> strikes** (Rule 10 & 11: Scientific truth with singular uncountable 'sunlight' takes 'strikes').", "3. **subsidize -> to subsidize** (Rule 30: 'decide' takes full infinitive 'to + V1').", "4. **experience -> had been experienced** (Rule 17 & 40: Past Perfect Passive before 'Before the grid was upgraded').", "5. **to install -> installing** (Rule 28: 'suggest' takes Gerund V-ing, NEVER 'to + V1'!).", "6. **contribute -> contributes** (Rule 6: 'Each of the + plural noun' takes singular verb 'contributes').", "7. **was -> being** (Rule 39: Nominative absolute construction 'The weather being cloudy yesterday, ...').", "8. **adopt -> had adopted** (Rule 20: 'wish' about the past 'ten years ago' takes Past Perfect 'had adopted').", "9. **announce -> been announced** (Rule 23 & 40: Passive 'No sooner had the tariff reduction been announced').", "10. **verify -> be verified** (Rule 18 & 40: Modal Passive 'must be verified')."]}, {"id": 10, "title": "Verb Passage 10: Airline Operations & Passenger Service", "faulty": "The flight crew, together with the captain, (1) [were] boarding the aircraft when the fog thickened. Because visibility dropped below safety limits, all departures (2) [postpone] for three hours. Passengers waiting in the terminal could not help (3) [complain] about the lack of updates. The ground staff urged everyone (4) [remain] calm while refreshments were being served. We saw the maintenance engineers (5) [to inspect] the landing gear on the runway. The sky (6) [clear] at noon, the control tower finally authorized takeoff. Neither the airline nor the airport authorities (7) [was] willing to refund the ticket price. One of the passengers talked as though he (8) [pilot] a commercial jet before. By the time we landed in Kuala Lumpur, the connecting flight (9) [already depart]. If the airline had notified us earlier, we (10) [rebook] an evening flight.", "answers": ["1. **were -> was** (Rule 7 & 9: Collective noun 'The flight crew' + 'together with' takes singular 'was').", "2. **postpone -> were postponed** (Rule 40: Past Simple Passive).", "3. **complain -> complaining** (Rule 29: 'could not help + V-ing').", "4. **remain -> to remain** (Rule 33: 'urge + object + to + V1').", "5. **to inspect -> inspect / inspecting** (Rule 32: Perception verb 'saw + object' takes bare V1 or V-ing).", "6. **clear -> being clear / having cleared** (Rule 39: Absolute participial phrase 'The sky being clear').", "7. **was -> were** (Rule 5: Pro s/has been instructed').", "8. **launch -> been launched** (Rule 23 & 40: Passive 'Hardly had the campaign been launched').", "9. **expand -> expanded** (Rule 19: 'It is time + subject + V2').", "10. **hire -> will be hired** (Rule 42 & 40: First Conditional Passive in main clause)."]}, {"id": 12, "title": "Verb Passage 12: Telecommunications Network Expansion", "faulty": "Ten million dollars (1) [are] the estimated cost of the new fiber-optic cable network. Neither the chief engineer nor his deputies (2) [has] approved the contractor's blueprint yet. While the underground cables (3) [lay] along the highway last month, heavy rain delayed the excavators. The project manager refused (4) [extend] the completion deadline without penalty. Instead of (5) [wait] for dry weather, the crew worked under temporary shelters. The equipment (6) [import] from Germany last quarter meets international durability standards. The technicians worked cautiously lest the optical fibers (7) [snap] during installation. (8) [Complete] the signal test, the engineers connected the regional hub. If the network (9) [be] operational today, rural schools would enjoy high-speed internet. All remaining towers (10) [commission] before the end of next month.", "answers": ["1. **are -> is** (Rule 8: Amount of money 'Ten million dollars' as a single cost takes 'is').", "2. **has -> have** (Rule 5: Proximity Rule — nearest subject 'his deputies' is plural).", "3. **lay -> were being laid** (Rule 40: Past Continuous Passive of 'lay' = 'were being laid').", "4. **extend -> to extend** (Rule 30: 'refuse' takes full infinitive 'to + V1').", "5. **wait -> waiting** (Rule 25: Preposition 'Instead of' takes Gerund V-ing).", "6. **import -> imported** (Rule 36: Past participle V3 modifier 'The equipment imported from Germany').", "7. **snap -> should snap** (Rule 22: 'lest + subject + should + V1').", "8. **Complete -> Having completed** (Rule 37: Perfect Participle 'Having + V3').", "9. **be -> were** (Rule 43: nce Hosting", "faulty": "The number of international delegates attending the summit (1) [have] exceeded three hundred. The banquet hall, as well as the seminar rooms, (2) [decorate] before the guests arrived yesterday. The hotel manager let the event organizers (3) [use] the VIP lounge at no extra charge. We heard the keynote speaker (4) [to rehearse] his speech in the green room. Many delegates enjoyed (5) [sample] traditional Bangladeshi cuisine during the dinner buffet. No sooner had the cultural show (6) [end] than the networking session started. One of the foreign guests wished he (7) [can] stay in Dhaka for another week. The feedback forms (8) [collect] by the receptionists will be analyzed tomorrow. Without (9) [coordinate] closely with the security team, we could not have managed the crowd. If a guest requests airport pickup, a shuttle (10) [dispatch] immediately.", "answers": ["1. **have -> has** (Rule 2: 'The number of...' is singular and takes 'has'; contrast with 'A number of...' which is plural).", "2. **decorate -> had been decorated** (Rule 9, 17 & 40: Singular 'The banquet hall' + before 'arrived' = 'had been decorated').", "3. **to use -> use** (Rule 31: 'let + object' takes bare infinitive V1).", "4. **to rehearse -> rehearsing / rehearse** (Rule 32: Perception verb 'heard + object' takes V-ing or bare V1).", "5. **sample -> sampling** (Rule 28: 'enjoy' takes Gerund V-ing).", "6. **end -> ended** (Rule 23: 'No sooner had + S + V3').", "7. **can -> could** (Rule 20: After 'wished', 'can' becomes 'could').", "8. **collect -> collected** (Rule 36: Past participle modifier 'The feedback forms collected by...').", "9. **coordinate -> coordinating** (Rule 27: 'Without + V-ing').", "10. **dispatch -> is dispatched / will be dispatched** (Rule 41/42 & 40: Conditional Passive)."]}, {"id": 15, "title": "Verb Passage 15: Fintech Cybersecurity & Fraud Detection", "faulty": "Detecting fraudulent mobile transactions in real time (1) [are] a top priority for fintech companies. Our AI algorithm (2) [monitor] millions of wallet transfers since the beginning of this year. Whenever an unusual pattern (3) [detect], the system automatically freezes the account. Last night, a hacker attempted (4) [bypass] the two-factor authentication server. Fortunately, the intrusion (5) [block] before any customer funds could be stolen. The security analysts avoided (6) [shut] down the entire app during the investigation. They are committed to (7) [upgrade] the encryption protocol every quarter. The chief technology officer advised users (8) [not share] their OTP codes with anyone. If the firewall (9) [not update] last week, the breach would have caused severe damage. (10) [Identify] the source of the attack, the team submitted a forensic report to the central bank.", "answers": ["1. **are -> is** (Rule 24: Singular gerund phrase 'Detecting...' takes singular verb 'is').", "2. **monitor -> has been monitoring** (Rule 16: 'since the beginning of this year' requires Present Perfect Continuous).", "3. **detect -> is detected** (Rule 10 & 40: Present Simple Passive 'is detected').", "4. **bypass -> to bypass** (Rule 30: 'attempt' takes full infinitive 'to + V1').", "5. **block -> was blocked / had been blocked** (Rule 17 & 40: Past Passive before 'could be stolen').", "6. **shut -> shutting** (Rule 28: 'avoid' takes Gerund V-ing).", "7. **upgrade -> upgrading** (Rule 26: 'be committed to' takes Gerund V-ing).", "8. **not share -> not to share** (Rule 33: Negative infinitive after 'advise + object' is 'not to + V1').", "9. **not update -> had not been updated** (Rule 44 & 40: Third Conditional Passive 'If the firewall had not been updated').", "10. **Identify -> Having identified** (Rule 37: Perfect Participle 'Having + V3')."]}], "verbSentences": [{"no": 1, "rule": "Rule 5 (Proximity)", "wrong_sentence": "Neither the teacher nor the students **was** aware of the sudden change in the examination schedule.", "wrong_verb": "was", "correct_verb": "were , "wrong_sentence": "The patient died after the doctor **arrived** at the hospital.", "wrong_verb": "arrived", "correct_verb": "had arrived", "why": "In 'Past Simple + after + Past Perfect', the clause after 'after' takes 'had arrived'."}, {"no": 35, "rule": "Rule 26 (Accustomed to + V-ing)", "wrong_sentence": "The students are accustomed to **use** digital tools for preparing their presentations.", "wrong_verb": "use", "correct_verb": "using", "why": "'Be accustomed to' takes a Gerund ('using') because 'to' is a preposition here."}, {"no": 36, "rule": "Rule 41 (Zero Conditional)", "wrong_sentence": "If you heat ice, it **will turn** into water.", "wrong_verb": "will turn", "correct_verb": "turns", "why": "Scientific facts use the Zero Conditional (Present Simple in both clauses -> 'turns')."}, {"no": 37, "rule": "Rule 33 (Encourage + Object + to-V1)", "wrong_sentence": "The lecturer encouraged the students **asking** questions whenever they encountered difficulties.", "wrong_verb": "asking", "correct_verb": "to ask", "why": "'Encourage + object' takes the full infinitive ('to ask')."}, {"no": 38, "rule": "Rule 22 & 40 (Lest + Passive)", "wrong_sentence": "The thief ran away lest he **is caught** by the security guards.", "wrong_verb": "is caught", "correct_verb": "should be caught", "why": "'Lest' takes 'should + V1' (or in passive: 'should be + V3' -> 'should be caught')."}, {"no": 39, "rule": "Rule 36 (Past Participle Modifier)", "wrong_sentence": "The book **wrote** by the professor contains several useful case studies on business management.", "wrong_verb": "wrote", "correct_verb": "written", "why": "'Contains' is the main verb; 'written by the professor' is a passive participial phrase modifying 'The book'."}, {"no": 40, "rule": "Rule 43 (2nd Conditional)", "wrong_sentence": "If the university **provides** additional computer laboratories, students would have better access to digital resources.", "wrong_verb": "provides", "correct_verb": "provided", "why": "Main clause has 'would have' (2nd Conditional), so the 'If' clause requires Past Simple ('provided')."}, {"no": 41, "rule": "Rule 2 (Intervening Clause)", "wrong_sentence": "A bouquet of yellow roses **lend** colour and fragrance to the reception room.", "wrong_verb": "lend", "correct_verb": "lends", "why": "Singular head noun 'A bouquet' (not 'roses') takes singular verb 'lends'."}, {"no": 42, "rule": "Rule 3 (There is/are)", "wrong_sentence": "There **is** several discrepancies in the quarterly balance sheet.", "wrong_verb": "is", "correct_verb": "are", "why": "Real subject following the verb is plural ('several discrepancies') -> 'are'."}, {"no": 43, "rule": "Rule 4 Exception (Single Concept)", "wrong_sentence": "Red beans and rice **are** my mother's favourite dish.", "wrong_verb": "are", "correct_verb": "is", "why": "Two nouns referring to a single dish take a singular verb ('is')."}, {"no": 44, "rule": "Rule 4 Exception (Single Concept)", "wrong_sentence": "Breaking and entering **are** strictly against the law.", "wrong_verb": "are", "correct_verb": "is", "why": "Treated as a single legal offense -> singular verb 'is'."}, {"no": 45, "rule": "Rule 5 (Proximity with Not only...but also)", "wrong_sentence": "Not only the students but also the course teacher **are** responsible for the arrangement.", "wrong_verb": "are", "correct_verb": "is", "why": "Closer subject 'the course teacher' is singular -> 'is'."}, {"no": 46, "rule": "Rule 5 (Proximity with Either...or)", "wrong_sentence": "Either Rahim or his friends **is** attending the entrepreneurship seminar.", "wrong_verb": "is", "correct_verb": "are", "why": "Closer subject 'his friends' is plural -> 'are'."}, {"no": 47, "rule": "Rule 6 (Every X and Y)", "wrong_sentence": "Every man and woman **are** required to check in at the security desk.", "wrong_verb": "are", "correct_verb": "is", "why": "When 'every' or 'each' precedes singular subjects joined by 'and', the verb is singular ('is')."}, {"no": 48, "rule": "Rule 6 (Everybody/Nobody)", "wrong_sentence": "Everybody in the marketing division **want** to achieve the quarterly bonus.", "wrong_verb": "want", "correct_verb": "wants", "why": "'Everybody/Everyone/Nobody/Someone' always takes a singular verb ('wants')."}, {"no": 49, "rule": "Rule 6 Note (Several/Both)", "wrong_sentence": "Several of the submitted proposals **meets** the funding criteria.", "wrong_verb": "meets", "correct_verb": "meet", "why": "'Few, many, several, and both' take plural verbs ('meet')."}, {"no": 50, "rule": "Rule 7 (Collective Noun)", "wrong_sentence": "The board of directors **have** approved the annual dividend today.", "wrong_verb": "have", "correct_verb": "has", "why": "Collective noun acting as a single unit takes a singular verb ('has')."}, {"no": 51, "rule": "Rule 8 (Distance as One Unit)", "wrong_sentence": "Three miles **are** too far to walk in this humid weather.", "wrong_verb": "are", "correct_verb": "is", "why": "Distance treated as one single unit takes a singular verb ('is')."}, {"no": 52, "rule": "Rule 8 (Time as One Unit)", "wrong_sentence": "Five years **are** a long time to wait for a promotion.", "wrong_verb": "are", "correct_verb": "is", "why": "Period of time treated as a single unit takes 'is'."}, {"no": 53, "rule": "Rule 9 (As well as)", "wrong_sentence": "Excitement, as well as nervousness, **are** the cause of her shaking before the viva.", "wrong_verb": "are", "correct_verb": "is", "why": "'As well as nervousness' does not change the singular head subject 'Excitement' -> 'is'."}, {"no": 54, "rule": "Rule 10 (Universal Truth)", "wrong_sentence": "Water **boiled** at 100°C at standard atmospheric pressure.", "wrong_verb": "boiled", "correct_verb": "boils", "why": "Scientific facts always use the Present Simple ('boils')."}, {"no": 55, "rule": "Rule 11 (Does not + V1)", "wrong_sentence": "He does not **checks** his official email on weekends.", "wrong_verb": "checks", "correct_verb": "check", "why": "After 'does not', always use the base verb V1 without -s ('check')."}, {"no": 56, "rule": "Rule 11 (Question with Does)", "wrong_sentence": "Does the company **provides** transport facilities for night-shift workers?", "wrong_verb": "provides", "correct_verb": "provide", "why": "In questions with 'Does', the main verb must be in base form V1 ('provide')."}, {"no": 57, "rule": "Rule 12 (At the moment)", "wrong_sentence": "I **work** on the financial audit assignment at the moment.", "wrong_verb": "work", "correct_verb": "am working", "why": "'At the moment' signals an action in progress now -> Present Continuous ('am working')."}, {"no": 58, "rule": "Rule 13 (Two days ago)", "wrong_sentence": "They **have completed** the market survey two days ago.", "wrong_verb": "have completed", "correct_verb": "completed", "why": "'Two days ago' is a specific past time marker -> Past Simple ('completed')."}, {"no": 59, "rule": "Rule 15 (Just / Recently)", "wrong_sentence": "I **just finished** drafting the executive summary.", "wrong_verb": "just finished", "correct_verb": "have just finished", "why": "In standard British/academic grammar (Rule 15), 'just', 'already', 'yet', and 'recently' take Present Perfect ('have just finished')."}, {"no": 60, "rule": "Rule 15 (Yet in Questions/Negatives)", "wrong_sentence": "Did you **submitted** the internship report yet?", "wrong_verb": "Did you submitted", "correct_verb": "Have you submitted", "why": "'Yet' in questions/negatives takes Present Perfect ('Have you submitted')."}, {"no": 61, "rule": "Rule 16 (For + Duration)", "wrong_sentence": "I **am studying** in the library for three hours.", "wrong_verb": "am studying", "correct_verb": "have been studying", "why": "Duration 'for three hours' up to the present requires Present Perfect Continuous ('have been studying')."}, {"no": 62, "rule": "Rule 16 (Stative Verb 'Know' with For)", "wrong_sentence": "I **have been knowing** the project director for five years.", "wrong_verb": "have been knowing", "correct_verb": "have known", "why": "'Know' is a stative verb (never takes -ing); use Present Perfect ('have known') with 'for five years'."}, {"no": 63, "rule": "Rule 17 (Before + Past Simple)", "wrong_sentence": "The patient **died** before the ambulance arrived.", "wrong_verb": "died", "correct_verb": "had died", "why": "In 'Past Perfect + before + Past Simple', the earlier action before 'before' takes 'had died'."}, {"no": 64, "rule": "Rule 19 (It is time + V2)", "wrong_sentence": "It is time you **start** preparing seriously for the final examination.", "wrong_verb": "start", "correct_verb": "started", "why": "'It is time + subject' requires Past Simple ('started')."}, {"no": 65, "rule": "Rule 20 (Wish + Were)", "wrong_sentence": "I wish I **am** the chief executive officer of this firm.", "wrong_verb": "am", "correct_verb": "were", "why": "Unreal present wish uses subjunctive 'were' ('I wish I were')."}, {"no": 66, "rule": "Rule 20 (Wish + Past Perfect)", "wrong_sentence": "I wish I **studied** harder for last week's accounting quiz.", "wrong_verb": "studied", "correct_verb": "had studied", "why": "Regret about the past ('last week's quiz') after 'wish' requires Past Perfect ('had studied')."}, {"no": 67, "rule": "Rule 21 (As if + Past Perfect)", "wrong_sentence": "He looked terrified as if he **saw** a ghost in the corridor.", "wrong_verb": "saw", "correct_verb": "had seen", "why": "After a past verb ('looked'), 'as if' takes Past Perfect ('had seen') for an unreal prior perception."}, {"no": 68, "rule": "Rule 22 (Lest + Should + V1)", "wrong_sentence": "Walk carefully on the wet floor lest you **will fall**.", "wrong_verb": "will fall", "correct_verb": "should fall", "why": "'Lest' is always followed by 'should + V1' ('should fall'), never 'will'."}, {"no": 69, "rule": "Rule 23 (Scarcely had + V3)", "wrong_sentence": "Scarcely had he **arrive** at the office before the client called.", "wrong_verb": "arrive", "correct_verb": "arrived", "why": "After 'Scarcely had + subject', use the Past Participle V3 ('arrived')."}, {"no": 70, "rule": "Rule 24 (Gerund Subject)", "wrong_sentence": "Swimming in the ocean and playing drums **is** my favourite hobbies.", "wrong_verb": "is", "correct_verb": "are", "why": "Two distinct gerund phrases joined by 'and' take a plural verb ('are')."}, {"no": 71, "rule": "Rule 24 (Single Gerund Subject)", "wrong_sentence": "Giving to charity **are** better than receiving.", "wrong_verb": "are", "correct_verb": "is", "why": "A single gerund subject ('Giving') takes a singular verb ('is')."}, {"no": 72, "rule": "Rule 25 (Preposition + V-ing)", "wrong_sentence": "The applicant insisted on **meet** the hiring manager in person.", "wrong_verb": "meet", "correct_verb": "meeting", "why": "After preposition 'on', use the Gerund ('meeting')."}, {"no": 73, "rule": "Rule 26 (With a view to + V-ing)", "wrong_sentence": "He went to the tribunal with a view to **confess** his mistake.", "wrong_verb": "confess", "correct_verb": "confessing", "why": "'With a view to' takes a Gerund ('confessing')."}, {"no": 74, "rule": "Rule 26 (Object to + V-ing)", "wrong_sentence": "Many employees object to **work** overtime without extra pay.", "wrong_verb": "work", "correct_verb": "working", "why": "In 'object to', 'to' is a preposition -> 'working'."}, {"no": 75, "rule": "Rule 26 (Committed to + V-ing)", "wrong_sentence": "Our company is committed to **reduce** carbon emissions by 2030.", "wrong_verb": "reduce", "correct_verb": "reducing", "why": "'Be committed to' takes a Gerund ('reducing')."}, {"no": 76, "rule": "Rule 27 (By + Gerund)", "wrong_sentence": "By **eat** a balanced diet, you can maintain good health and productivity.", "wrong_verb": "eat", "correct_verb": "eating", "why": "Preposition 'By' must be followed by a Gerund ('eating')."}, {"no": 77, "rule": "Rule 28 (Would you mind + V-ing)", "wrong_sentence": "Would you mind **to open** the conference room window?", "wrong_verb": "to open", "correct_verb": "opening", "why": "'Mind' (and 'Would you mind') always takes a Gerund ('opening')."}, {"no": 78, "rule": "Rule 28 (Suggest + V-ing)", "wrong_sentence": "The consultant suggested **to postpone** the product launch until winter.", "wrong_verb": "to postpone", "correct_verb": "postponing", "why": "'Suggest' takes a Gerund ('postponing'), never 'to + V1'."}, {"no": 79, "rule": "Rule 28 (Admit/Deny + V-ing)", "wrong_sentence": "The clerk denied **to leak** the confidential salary sheet.", "wrong_verb": "to leak", "correct_verb": "leaking", "why": "'Deny' and 'admit' take a Gerund ('leaking')."}, {"no": 80, "rule": "Rule 29 (Could not help + V-ing)", "wrong_sentence": "I could not help **to laugh** at the speaker's witty joke.", "wrong_verb": "to laugh", "correct_verb": "laughing", "why": "'Cannot help / could not help' takes a Gerund ('laughing')."}, {"no": 81, "rule": "Rule 29 (It is no use + V-ing)", "wrong_sentence": "It is no use **cry** over spilt milk after missing the tender deadline.", "wrong_verb": "cry", "correct_verb": "crying", "why": "'It is no use' is followed by a Gerund ('crying')."}, {"no": 82, "rule": "Rule 29 (Succeed in / Excel in + V-ing)", "wrong_sentence": "She excels in **design** interactive business dashboards.", "wrong_verb": "design", "correct_verb": "designing", "why": "'Excel in' and 'succeed in' take a Gerund ('designing')."}, {"no": 83, "rule": "Rule 29 Note (Used to + V1 vs Be used to + V-ing)", "wrong_sentence": "He is used to **work** late at the audit firm.", "wrong_verb": "work", "correct_verb": "working", "why": "'Be used to' (= be accustomed to) takes a Gerund ('working'); only bare 'used to' (past habit) takes V1."}, {"no": 84, "rule": "Rule 30 (Decide/Manage/Refuse + to-V1)", "wrong_sentence": "The IT specialist managed **solving** the network outage within ten minutes.", "wrong_verb": "solving", "correct_verb": "to solve", "why": "'Manage' takes the full infinitive ('to solve')."}, {"no": 85, "rule": "Rule 30 (Promise/Agree + to-V1)", "wrong_sentence": "The vendor agreed **replacing** the defective printers free of charge.", "wrong_verb": "replacing", "correct_verb": "to replace", "why": "'Agree' takes the full infinitive ('to replace')."}, {"no": 86, "rule": "Rule 31 (Let + Object + Bare V1)", "wrong_sentence": "Please let the intern **to attend** the client briefing this afternoon.", "wrong_verb": "to attend", "correct_verb": "attend", "why": "'Let + object' takes the bare infinitive without 'to' ('attend')."}, {"no": 87, "rule": "Rule 32 (Perception Verb + Bare V1)", "wrong_sentence": "We saw the cargo plane **to land** safely on the wet runway.", "wrong_verb": "to land", "correct_verb": "land", "why": "After 'saw + object', use bare infinitive 'land' (or 'landing'), never 'to land'."}, {"no": 88, "rule": "Rule 33 (Warn + Object + not to V1)", "wrong_sentence": "The security officer warned us **to not enter** the restricted server zone.", "wrong_verb": "to not enter / not entering", "correct_verb": "not to enter", "why": "'Warn + object' takes 'not to + V1' ('not to enter')."}, {"no": 89, "rule": "Rule 33 Note (Help + Bare or Full Infinitive)", "wrong_sentence": "My colleague helped me **carrying** the heavy projector to the hall.", "wrong_verb": "carrying", "correct_verb": "carry (or to carry)", "why": "After 'help + object', use the bare infinitive 'carry' or full infinitive 'to carry', not V-ing."}, {"no": 90, "rule": "Rule 34 (Prefer to V1 rather than V1)", "wrong_sentence": "I prefer to walk to campus rather than **taking** a crowded bus.", "wrong_verb": "taking", "correct_verb": "take", "why": "In 'prefer to V1 rather than V1', use the bare infinitive ('take') after 'rather than'."}, {"no": 91, "rule": "Rule 35 (Present Participle Adjective)", "wrong_sentence": "The **burn** warehouse was evacuated by the firefighters immediately.", "wrong_verb": "burn", "correct_verb": "burning (or burnt)", "why": "Use participle 'burning' (ongoing) or 'burnt' (completed state), not base verb 'burn'."}, {"no": 92, "rule": "Rule 36 (Past Participle Adjective)", "wrong_sentence": "The **break** glass on the laboratory floor posed a safety hazard.", "wrong_verb": "break", "correct_verb": "broken", "why": "Use Past Participle V3 'broken' as a passive adjective modifying 'glass'."}, {"no": 93, "rule": "Rule 38 (Participle Taking Object)", "wrong_sentence": "**Hear** a strange noise in the engine room, the watchman called the engineer.", "wrong_verb": "Hear", "correct_verb": "Hearing", "why": "Introductory participial phrase requires Present Participle ('Hearing')."}, {"no": 94, "rule": "Rule 39 (Absolute Participial Construction)", "wrong_sentence": "The sky **was** clear, the charter plane took off on schedule.", "wrong_verb": "was", "correct_verb": "being", "why": "Two clauses joined only by a comma create a comma splice; use absolute participle 'The sky being clear, ...'."}, {"no": 95, "rule": "Rule 40 (Present Continuous Passive)", "wrong_sentence": "The annual financial report **is preparing** by the chief accountant right now.", "wrong_verb": "is preparing", "correct_verb": "is being prepared", "why": "The report receives the action ('by the accountant') right now -> Present Continuous Passive ('is being prepared')."}, {"no": 96, "rule": "Rule 40 (Present Perfect Passive)", "wrong_sentence": "The audit work **has completed** by the external team recently.", "wrong_verb": "has completed", "correct_verb": "has been completed", "why": "Passive voice with 'by the external team' in Present Perfect requires 'has been completed'."}, {"no": 97, "rule": "Rule 40 Note (Causative Passive 'was made to')", "wrong_sentence": "The junior clerk was made **apologize** for the billing mistake.", "wrong_verb": "apologize", "correct_verb": "to apologize", "why": "While active 'make' takes bare V1, PASSIVE 'was made' requires full infinitive ('to apologize')!"}, {"no": 98, "rule": "Rule 42 (1st Conditional)", "wrong_sentence": "If it **will rain** this afternoon, the outdoor ceremony will be shifted indoors.", "wrong_verb": "will rain", "correct_verb": "rains", "why": "First Conditional 'If' clause takes Present Simple ('rains'), never 'will rain'."}, {"no": 99, "rule": "Rule 43 (2nd Conditional Main Clause)", "wrong_sentence": "If I had her contact number, I **will inform** her about the rescheduled viva.", "wrong_verb": "will inform", "correct_verb": "would inform", "why": "'If I had' (Past Simple = 2nd Conditional) pairs with 'would + V1' ('would inform')."}, {"no": 100, "rule": "Rule 44 (3rd Conditional Main Clause)", "wrong_sentence": "If the contractor had followed the blueprint, the bridge **would not collapse**.", "wrong_verb": "would not collapse", "correct_verb": "would not have collapsed", "why": "'If + had followed' (3rd Conditional) pairs with 'would not have + V3' ('would not have collapsed')."}], "pyq": {"exam_title": "HUM 4161: Business English — Mid Semester Examination (Winter A.Y. 2024–2025, Date: January 7, 2026)", "q1a": {"title": "Q1(a) [15 Marks]: Collocations, Idioms & Verb Forms in a Business/Research Passage", "word_bank": "draw, manage, break, enhance, review, hit, provide, lose, carry, set, question, deliver, raise, drop, take, maintain, run, formulate, address, keep", "passage_with_answers": "During the multi-phase research initiative, the coordinating team was required to (i) **keep** in touch with multiple institutions to ensure alignment across workstreams. When preliminary findings contradicted earlier projections, the principal investigator had to (ii) **break** the news to the sponsors with caution. As the study extended over several quarters, some analysts began to (iii) **lose** track of the original research scope, and one junior researcher critically (iv) **dropped** the ball by overlooking a compliance requirement. Once ethical clearance was granted, the team decided to (v) **hit** the road and commence data collection in the field. Throughout the analytical phase, researchers were expected to (vi) **question** assumptions embedded in prior literature rather than accept them uncritically. At the same time, strict protocols required all participants to (vii) **maintain** confidentiality when handling sensitive datasets. To strengthen explanatory power, the research group worked collaboratively to (viii) **formulate** theories grounded in observed patterns, while team members were encouraged to (ix) **enhance** skills relevant to advanced analytical methods. Despite institutional constraints, the project leadership attempted to (x) **address** challenges proactively and (xi) **provide** feedback in a timely manner. Although several sessions initially (xii) **ran** late due to scheduling conflicts, the final stage allowed the team to (xiii) **draw** conclusions, (xiv) **carry** [out] analysis with methodological rigor, and ultimately (xv) **deliver** results to the funding body.", "explanations": ["(i) **keep** — Fixed idiom: 'keep in touch with' (base V1 after 'required to').", "(ii) **break** — Fixed idiom: 'break the news' = announce difficult news (base V1 after 'had to').", "(iii) **lose** — Fixed idiom: 'lose track of' (base V1 after 'began to').", "(iv) **dropped** — Fixed idiom: 'drop the ball' = make a critical mistake; adjusted to Past Simple **dropped** to match the past narrative ('began', 'was').", "(v) **hit** — Fixed idiom: 'hit the road' = set out / begin travel (base V1 after 'decided to').", "(vi) **question** — Collocation: 'question assumptions' (contrast with 'accept them uncritically').", "(vii) **maintain** — Collocation: 'maintain confidentiality' (base V1 after 'required... to').", "(viii) **formulate** — Academic collocation: 'formulate theories'.", "(ix) **enhance** — Collocation: 'enhance skills' (base V1 after 'encouraged to').", "(x) **address** — Business collocation: 'address challenges proactively'.", "(xi) **provide** — Business collocation: 'provide feedback'.", "(xii) **ran** — Collocation: 'run late'; adjusted to Past Simple **ran** to match 'Although several sessions initially ran late...'.", "(xiii) **draw** — Academic collocation: 'draw conclusions'.", "(xiv) **carry** (or **carry out**) — Collocation: 'carry [out] analysis'.", "(xv) **deliver** — Business collocation: 'deliver results' to the funding body."]}, "q1b": {"title": "Q1(b) [15 Marks]: Punctuation & Capitalization Paragraph (15 Errors)", "original": "yesterday we went to the city market It was very crowded people were buying fruits Vegetables and other things. the shops were decorated with colorful lights And banners. i bought apples oranges bananas and some mangoes. my friend said lets have a coffee break so we went to a cafe near the river. The weather was sunny but windy it was pleasant.", "corrected": "**(1) Y**esterday**(2) ,** we went to the city market**(3) .** It was very crowded**(4) ;** people were buying fruits**(5) ,** **(6) v**egetables, and other things. **(7) T**he shops were decorated with colorful lights **(8) a**nd banners. **(9) I** bought apples**(10) ,** oranges**(11) ,** bananas, and some mangoes. **(12) M**y friend said**(13) , “L**et**(14) ’**s have a coffee break,” so we went to a cafe near the river. The weather was sunny but windy**(15) ;** it was pleasant.", "fifteen_errors_list": ["1. **Yesterday** — Capitalize the first word of a sentence (Cap Rule 1).", "2. **Yesterday,** — Add a comma after the introductory time word (Comma Rule 2).", "3. **market.** — Add a period at the end of the first complete sentence (Period Rule 1).", "4. **crowded;** (or **crowded.**) — Fix the run-on sentence between 'It was very crowded' and 'people were buying' with a semicolon (Semicolon Rule 1) or period.", "5. **fruits,** — Add a comma to separate items in the list (Comma Rule 1).", "6. **vegetables** (plus optional Oxford comma **vegetables,**) — Lowercase 'Vegetables' because it is a common noun mid-sentence (Cap Rule 1/3).", "7. **The** — Capitalize the first word of the new sentence 'The shops...' (Cap Rule 1).", "8. **and** — Lowercase 'And' mid-sentence (and no comma before 'and' because 'colorful lights and banners' is a simple compound phrase, not two sentences — Comma Rule 3).", "9. **I** — Always capitalize the pronoun 'I' (Cap Rule 2).", "10. **apples,** — Add a comma after the first list item (Comma Rule 1).", "11. **oranges,** (and **bananas,**) — Add commas separating list items (Comma Rule 1).", "12. **My** — Capitalize the first word of the sentence 'My friend...' (Cap Rule 1).", "13. **said, “Let’s... break,”** — Add comma and quotation marks with a capital 'L' for direct speech (Quotation Rules 1, 2, 4).", "14. **Let’s** — Add an apostrophe for the contraction of 'let us' (Apostrophe Rule 2).", "15. **windy;** (or **windy, but** / **windy. It**) — Fix the run-on sentence between 'The weather was sunny but windy' and 'it was pleasant' using a semicolon (Semicolon Rule 1)."]}, "q2a": {"title": "Q2(a) [15 Marks]: Passage-Based Right Forms of Verbs (15 Blanks)", "original_with_answers": "Before the policy (i) **was implemented** (implement), multiple feasibility studies (ii) **had been conducted / were conducted** (conduct) to ensure that potential risks (iii) **were identified** (identify) accurately. Although the framework initially (iv) **appeared** (appear) effective, several limitations (v) **were observed** (observe) once the model (vi) **was applied** (apply) in practice. While these shortcomings (vii) **were being addressed** (address), additional funding (viii) **was allocated** (allocate) to support corrective measures. However, the committee insisted that no revisions (ix) **be approved / should be approved** (approve) unless sufficient evidence (x) **was provided** (provide). By the end of the review cycle, all recommendations (xi) **had been documented** (document), key assumptions (xii) **had been reassessed** (reassess), and the final report (xiii) **had been submitted / was submitted** (submit), after which the findings (xiv) **were made** (make) publicly available once the proposal (xv) **was ratified / had been ratified** (ratify).", "explanations": ["(i) **was implemented** — Past Simple Passive (Rule 17 & Rule 40: 'Before + Past Simple Passive'; a policy does not implement itself).", "(ii) **had been conducted** (or **were conducted**) — Past Perfect Passive before the policy was implemented (Rule 17 + Rule 40).", "(iii) **were identified** — Past Simple Passive in a 'that'-clause following a past main verb (Rule 40).", "(iv) **appeared** — Active Past Simple V2! ('Appear' is an intransitive linking verb and CANNOT be made passive — Rule 40 Important Note!).", "(v) **were observed** — Past Simple Passive (plural subject 'several limitations').", "(vi) **was applied** — Past Simple Passive (singular subject 'the model').", "(vii) **were being addressed** — Past Continuous Passive triggered by 'While' + ongoing past process (Rule 40).", "(viii) **was allocated** — Past Simple Passive (uncountable singular subject 'additional funding').", "(ix) **be approved** (or **should be approved**) — Subjunctive / modal passive after 'insisted that...' (Rule 18 / Rule 40).", "(x) **was provided** — Past Simple Passive (uncountable singular subject 'sufficient evidence').", "(xi) **had been documented** — Past Perfect Passive triggered by 'By the end of the review cycle' (completed before a past point).", "(xii) **had been reassessed** (or **reassessed** sharing 'had been') — Parallel Past Perfect Passive.", "(xiii) **had been submitted** (or **was submitted**) — Parallel Past Perfect/Simple Passive before 'after which'.", "(xiv) **were made** — Past Simple Passive (plural subject 'the findings').", "(xv) **was ratified** (or **had been ratified**) — Past Simple/Perfect Passive (singular subject 'the proposal')."]}, "q2b": {"title": "Q2(b) [15 Marks]: Contextual Vocabulary Meanings (15 Underlined Words)", "items": ["(i) **ambiguous** — Open to more than one interpretation; unclear or vague.", "(ii) **pragmatic** — Practical and realistic; focused on workable results rather than abstract theory.", "(iii) **substantial** — Large in amount, size, or importance; significant / considerable.", "(iv) **articulate** — Express or explain an idea or strategy clearly and effectively.", "(v) **feasible** — Possible and practical to achieve or carry out easily.", "(vi) **implications** — Possible future consequences, effects, or outcomes of an action or decision.", "(vii) **controversial** — Causing public disagreement, debate, or argument.", "(viii) **viable** — Capable of working successfully; practicable and sustainable.", "(ix) **discrepancy** — An unexpected difference or inconsistency between two figures or facts (e.g., projected vs. actual revenue).", "(x) **exemplify** — Serve as a typical or excellent example of something; illustrate.", "(xi) **hypothetical** — Based on an imagined or assumed situation rather than actual fact.", "(xii) **simultaneous** — Occurring, operating, or done at the exact same time.", "(xiii) **speculate** — Form a theory or conjecture about future trends without firm evidence.", "(xiv) **optimize** — Make the best or most effective use of a workflow, system, or resource.", "(xv) **credible** — Believable, trustworthy, and convincing (supported by reliable evidence)."]}, "q3": {"title": "Q3(a) & Q3(b) [15 + 15 = 30 Marks]: Identify 15 Subtle Mistakes in the Email & Rewrite Formally", "original_email": "Subject: Meeting discussion request\nDear Dr. Rahman\nI hope you are well. I am writing to enquire about a meeting scheduled next Wednesday. I would like to discuss the research proposal, funding issues, and timeline of the project. I also attach the document we discussed last week. Could you please tell me if there is any more information required from me.\nLiana.", "fifteen_mistakes": ["1. **'Meeting discussion request' (Subject line)** — Redundant and vague ('Meeting' already implies discussion; lacks capitalization and project specificity -> *Subject: Inquiry Regarding Project Research Meeting on Wednesday*).", "2. **'Dear Dr. Rahman' (Salutation punctuation)** — Missing a comma (or colon) after the salutation (*Dear Dr. Rahman,*).", "3. **'I hope you are well.' (Opening tone)** — Slightly informal/generic; in formal academic/business emails, *'I hope this email finds you well.'* is preferred.", "4. **'enquire'** — Spelling/usage inconsistency with American/standard business style or better phrased as *'confirm / follow up on'*. ", "5. **'a meeting'** — Wrong article: since the meeting is already scheduled and known to both parties, use the definite article **'the meeting'**.", "6. **'scheduled next Wednesday'** — Missing preposition **'for'**: write *'scheduled **for** next Wednesday'*. ", "7. **'funding issues'** — Negative/informal word choice ('issues' implies problems); in formal business English, use *'funding allocation'* or *'financial requirements'*. ", "8. **'and timeline of the project'** — Missing parallel definite article **'the'**: write *'and **the** project timeline'*.", "9. **'I also attach'** — Unnatural present simple tense for attachments; use *'I have also attached'* or *'Please find attached'*. ", "10. **'the document'** — Too vague; specify *'the revised proposal document'*. ", "11. **'we discussed'** — Repetition of the verb *'discuss/discussion'* three times in four lines (Subject: *discussion*, Line 3: *discuss*, Line 4: *discussed*); replace with *'we reviewed'*. ", "12. **'if there is'** — In formal enquiries, **'whether'** is preferred over *'if'* (*'whether any further information is required'*).", "13. **'any more information'** — Informal phrasing; replace *'any more'* with formal **'any further'** or **'any additional'**. ", "14. **'from me.' (End of question)** — Missing a **question mark (`?`)** at the end of the polite direct question *'Could you please...?'* (or phrase as a statement *'Please let me know whether...'*). Also *'from my end'* is more formal.", "15. **'Liana.' (Sign-off)** — Missing a formal complimentary close (such as *'Sincerely,'* or *'Best regards,'*) and erroneously placing a period after the sender's name."], "formal_rewrite": "Subject: Follow-Up on Research Project Meeting Scheduled for Next Wednesday\n\nDear Dr. Rahman,\n\nI hope this email finds you well. I am writing to follow up on the meeting scheduled for next Wednesday. During the session, I would like to discuss the research proposal, funding requirements, and the overall project timeline.\n\nPlease find attached the supporting document that we reviewed last week. Could you kindly let me know whether any additional information is required from my end prior to the meeting?\n\nSincerely,\nLiana"}, "q4": {"title": "Q4(a) & Q4(b) [15 + 15 = 30 Marks]: Paraphrase & Summarize the EV Paragraph", "original": "Electric vehicles (EVs) are rapidly gaining popularity around the world due to concerns about pollution and climate change. They help reduce greenhouse gas emissions and decrease reliance on fossil fuels. In addition, advances in battery technology and the expansion of charging infrastructure have made EVs more practical for everyday use. Governments and companies are offering incentives such as tax benefits, subsidies, and investment in charging stations to encourage adoption. As a result, more people are considering EVs as a feasible and environmentally friendly alternative to traditional gasoline-powered vehicles.", "paraphrase": "Driven by growing awareness of environmental degradation and global warming, electric vehicles (EVs) are experiencing a sharp rise in global demand. These vehicles play a vital role in cutting carbon emissions and lowering dependence on conventional petroleum-based fuels. Furthermore, ongoing improvements in battery efficiency alongside wider networks of charging stations have significantly enhanced the daily usability of EVs. Both public authorities and private enterprises are actively promoting this transition through financial reliefs, state grants,
