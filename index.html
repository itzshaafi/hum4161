// ================= PERSISTENT STATE & LIQUID UI HELPERS =================
let verbSolvedSet = new Set(JSON.parse(localStorage.getItem('hum4161_solved_verbs') || '[]'));
let verbStarredSet = new Set(JSON.parse(localStorage.getItem('hum4161_starred_verbs') || '[]'));
const RADIAL_CIRCUMFERENCE = 2 * Math.PI * 18; // r = 18 -> 113.097

function showToast(msg) {
    const t = document.getElementById('liquidToast');
    const txt = document.getElementById('liquidToastText');
    if (txt) txt.textContent = msg;
    if (t) t.classList.add('show');
}

function setRadialProgress(circleId, textId, pct, customColor) {
    const circle = document.getElementById(circleId);
    const text = document.getElementById(textId);
    const clamped = Math.max(0, Math.min(100, Math.round(pct)));
    if (circle) {
        const offset = RADIAL_CIRCUMFERENCE - (clamped / 100) * RADIAL_CIRCUMFERENCE;
        circle.style.strokeDashoffset = offset;
        if (customColor) {
            circle.style.stroke = customColor;
        } else {
            circle.style.stroke = clamped >= 80 ? 'var(--success)' : clamped >= 50 ? 'var(--warning)' : 'var(--danger)';
        }
    }
    if (text) text.textContent = `${clamped}%`;
}

function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
    const isCollapsed = document.body.classList.contains('sidebar-collapsed');
    localStorage.setItem('hum4161_sidebar_collapsed', isCollapsed ? '1' : '0');
    const btn = document.getElementById('sidebarToggleBtn');
    if (btn) btn.textContent = isCollapsed ? '»' : '«';
    setTimeout(redrawAllVisibleGitConnectors, 340);
}

function saveHubProgress() {
    localStorage.setItem('hum4161_solved_verbs', JSON.stringify([...verbSolvedSet]));
    localStorage.setItem('hum4161_starred_verbs', JSON.stringify([...verbStarredSet]));
    updateGlobalMasteryUI();
}

function updateGlobalMasteryUI() {
    const solvedCount = verbSolvedSet.size;
    const starCount = verbStarredSet.size;
    const txt = document.getElementById('globalMasteryText');
    const bar = document.getElementById('globalMasteryBar');
    if (txt) txt.textContent = `${solvedCount}/100 • ${starCount}⭐`;
    if (bar) bar.style.width = `${Math.min(100, solvedCount)}%`;
    const statsEl = document.getElementById('verbStats');
    if (statsEl) statsEl.textContent = `${solvedCount} / 100`;
    setRadialProgress('verbMasteryRadial', 'verbMasteryPct', solvedCount, 'var(--primary)');
}

function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('hum4161_theme', next);
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.textContent = next === 'dark' ? '🌙 Liquid Dark' : '☀️ Daylight Glass';
}

function fmtMd(str) {
    if (!str) return '';
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
}

function stripFormatting(str) {
    if (!str) return '';
    return str
        .replace(/\*\*\[\d+\]\s*/g, '')
        .replace(/\[\d+\]/g, '')
        .replace(/\[[A-Za-z]\]/g, (m) => m.slice(1, -1))
        .replace(/\*\*/g, '')
        .replace(/\*/g, '')
        .replace(/\s+/g, ' ')
        .trim();
}

function switchTab(id, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (btn) btn.classList.add('active');
    const lbl = document.getElementById('islandActiveLabel');
    const labelSpan = btn ? btn.querySelector('.tab-label') : null;
    if (lbl && labelSpan) lbl.textContent = labelSpan.textContent;
    setTimeout(redrawAllVisibleGitConnectors, 60);
}

// ================= ADVANCED DIFF, HEATMAP & RULE ENGINE =================
const CATEGORY_META = {
    cap:   { label: 'Capitalization', color: 'var(--err-cap)',   cls: 'legend-cap' },
    punct: { label: 'Punctuation',    color: 'var(--err-punct)', cls: 'legend-punct' },
    space: { label: 'Hyphen / Space', color: 'var(--err-space)', cls: 'legend-space' },
    lex:   { label: 'Word / Lexical', color: 'var(--err-lex)',   cls: 'legend-lex' }
};

function normalizeQuotes(s) {
    return (s || '').replace(/[’‘]/g, "'").replace(/[“”]/g, '"');
}

function stripPunctuationOnly(s) {
    return normalizeQuotes(s).replace(/[^a-zA-Z0-9]/g, '');
}

function findRuleExplanation(userTok, modelTok, cat, ruleList) {
    const cleanModelBase = stripPunctuationOnly(modelTok).toLowerCase();

    if (Array.isArray(ruleList)) {
        for (const r of ruleList) {
            const plainR = r.replace(/\*\*/g, '');
            const lowerR = plainR.toLowerCase();
            if (
                (cleanModelBase.length > 1 && lowerR.includes(cleanModelBase)) ||
                (modelTok.toLowerCase() === 'i' && lowerR.includes("pronoun 'i'"))
            ) {
                return plainR.replace(/^\d+\s*(&\s*\d+)?\.\s*/, '');
            }
        }
    }

    if (cat === 'cap') {
        if (modelTok === 'I') return "Cap Rule 2: The pronoun 'I' must always be capitalized.";
        return `Cap Rule 1/3/4: Capitalize '${modelTok}' (sentence start, proper noun, acronym, or day/month).`;
    }
    if (cat === 'space') {
        return `Hyphen / Spacing Rule: Join compound modifier with a hyphen ('${modelTok}') before a noun.`;
    }
    if (cat === 'punct') {
        if (modelTok.includes(':')) return `Colon Rule 1: Use a colon after a complete clause to introduce a list ('${modelTok}').`;
        if (modelTok.includes(';') || userTok.includes(';')) return `Semicolon / Comma Rule: Check clause connector punctuation ('${modelTok}').`;
        if (modelTok.includes("'") || modelTok.includes("’")) return `Apostrophe Rule: Add an apostrophe for possession or contraction ('${modelTok}').`;
        if (modelTok.includes('"') || modelTok.includes('“') || modelTok.includes('”')) return `Quotation Rule: Enclose direct speech or titles in quotation marks ('${modelTok}').`;
        if (modelTok.endsWith('.')) return `Period Rule 1: End a complete declarative sentence with a period ('${modelTok}').`;
        if (modelTok.endsWith(',')) return `Comma Rule: Add a comma after introductory phrases, list items, or before compound clauses ('${modelTok}').`;
        return `Punctuation Rule: Expected '${modelTok}' instead of '${userTok}'.`;
    }
    return `Lexical Check: Keep original passage wording ('${modelTok}').`;
}

function analyzePassageDiff(userText, cleanModelText, ruleList) {
    const uTokens = userText.trim() ? userText.trim().split(/\s+/) : [];
    const mTokens = cleanModelText.trim().split(/\s+/);

    const aligned = [];
    let i = 0, j = 0;
    const counts = { cap: 0, punct: 0, space: 0, lex: 0 };
    let exactMatches = 0;

    while (j < mTokens.length) {
        const u = uTokens[i] !== undefined ? uTokens[i] : '';
        const m = mTokens[j];

        // 1. Exact Match (including curly/straight quote normalization)
        if (normalizeQuotes(u) === normalizeQuotes(m)) {
            aligned.push({ status: 'ok', userTok: u, modelTok: m });
            exactMatches++;
            i++; j++;
            continue;
        }

        // 2. Check if user split a hyphenated compound word into 2 space-separated words (e.g. "ai based" vs "AI-based")
        if (i + 1 < uTokens.length) {
            const combined = uTokens[i] + '-' + uTokens[i + 1];
            if (stripPunctuationOnly(combined).toLowerCase() === stripPunctuationOnly(m).toLowerCase()) {
                const userCompound = `${uTokens[i]} ${uTokens[i + 1]}`;
                const rule = findRuleExplanation(userCompound, m, 'space', ruleList);
                aligned.push({ status: 'err', cat: 'space', userTok: userCompound, modelTok: m, rule });
                counts.space++;
                i += 2; j++;
                continue;
            }
        }

        // 3. Same underlying letters (Capitalization or Punctuation error)
        const baseU = stripPunctuationOnly(u);
        const baseM = stripPunctuationOnly(m);
        if (baseU.toLowerCase() === baseM.toLowerCase() && baseM.length > 0) {
            const punctU = normalizeQuotes(u).replace(/[a-zA-Z0-9]/g, '');
            const punctM = normalizeQuotes(m).replace(/[a-zA-Z0-9]/g, '');
            const cat = (punctU !== punctM) ? 'punct' : 'cap';
            const rule = findRuleExplanation(u, m, cat, ruleList);
            aligned.push({ status: 'err', cat, userTok: u, modelTok: m, rule });
            counts[cat]++;
            i++; j++;
            continue;
        }

        // 4. Lookahead resynchronization (user omitted or inserted a word)
        let synced = false;
        for (let look = 1; look <= 3; look++) {
            if (i + look < uTokens.length && stripPunctuationOnly(uTokens[i + look]).toLowerCase() === baseM.toLowerCase()) {
                const extra = uTokens.slice(i, i + look).join(' ');
                aligned.push({ status: 'err', cat: 'space', userTok: extra, modelTok: '[remove]', rule: 'Extra word/space inserted.' });
                counts.space++;
                i += look;
                synced = true;
                break;
            }
            if (j + look < mTokens.length && baseU.toLowerCase() === stripPunctuationOnly(mTokens[j + look]).toLowerCase()) {
                aligned.push({ status: 'err', cat: 'lex', userTok: '[missing]', modelTok: m, rule: `Missing word: '${m}'.` });
                counts.lex++;
                j++;
                synced = true;
                break;
            }
        }
        if (synced) continue;

        // 5. Fallback lexical mismatch
        const cat = 'lex';
        const displayU = u || '[missing]';
        const rule = findRuleExplanation(displayU, m, cat, ruleList);
        aligned.push({ status: 'err', cat, userTok: displayU, modelTok: m, rule });
        counts[cat]++;
        i++; j++;
    }

    const accuracyPct = mTokens.length ? Math.round((exactMatches / mTokens.length) * 100) : 0;
    const totalErrors = counts.cap + counts.punct + counts.space + counts.lex;

    return { aligned, counts, exactMatches, totalModelTokens: mTokens.length, accuracyPct, totalErrors };
}

function renderDiffVisualization(containerId, userText, rawModelText, ruleList) {
    const cleanModel = stripFormatting(rawModelText);
    const box = document.getElementById(containerId);
    if (!box) return;

    const prevMode = box.getAttribute('data-view-mode') || 'inline';
    const analysis = analyzePassageDiff(userText, cleanModel, ruleList);
    const { aligned, counts, exactMatches, totalModelTokens, accuracyPct, totalErrors } = analysis;

    const offset = RADIAL_CIRCUMFERENCE - (accuracyPct / 100) * RADIAL_CIRCUMFERENCE;
    const ringColor = accuracyPct >= 90 ? 'var(--success)' : accuracyPct >= 65 ? 'var(--warning)' : 'var(--danger)';

    let errIdx = 0;
    const inlineHtml = aligned.map((item) => {
        if (item.status === 'ok') {
            return `<span class="diff-token-ok">${item.modelTok}</span>`;
        }
        const eid = `${containerId}-err-${errIdx++}`;
        const safeUser = item.userTok.replace(/"/g, '&quot;');
        const safeModel = item.modelTok.replace(/"/g, '&quot;');
        const safeRule = item.rule.replace(/"/g, '&quot;');
        return `<span class="diff-token-err" tabindex="0" data-cat="${item.cat}" data-err-id="${eid}" data-user="${safeUser}" data-model="${safeModel}" data-rule="${safeRule}">${item.userTok}</span>`;
    }).join(' ');

    errIdx = 0;
    const splitLeftHtml = aligned.map((item) => {

function switchDiffViewMode(containerId, mode) {
    const box = document.getElementById(containerId);
    if (!box) return;
    box.setAttribute('data-view-mode', mode);
    const inlineEl = document.getElementById(`${containerId}-inline`);
    const splitEl = document.getElementById(`${containerId}-split`);
    const btns = box.querySelectorAll('.view-mode-btn');
    btns.forEach((b, idx) => {
        b.classList.toggle('active', (mode === 'inline' && idx === 0) || (mode === 'split' && idx === 1));
    });
    if (inlineEl) inlineEl.style.display = mode === 'inline' ? 'block' : 'none';
    if (splitEl) splitEl.classList.toggle('active', mode === 'split');
    if (mode === 'split') {
        requestAnimationFrame(() => drawGitConnectors(containerId));
    }
}

function bindDiffInteractions(containerId) {
    const box = document.getElementById(containerId);
    if (!box) return;

    const errTokens = box.querySelectorAll('.diff-token-err');
    errTokens.forEach(tok => {
        tok.addEventListener('mouseenter', (e) => {
            showFloatingDiffTooltip(tok, e);
            highlightSplitCounterpart(containerId, tok.getAttribute('data-err-id'), true);
        });
        tok.addEventListener('mousemove', (e) => positionFloatingTooltip(e));
        tok.addEventListener('mouseleave', () => {
            hideFloatingDiffTooltip();
            highlightSplitCounterpart(containerId, tok.getAttribute('data-err-id'), false);
        });
        tok.addEventListener('focus', (e) => showFloatingDiffTooltip(tok, e));
        tok.addEventListener('blur', () => hideFloatingDiffTooltip());
    });

    const paneL = document.getElementById(`${containerId}-pane-L`);
    const paneR = document.getElementById(`${containerId}-pane-R`);
    if (paneL && paneR) {
        let isSyncingLeft = false;
        let isSyncingRight = false;
        paneL.addEventListener('scroll', () => {
            if (!isSyncingLeft) {
                isSyncingRight = true;
                const ratio = paneL.scrollTop / Math.max(1, paneL.scrollHeight - paneL.clientHeight);
                paneR.scrollTop = ratio * (paneR.scrollHeight - paneR.clientHeight);
                requestAnimationFrame(() => drawGitConnectors(containerId));
            }
            isSyncingLeft = false;
        });
        paneR.addEventListener('scroll', () => {
            if (!isSyncingRight) {
                isSyncingLeft = true;
                const ratio = paneR.scrollTop / Math.max(1, paneR.scrollHeight - paneR.clientHeight);
                paneL.scrollTop = ratio * (paneL.scrollHeight - paneL.clientHeight);
                requestAnimationFrame(() => drawGitConnectors(containerId));
            }
            isSyncingRight = false;
        });
    }
}

function drawGitConnectors(containerId) {
    const splitEl = document.getElementById(`${containerId}-split`);
    const svg = document.getElementById(`${containerId}-svg`);
    if (!splitEl || !svg || !splitEl.classList.contains('active')) return;

    const splitRect = splitEl.getBoundingClientRect();
    const leftTokens = splitEl.querySelectorAll('.split-left-tok');
    const paths = [];

    leftTokens.forEach(leftTok => {
        const eid = leftTok.getAttribute('data-err-id');
        const cat = leftTok.getAttribute('data-cat') || 'punct';
        const rightTok = document.getElementById(`${eid}-R`);
        if (!rightTok) return;

        const rL = leftTok.getBoundingClientRect();
        const rR = rightTok.getBoundingClientRect();

        if (rL.bottom < splitRect.top || rL.top > splitRect.bottom) return;

        const x1 = rL.right - splitRect.left;
        const y1 = rL.top + rL.height / 2 - splitRect.top;
        const x2 = rR.left - splitRect.left;
        const y2 = rR.top + rR.height / 2 - splitRect.top;
        const cx1 = x1 + (x2 - x1) * 0.42;
        const cx2 = x1 + (x2 - x1) * 0.58;
        const stroke = CATEGORY_META[cat] ? CATEGORY_META[cat].color : 'var(--primary)';

        paths.push(`<path class="git-connector-path" id="line-${eid}" d="M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}" style="stroke:${stroke};" />`);
    });

    svg.innerHTML = paths.join('');
}

function redrawAllVisibleGitConnectors() {
    ['quiz-q1-diff', 'punctWorkbenchDiff'].forEach(id => drawGitConnectors(id));
}
window.addEventListener('resize', redrawAllVisibleGitConnectors);

function highlightSplitCounterpart(containerId, errId, active) {
    const l = document.getElementById(`${errId}-L`);
    const r = document.getElementById(`${errId}-R`);
    const line = document.getElementById(`line-${errId}`);
    if (l) l.classList.toggle('linked-hover', active);
    if (r) r.classList.toggle('linked-hover', active);
    if (line) line.classList.toggle('active-line', active);
}

function showFloatingDiffTooltip(tok, evt) {
    const tt = document.getElementById('globalDiffTooltip');
    if (!tt) return;
    const cat = tok.getAttribute('data-cat') || 'punct';
    const userVal = tok.getAttribute('data-user') || '';
    const modelVal = tok.getAttribute('data-model') || '';
    const ruleVal = tok.getAttribute('data-rule') || '';
    const meta = CATEGORY_META[cat] || CATEGORY_META.punct;

    tt.innerHTML = `
        <div class="tt-header">
            <span class="tt-cat-badge ${meta.cls}">${meta.label} Error</span>
            <span style="font-size:0.7rem; color:var(--muted);">Hover Inspector</span>
        </div>
        <div class="tt-transform">
            <span class="tt-wrong">${userVal}</span>
            <span style="color:var(--muted);">➔</span>
            <span class="tt-right">${modelVal}</span>
        </div>
        <div class="tt-rule">${ruleVal}</div>
    `;
    tt.classList.add('visible');
    positionFloatingTooltip(evt);
}

function positionFloatingTooltip(evt) {
    const tt = document.getElementById('globalDiffTooltip');
    if (!tt || !tt.classList.contains('visible')) return;
    const pad = 14;
    const rect = tt.getBoundingClientRect();
    let x = (evt.clientX || 200) - rect.width / 2;
    let y = (evt.clientY || 200) - rect.height - pad;

    if (x < 12) x = 12;
    if (x + rect.width > window.innerWidth - 12) x = window.innerWidth - rect.width - 12;
    if (y < 12) y = (evt.clientY || 200) + 22;

    tt.style.left = `${x}px`;
    tt.style.top = `${y}px`;
}

function hideFloatingDiffTooltip() {
    const tt = document.getElementById('globalDiffTooltip');
    if (tt) tt.classList.remove('visible');
}

            if (filterMode === 'madam') return s.no <= 40;

                    </div>
                </div>
                <p style="font-size:1.06rem; margin:10px 0;">${fmtMd(s.wrong_sentence)}</p>
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <span style="color:var(--danger); font-weight:700;">Wrong Verb: <code>${fmtMd(s.wrong_verb)}</code> ➡️</span>
                    <input type="text" id="vb-inp-${s.no}" placeholder="Type correct verb form..." style="width:240px;" onkeydown="if(event.key==='Enter') checkVerbSentence(${s.no})">
                    <button class="btn" onclick="checkVerbSentence(${s.no})">Check</button>
                    <button class="btn btn-outline" onclick="showVerbSentenceAns(${s.no})">Show Answer &amp; Rule</button>
                </div>
                <div id="vb-fb-${s.no}" class="feedback-msg"></div>
            </div>
        `).join('') || `<div class="card"><p style="margin:0; color:var(--muted);">No matching verb drills found.</p></div>`;
    } else {
        cont.innerHTML = DATA.verbPassages
            .filter(p => p.title.toLowerCase().includes(q) || p.faulty.toLowerCase().includes(q))
            .map(p => `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                    <h3 style="margin:0;">${fmtMd(p.title)}</h3>
                    <span class="badge">10 Wrong Verbs = 5 Marks</span>
                </div>
                <div class="reference-slate"><div class="passage-body">${fmtMd(p.faulty)}</div></div>
                <div class="quick-slots-grid">
                    ${p.answers.map((_, i) => `
                        <div class="slot-box">
                            <label>Verb (${i+1}):</label>
                            <input type="text" id="vbp-${p.id}-slot-${i}" placeholder="Correction for (${i+1})..." onkeydown="if(event.key==='Enter') checkVerbPassageSlots(${p.id})">
                        </div>
                    `).join('')}
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn" onclick="checkVerbPassageSlots(${p.id})">⚡ Auto-Check My 10 Verbs</button>
                    <button class="btn btn-outline" onclick="document.getElementById('vbp-sol-${p.id}').classList.toggle('show')">Toggle 10 Verb Corrections</button>
                </div>
                <div id="vbp-sol-${p.id}" class="solution-box">
                    <ul>${p.answers.map(a => `<li>${fmtMd(a)}</li>`).join('')}</ul>
                </div>
            </div>
        `).join('');
    }
    updateGlobalMasteryUI();
}

function checkVerbPassageSlots(pid) {
    const p = DATA.verbPassages.find(x => x.id === pid);
    if (!p) return;
    p.answers.forEach((ans, i) => {
        const inp = document.getElementById(`vbp-${pid}-slot-${i}`);
        if (!inp) return;
        const val = inp.value.trim().toLowerCase();
        const targets = extractVerbSlotTarget(ans);
        inp.className = (val && targets.some(t => t === val)) ? 'slot-ok' : 'slot-err';
    });
    document.getElementById(`vbp-sol-${pid}`).classList.add('show');
}

function checkVerbSentence(no) {
    const item = DATA.verbSentences.find(x => x.no === no);
    const val = document.getElementById(`vb-inp-${no}`).value.trim().toLowerCase();
    const fb = document.getElementById(`vb-fb-${no}`);
    const accepted = item.correct_verb.toLowerCase().split(/\/|\(|or/).map(x => x.trim()).filter(Boolean);
    if (val && accepted.some(a => a === val || item.correct_verb.toLowerCase() === val)) {
        fb.className = 'feedback-msg ok';
        fb.innerHTML = `✅ <strong>Correct!</strong> Answer: <code>${item.correct_verb}</code> — <em>${item.why}</em>`;
        verbSolvedSet.add(no);
        saveHubProgress();
    } else {
        fb.className = 'feedback-msg err';
        fb.innerHTML = `❌ Not quite. Correct Form: <strong><code>${item.correct_verb}</code></strong> — <em>${item.why}</em>`;
    }
}

function showVerbSentenceAns(no) {
    const item = DATA.verbSentences.find(x => x.no === no);
    const fb = document.getElementById(`vb-fb-${no}`);
    fb.className = 'feedback-msg ok';
    fb.innerHTML = `💡 <strong>Correct Verb: <code>${item.correct_verb}</code></strong> (${item.rule}) — <em>${item.why}</em>`;
}

function revealAllVerbSentences() {
    DATA.verbSentences.forEach(s => {
        const el = document.getElementById(`vb-fb-${s.no}`);
        if (el) showVerbSentenceAns(s.no);
    });
}

function revealAllCMSentences() {

// ================= TAB 4: PUNCTUATION WORKBENCH =================
function initPunctWorkbench() {
    const sel = document.getElementById('punctSelect');
    sel.innerHTML = '';
    DATA.punctPassages.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = `exam-${idx}`;
        opt.textContent = `10-Mistake Exam Passage #${p.id}: ${p.title}`;
        sel.appendChild(opt);
    });
    DATA.madamPunct.forEach((m, idx) => {
        const opt = document.createElement('option');
        opt.value = `madam-${idx}`;
        opt.textContent = `Madam's Worksheet Passage #${m.no}: ${m.title}`;
        sel.appendChild(opt);
    });
    renderPunctWorkbench();
}

function renderPunctWorkbench() {
    const val = document.getElementById('punctSelect').value;
    const [type, idxStr] = val.split('-');
    const idx = parseInt(idxStr, 10);
    const cont = document.getElementById('punctWorkbenchContainer');

    const isExam = type === 'exam';
    const item = isExam ? DATA.punctPassages[idx] : DATA.madamPunct[idx];
    const faultyTxt = isExam ? item.faulty : item.original;
    const rulesList = isExam ? item.ten_mistakes : item.key_rules;

    cont.innerHTML = `
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <h3 style="margin:0;">${fmtMd(item.title)}</h3>
                <span class="badge">${isExam ? '10 Mistakes = 5 Marks' : "Madam's Official Worksheet"}</span>
            </div>

            <!-- RECESSED REFERENCE PROMPT SLATE -->
            <div class="reference-slate">
                <div class="pane-micro-header">
                    <span>📄 Original Unpunctuated Passage (Read-Only Reference)</span>
                    <span>Reference Prompt</span>
                </div>
                <div class="passage-body">${fmtMd(faultyTxt)}</div>
            </div>

            <!-- ELEVATED ACTIVE EDITOR WORKSPACE -->
            <div class="active-editor-shell">
                <div class="active-editor-header">
                    <span class="editor-focus-badge"><span class="editor-live-dot"></span> Interactive Punctuation Editor • Live Keystroke Telemetry</span>
                    <span style="font-size:0.75rem; color:var(--muted);">Type below to update radial accuracy, categorized heatmaps &amp; Git split view</span>
                </div>
                <textarea id="punctWorkbenchTextarea" oninput="checkPunctWorkbenchDiff()">${faultyTxt}</textarea>
            </div>

            <div id="punctWorkbenchDiff" class="diff-viz-dashboard"></div>

            <div id="punctWorkbenchSol" class="solution-box">
                <p><strong>✅ Model Corrected Passage:</strong><br>${fmtMd(item.corrected)}</p>
                <p><strong>All Rules &amp; Corrections Explained:</strong></p>
                <ul>${rulesList.map(r => `<li>${fmtMd(r)}</li>`).join('')}</ul>
            </div>
        </div>
    `;

    checkPunctWorkbenchDiff();
}

function checkPunctWorkbenchDiff() {
    const val = document.getElementById('punctSelect').value;
    const [type, idxStr] = val.split('-');
    const idx = parseInt(idxStr, 10);
    const isExam = type === 'exam';
    const item = isExam ? DATA.punctPassages[idx] : DATA.madamPunct[idx];
    const rulesList = isExam ? item.ten_mistakes : item.key_rules;
    const userTxt = (document.getElementById('punctWorkbenchTextarea') || {value: ''}).value;
    renderDiffVisualization('punctWorkbenchDiff', userTxt, item.corrected, rulesList);
}

function togglePunctSolution() {
    const el = document.getElementById('punctWorkbenchSol');
    if (el) el.classList.toggle('show');
}

            <div class="card"><h3>${fmtMd(pyq.q2a.title)}</h3><div class="reference-slate"><div class="passage-body">${fmtMd(pyq.q2a.original_with_answers)}</div></div><ul>${pyq.q2a.explanations.map(e => `<li>${fmtMd(e)}</li>`).join('')}</ul></div>

// ================= SPOTLIGHT SEARCH MODAL (Cmd/Ctrl+K) =================
function openCmdModal() {
    document.getElementById('cmdBackdrop').classList.add('open');
    const inp = document.getElementById('cmdSearchInput');
    inp.focus();
    renderCmdResults();
}
function closeCmdModal() {
    document.getElementById('cmdBackdrop').classList.remove('open');
}
document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCmdModal();
    } else if (e.key === 'Escape') {
        closeCmdModal();
    }
});

function renderCmdResults() {
    const q = (document.getElementById('cmdSearchInput').value || '').trim().toLowerCase();
    const cont = document.getElementById('cmdResultsContainer');
    if (!q) {
        cont.innerHTML = `<p style="color:var(--muted); margin:6px;">Type any keyword (e.g. <code>high time</code>, <code>neither</code>, <code>discuss</code>, <code>equipment</code>, <code>colon</code>, <code>passive</code>) to search across all 44 Verb Rules, 100 Common Mistakes, and 100 Verb Drills.</p>`;
        return;
    }
    const results = [];
    DATA.verbRules.forEach(r => {
        if (r.title.toLowerCase().includes(q) || r.rule.toLowerCase().includes(q) || r.wrong_to_right.toLowerCase().includes(q)) {
            results.push(`<div class="cmd-item"><span class="badge">Verb Rule #${r.rule_no}</span> <strong>${fmtMd(r.title)}</strong><div style="font-size:0.86rem; margin-top:4px;">${fmtMd(r.rule)}<br><span style="color:var(--primary);">Trap: ${fmtMd(r.wrong_to_right)}</span></div></div>`);
        }
    });
    DATA.commonMistakes100.forEach(c => {
        if (c.wrong.toLowerCase().includes(q) || c.right.toLowerCase().includes(q) || c.why.toLowerCase().includes(q)) {
            results.push(`<div class="cmd-item"><span class="badge">Common Mistake #${c.id}</span> <span style="color:#fb7185; text-decoration:line-through;">${fmtMd(c.wrong)}</span> ➡️ <strong style="color:#34d399;">${fmtMd(c.right)}</strong><div style="font-size:0.85rem; color:var(--muted);">${fmtMd(c.why)}</div></div>`);
        }
    });
    DATA.verbSentences.forEach(s => {
        if (s.wrong_sentence.toLowerCase().includes(q) || s.correct_verb.toLowerCase().includes(q)) {
            results.push(`<div class="cmd-item"><span class="badge">Verb Drill #${s.no}</span> ${fmtMd(s.wrong_sentence)} ➡️ <strong style="color:#34d399;">${fmtMd(s.correct_verb)}</strong> <em style="font-size:0.84rem; color:var(--muted);">(${fmtMd(s.why)})</em></div>`);
        }
    });
    cont.innerHTML = results.slice(0, 25).join('') || `<p style="color:var(--muted); margin:6px;">No matches found for "${q}".</p>`;
}

});
