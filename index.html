with)", "why": "'Accuse' takes 'of'; 'charge' takes 'with'."}, {"id": 31, "cat": "2. Wrong Prepositions", "wrong": "guilty for negligence", "right": "guilty of negligence", "why": "'Guilty of' (and 'innocent of')."}, {"id": 32, "cat": "2. Wrong Prepositions", "wrong": "abide with the safety rules", "right": "abide by the safety rules", "why": "The phrasal verb is 'abide by'."}, {"id": 33, "cat": "2. Wrong Prepositions", "wrong": "compliant to the regulations", "right": "compliant with (OR comply with) the regulations", "why": "Always 'comply with' / 'compliant with'."}, {"id": 34, "cat": "2. Wrong Prepositions", "wrong": "depend / rely in the data", "right": "depend / rely on (or upon) the data", "why": "'Depend on' and 'rely on'."}, {"id": 35, "cat": "2. Wrong Prepositions", "wrong": "consist in five modules", "right": "consist of five modules", "why": "'Consist of' means 'be made up of'."}, {"id": 36, "cat": "2. Wrong Prepositions", "wrong": "confident to pass / confident of pass", "right": "confident of passing", "why": "'Confident of + V-ing'."}, {"id": 37, "cat": "2. Wrong Prepositions", "wrong": "aim to improve (in traditional British/Fitikides: aim at improving)", "right": "aim at improving", "why": "In Fitikides grammar tests, 'aim at + V-ing' is preferred."}, {"id": 38, "cat": "2. Wrong Prepositions", "wrong": "satisfied from the performance", "right": "satisfied with (OR pleased/disappointed with) the performance", "why": "Use 'with' after satisfied, dissatisfied, pleased, contented."}, {"id": 39, "cat": "2. Wrong Prepositions", "wrong": "interested for digital marketing", "right": "interested in digital marketing", "why": "Always 'interested in'."}, {"id": 40, "cat": "2. Wrong Prepositions", "wrong": "famous / renowned about its quality", "right": "famous / renowned for its quality", "why": "Use 'for' after famous, renowned, noted, notorious."}, {"id": 41, "cat": "2. Wrong Prepositions", "wrong": "divide the tasks between the four members", "right": "divide the tasks among the four members", "why": "Use 'between' for 2 people/things; use 'among' for 3 or more."}, {"id": 42, "cat": "2. Wrong Prepositions", "wrong": "beside, we must reduce costs", "right": "Besides, we must reduce costs", "why": "'Beside' = next to; 'Besides' = in addition to / moreover."}, {"id": 43, "cat": "2. Wrong Prepositions", "wrong": "travelled by foot", "right": "travelled on foot", "why": "We say 'by bus, by train, by car, by air', but 'on foot'."}, {"id": 44, "cat": "2. Wrong Prepositions", "wrong": "in Monday / on June / at 2025", "right": "on Monday / in June / in 2025 / at 10 a.m.", "why": "ON + days/dates; IN + months/years/seasons; AT + exact clock time."}, {"id": 45, "cat": "2. Wrong Prepositions", "wrong": "married with a banker", "right": "married to a banker", "why": "Always 'married to' (and 'engaged to')."}, {"id": 46, "cat": "3. Uncountable & Noun Number Traps", "wrong": "all the informations / an information", "right": "all the information / a piece of information", "why": "'Information' is strictly uncountable—never add -s or use 'an'."}, {"id": 47, "cat": "3. Uncountable & Noun Number Traps", "wrong": "valuable advices", "right": "valuable advice / pieces of advice", "why": "'Advice' is uncountable and takes a singular verb."}, {"id": 48, "cat": "3. Uncountable & Noun Number Traps", "wrong": "modern laboratory equipments", "right": "modern laboratory equipment", "why": "'Equipment' is uncountable—never 'equipments'."}, {"id": 49, "cat": "3. Uncountable & Noun Number Traps", "wrong": "new office furnitures were bought", "right": "new office furniture was bought", "why": "'Furniture' is uncountable and takes a singular verb (also in Madam's Worksheet Q21!)."}, {"id": 50, "cat": "3. Uncountable & Noun Number Traps", "wrong": "positive feedbacks from clients", "right": "positive feedback from clients", "why": "'Feedback' is uncountable in standard business English."}, {"id": 51, "cat": "3. Uncountable & Noun Number Traps", "wrong": "conducted several researches", "right": "conducted extensive research / several research studies", "why": "'Research' is uncountable (use 'research studies' or 'research projects' for plural)."}, {"id": 52, "cat": "3. Uncountable & Noun Number Traps", "wrong": "heavy luggages / baggages", "right": "heavy luggage / baggage", "why": "'Luggage' and 'baggage' are uncountable."}, {"id": 53, "cat": "3. Uncountable & Noun Number Traps", "wrong": "industrial machineries / mountain sceneries", "right": "industrial machinery / mountain scenery", "why": "'Machinery' and 'scenery' are uncountable."}, {"id": 54, "cat": "3. Uncountable & Noun Number Traps", "wrong": "many pending works / homeworks", "right": "much pending work / pending tasks / homework", "why": "'Work' (meaning labor/employment) and 'homework' are uncountable."}, {"id": 55, "cat": "3. Uncountable & Noun Number Traps", "wrong": "sufficient evidences", "right": "sufficient evidence", "why": "'Evidence' is uncountable in standard academic/business prose."}, {"id": 56, "cat": "3. Uncountable & Noun Number Traps", "wrong": "The news are very encouraging.", "right": "The news is very encouraging.", "why": "'News' ends in -s but is singular and uncountable."}, {"id": 57, "cat": "3. Uncountable & Noun Number Traps", "wrong": "Economics / Mathematics / Statistics / Politics are a core subject.", "right": "Economics / Mathematics / Statistics is a core subject.", "why": "Academic subjects ending in -ics take a singular verb."}, {"id": 58, "cat": "3. Uncountable & Noun Number Traps", "wrong": "One of the participant / employee was late.", "right": "One of the participants / employees was late.", "why": "After 'One of the / Each of the / Neither of the', the noun MUST be PLURAL, while the verb is SINGULAR."}, {"id": 59, "cat": "3. Uncountable & Noun Number Traps", "wrong": "less employees / less mistakes", "right": "fewer employees / fewer mistakes", "why": "Use 'fewer' with countable plural nouns; use 'less' with uncountable nouns ('less time, less money')."}, {"id": 60, "cat": "3. Uncountable & Noun Number Traps", "wrong": "many traffic / many work", "right": "much traffic / heavy traffic / much work", "why": "'Traffic' and 'work' are uncountable (use 'much' or 'a lot of', not 'many')."}, {"id": 61, "cat": "3. Uncountable & Noun Number Traps", "wrong": "two dozens pens / five thousands taka", "right": "two dozen pens / five thousand taka", "why": "When preceded by a specific number, 'dozen, hundred, thousand, million' do NOT take a plural -s."}, {"id": 62, "cat": "3. Uncountable & Noun Number Traps", "wrong": "the datas / the criterions / the phenomenons", "right": "the data (or dataset) / the criteria (singular: criterion) / the phenomena (singular: phenomenon)", "why": "'Criteria' and 'phenomena' are already plural; never add -s to 'criterion' or 'data'."}, {"id": 63, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "please revert back / return back to us", "right": "please revert / return (or reply) to us", "why": "'Revert' and 'return' already contain the meaning of 'back'."}, {"id": 64, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "repeat the instructions again", "right": "repeat the instructions", "why": "'Repeat' already means 'say/do again'."}, {"id": 65, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "collaborate together / cooperate together", "right": "collaborate / cooperate", "why": "Both words inherently mean working 'together'."}, {"id": 66, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "combine together / merge together", "right": "combine / merge", "why": "'Together' is redundant after 'combine' or 'merge'."}, {"id": 67, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "new innovation / past history / past experience", "right": "innovation / history / experience", "why": "All innovations are new; all history and experience are from the past."}, {"id": 68, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "mutual cooperation / mutual agreement between both", "right": "cooperation / mutual agreement", "why": "Cooperation is always mutual."}, {"id": 69, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "final outcome / end result", "right": "outcome / result", "why": "Outcomes and results are inherently at the end."}, {"id": 70, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "free gift / future prospects / advance planning", "right": "gift / prospects / planning", "why": "Modifiers 'free', 'future', and 'advance' repeat the noun's definition."}, {"id": 71, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "consensus of opinion", "right": "consensus", "why": "'Consensus' already means general agreement of opinion."}, {"id": 72, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "in my opinion, I think that...", "right": "In my opinion, ... (OR I think that...)", "why": "Using both in the same clause is redundant."}, {"id": 73, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "at 10 a.m. in the morning", "right": "at 10 a.m. (OR at 10 o'clock in the morning)", "why": "'a.m.' already means in the morning."}, {"id": 74, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "supposedly / Basic fundamentals", "right": "fundamentals (OR basic principles)", "why": "Fundamentals are basic by definition."}, {"id": 75, "cat": "4. Redundancy (Wordiness Traps)", "wrong": "sufficient enough", "right": "sufficient (OR enough)", "why": "Never use both 'sufficient' and 'enough' together."}, {"id": 76, "cat": "5. Conjunction & Clause Traps", "wrong": "Although the model appeared effective, but limitations were found.", "right": "Although the model appeared effective, limitations were found.", "why": "NEVER use both 'Although/Though' and 'but/yet' in the same sentence!"}, {"id": 77, "cat": "5. Conjunction & Clause Traps", "wrong": "Because the session ran late, so the team postponed the review.", "right": "Because the session ran late, the team postponed the review.", "why": "NEVER use both 'Because/Since/As' and 'so/therefore' in the same sentence!"}, {"id": 78, "cat": "5. Conjunction & Clause Traps", "wrong": "Both the manager as well as the assistants attended.", "right": "Both the manager and the assistants attended.", "why": "The correlative pair is 'Both X and Y', never 'Both X as well as Y'."}, {"id": 79, "cat": "5. Conjunction & Clause Traps", "wrong": "The reason for the delay is because the server crashed.", "right": "The reason for the delay is that the server crashed.", "why": "Write 'The reason is that...', never 'The reason is because...'."}, {"id": 80, "cat": "5. Conjunction & Clause Traps", "wrong": "Could you please tell me when will the meeting start?", "right": "Could you please tell me when the meeting will start?", "why": "In indirect/embedded questions, use statement word order (Subject + Verb), NOT inverted question order."}, {"id": 81, "cat": "5. Conjunction & Clause Traps", "wrong": "He asked me that where I was going.", "right": "He asked me where I was going.", "why": "Never use 'that' before a wh-word (where, when, why, how, what) or 'if/whether' in indirect speech."}, {"id": 82, "cat": "5. Conjunction & Clause Traps", "wrong": "Unless you do not submit the form, you cannot register.", "right": "Unless you submit the form, you cannot register.", "why": "'Unless' already means 'if...not'; never put a negative ('do not') inside an 'unless' or 'until' or 'lest' clause!"}, {"id": 83, "cat": "5. Conjunction & Clause Traps", "wrong": "Scarcely had the meeting started than the projector failed.", "right": "Scarcely had the meeting started when (or before) the projector failed.", "why": "'Scarcely/Hardly' pairs with 'when/before'; only 'No sooner' pairs with 'than'."}, {"id": 84, "cat": "5. Conjunction & Clause Traps", "wrong": "Not only he prepared the slides, but also delivered the talk.", "right": "He not only prepared the slides, but also delivered the talk.", "why": "Parallelism: 'not only' and 'but also' must be followed by the same grammatical part of speech."}, {"id": 85, "cat": "5. Conjunction & Clause Traps", "wrong": "The role involves planning, organizing, and to monitor performance.", "right": "The role involves planning, organizing, and monitoring performance.", "why": "Parallel structure in lists: all items must use the same form (all V-ing or all infinitives)."}, {"id": 86, "cat": "5. Conjunction & Clause Traps", "wrong": "Walking into the office, the computers were turned on.", "right": "Walking into the office, the technician turned on the computers.", "why": "Dangling participle: the subject after the comma must be the person doing the walking!"}, {"id": 87, "cat": "5. Conjunction & Clause Traps", "wrong": "One should always fulfil his contractual duties.", "right": "One should always fulfil one's contractual duties.", "why": "The indefinite pronoun 'One' pairs with 'one's', not 'his/their' in formal grammar tests."}, {"id": 88, "cat": "5. Conjunction & Clause Traps", "wrong": "Me and my friend visited the campus library.", "right": "My friend and I visited the campus library.", "why": "Subject pronoun 'I' (placed second for politeness) is required in subject position."}, {"id": 89, "cat": "6. Confused Words & Formal Tone", "wrong": "Inflation had a severe affect on profit margins.", "right": "Inflation had a severe effect on profit margins. (OR severely affected)", "why": "'Affect' is a verb (to influence); 'effect' is a noun (a result/impact)."}, {"id": 90, "cat": "6. Confused Words & Formal Tone", "wrong": "The consultant gave us a useful advise.", "right": "The consultant gave us useful advice. (OR advised us)", "why": "'Advice' (with C) is the uncountable noun; 'advise' (with S) is the verb."}, {"id": 91, "cat": "6. Confused Words & Formal Tone", "wrong": "The company changed it's privacy policy.", "right": "The company changed its privacy policy.", "why": "'Its' = possessive pronoun; 'it's' = contraction of 'it is / it has'."}, {"id": 92, "cat": "6. Confused Words & Formal Tone", "wrong": "We must not loose track of our research scope.", "right": "We must not lose track of our research scope.", "why": "'Lose' (verb) = fail to keep; 'loose' (adjective) = not tight."}, {"id": 93, "cat": "6. Confused Words & Formal Tone", "wrong": "Our department follows strict ethical principals.", "right": "Our department follows strict ethical principles.", "why": "'Principle' = rule/moral law; 'principal' = main/most important or head of an institution."}, {"id": 94, "cat": "6. Confused Words & Formal Tone", "wrong": "The new software compliments our existing workflow.", "right": "The new software complements our existing workflow.", "why": "'Complement' = complete/go well with; 'compliment' = praise."}, {"id": 95, "cat": "6. Confused Words & Formal Tone", "wrong": "We ordered paper and pens from the stationary supplier.", "right": "We ordered paper and pens from the stationery supplier.", "why": "'Stationery' (with E) = office paper/pens; 'stationary' (with A) = not moving."}, {"id": 96, "cat": "6. Confused Words & Formal Tone", "wrong": "Hybrid cars are very economic to run.", "right": "Hybrid cars are very economical to run.", "why": "'Economical' = cost-saving/efficient; 'economic' = relating to the national economy."}, {"id": 97, "cat": "6. Confused Words & Formal Tone", "wrong": "I also attach the document we discussed last week.", "right": "I have attached (OR Please find attached) the document we discussed last week.", "why": "In formal business emails (Previous Year Q3!), use 'I have attached' or 'Please find attached' rather than bare 'I also attach'."}, {"id": 98, "cat": "6. Confused Words & Formal Tone", "wrong": "I want you to send the report ASAP.", "right": "Could you please send the report at your earliest convenience?", "why": "Avoid blunt demands ('I want you to') and informal abbreviations ('ASAP') in formal business writing."}, {"id": 99, "cat": "6. Confused Words & Formal Tone", "wrong": "Dear Dr. Rahman (missing punctuation) ... Liana. (missing closing)", "right": "Dear Dr. Rahman, ... Sincerely, Liana", "why": "Formal business emails require a comma (or colon) after the salutation and a polite complimentary close ('Sincerely,' / 'Best regards,') before the signature."}, {"id": 100, "cat": "6. Confused Words & Formal Tone", "wrong": "I am writing to enquire about a meeting scheduled next Wednesday.", "right": "I am writing to inquire about the meeting scheduled for next Wednesday.", "why": "Use 'scheduled for [day]' and definite article 'the meeting' when referring to a specific agreed meeting (Previous Year Q3!)."}], "madamPunct": [{"no": 1, "title": "Madam's Worksheet Passage 1: Visit to the Neo Innovation Center", "original": "yesterday our team visited the neo innovation center in dhaka the manager welcomed us warmly and showed us several interesting projects including robotics automation and ai based tools she explained how these technologies will shape future industries and create new opportunities for young professionals after the tour we sat for a short session where she answered questions about training programs and internship possibilities everyone seemed excited about the experience and we agreed that the visit helped us understand the importance of technological skills in todays competitive job market", "corrected": "Yesterday, our team visited the Neo Innovation Center in Dhaka. The manager welcomed us warmly and showed us several interesting projects, including robotics, automation, and AI-based tools. She explained how these technologies will shape future industries and create new opportunities for young professionals. After the tour, we sat for a short session where she answered questions about training programs and internship possibilities. Everyone seemed excited about the experience, and we agreed that the visit helped us understand the importance of technological skills in today’s competitive job market.", "key_rules": ["**Yesterday,** -> Capitalize sentence start (Cap Rule 1) + comma after introductory time word (Comma Rule 2).", "**Neo Innovation Center in Dhaka.** -> Capitalize proper nouns of organization & city (Cap Rule 3) + period at end of sentence.", "**The manager...welcomed us warmly and showed us...** -> Capitalize 'The'; NO comma before 'and' because 'welcomed... and showed...' shares one subject (Comma Rule 3).", "**projects, including robotics, automation, and AI-based tools.** -> Comma before nonessential participial phrase ', including...', Oxford commas in list (Comma Rule 1), capitalize acronym **AI** (Cap Rule 9), hyphenate compound modifier **AI-based** (Hyphen Rule 1), and period.", "**She explained... young professionals.** -> Capitalize 'She' + period at end (note: 'how these technologies will...' is an indirect clause, so NO question mark!).", "**After the tour, we sat... possibilities.** -> Capitalize 'After' + introductory phrase comma (Comma Rule 2) + period.", "**Everyone seemed excited about the experience, and we agreed...** -> Comma before 'and' because it joins two complete sentences ('Everyone seemed...' and 'we agreed...') (Comma Rule 3).", "**today’s competitive job market.** -> Apostrophe for possession in **today’s** (Apostrophe Rule 1) + final period."]}, {"no": 2, "title": "Madam's Worksheet Passage 2: Seminar at North South University", "original": "last week my friend invited me to attend a seminar on digital marketing at north south university the speaker talked about current trends such as social media analytics influencer branding and content optimization he also shared several real life case studies to show how companies use data to make smarter decisions students asked many questions and the discussion became very interactive after the seminar my friend and i visited the campus library which has an impressive collection of business books the overall experience was enjoyable and i learned many useful ideas from the session", "corrected": "Last week, my friend invited me to attend a seminar on digital marketing at North South University. The speaker talked about current trends such as social media analytics, influencer branding, and content optimization. He also shared several real-life case studies to show how companies use data to make smarter decisions. Students asked many questions, and the discussion became very interactive. After the seminar, my friend and I visited the campus library, which has an impressive collection of business books. The overall experience was enjoyable, and I learned many useful ideas from the session.", "key_rules": ["**Last week,** -> Capitalize first word + introductory time phrase comma.", "**digital marketing at North South University.** -> General subject 'digital marketing' stays lowercase (Cap Rule 10), while proper institution name **North South University** is capitalized (Cap Rule 3) + period.", "**social media analytics, influencer branding, and content optimization.** -> List commas with Oxford comma (Comma Rule 1).", "**real-life case studies** -> Hyphenate compound adjective **real-life** before 'case studies' (Hyphen Rule 1).", "**Students asked many questions, and the discussion became very interactive.** -> Comma before 'and' joining two complete sentences (Comma Rule 3).", "**After the seminar, my friend and I visited the campus library, which has...** -> Introductory comma after 'After the seminar,', capitalize pronoun **I** (Cap Rule 2), and comma before nonessential relative clause **, which has...** (Comma Rule 4).", "**The overall experience was enjoyable, and I learned...** -> Comma before 'and' joining two independent clauses + capitalize **I**."]}, {"no": 3, "title": "Madam's Worksheet Passage 3: Sustainable Business Conference", "original": "during the annual conference on sustainable business practices professor rahman presented a detailed report about green supply chains he emphasized three major areas renewable energy adoption waste reduction strategies and eco friendly packaging solutions according to him companies that invest in sustainability not only improve their brand image but also reduce long term operational costs after the presentation several participants shared their own experiences about implementing green initiatives in different industries the session ended with a panel discussion where experts highlighted the importance of policy support and cross sector collaboration for achieving national sustainability goals", "corrected": "During the annual conference on sustainable business practices, Professor Rahman presented a detailed report about green supply chains. He emphasized three major areas: renewable energy adoption, waste-reduction strategies, and eco-friendly packaging solutions. According to him, companies that invest in sustainability not only improve their brand image but also reduce long-term operational costs. After the presentation, several participants shared their own experiences about implementing green initiatives in different industries. The session ended with a panel discussion where experts highlighted the importance of policy support and cross-sector collaboration for achieving national sustainability goals.", "key_rules": ["**During the annual conference on sustainable business practices, Professor Rahman...** -> Introductory prepositional phrase comma + capitalize title before name **Professor Rahman** (Cap Rule 6).", "**He emphasized three major areas: renewable energy adoption, waste-reduction strategies, and eco-friendly packaging solutions.** -> Colon (:) after a complete sentence introducing a list (Colon Rule 1) + list commas + hyphens in **waste-reduction** and **eco-friendly**.", "**According to him,** and **After the presentation,** -> Commas after introductory phrases (Comma Rule 2).", "**long-term operational costs** and **cross-sector collaboration** -> Hyphens in compound modifiers before nouns (Hyphen Rule 1)."]}, {"no": 4, "title": "Madam's Worksheet Passage 4: Shift to Hybrid Work Models", "original": "in recent years many organizations have shifted to hybrid work models combining remote and in office tasks although this approach offers flexibility it also creates new challenges managers must ensure clear communication effective teamwork and consistent performance monitoring employees on the other hand need discipline proper time management and a comfortable workspace at home interestingly several studies show that productivity often increases when workers are given more autonomy however companies must develop strong digital systems cybersecurity measures and training programs to support hybrid operations without these components the transition may lead to confusion delays and security risks", "corrected": "In recent years, many organizations have shifted to hybrid work models, combining remote and in-office tasks. Although this approach offers flexibility, it also creates new challenges. Managers must ensure clear communication, effective teamwork, and consistent performance monitoring. Employees, on the other hand, need discipline, proper time management, and a comfortable workspace at home. Interestingly, several studies show that productivity often increases when workers are given more autonomy. However, companies must develop strong digital systems, cybersecurity measures, and training programs to support hybrid operations. Without these components, the transition may lead to confusion, delays, and security risks.", "key_rules": ["**In recent years,** / **Although this approach offers flexibility,** / **Interestingly,** / **However,** / **Without these components,** -> Introductory word/phrase/clause commas (Comma Rule 2).", "**models, combining remote and in-office tasks.** -> Comma before participial modifier + hyphen in **in-office** (Hyphen Rule 1).", "**Employees, on the other hand, need...** -> Pair of commas around mid-sentence interrupter (Comma Rule 5).", "Three separate 3-item lists with Oxford commas (Comma Rule 1)."]}], "punctPassages": [{"id": 1, "title": "Passage 1: Financial Audit Briefing at Brac Bank", "faulty": "yesterday morning our audit team met with director kamal at brac bank in dhaka. We reviewed three critical areas internal controls, credit risk, and digital security. Although the branches performed well in summer several compliance gaps were identified in the third quarter. My colleague and i prepared a well structured summary for the board, and the managers promised to resolve the issues before friday.", "corrected": "**[1] Y**esterday morning**[2] ,** our audit team met with **[3] D**irector **[4] K**amal at **[5] B**rac **[B]**ank in **[6] D**haka. We reviewed three critical areas**[7] :** internal controls, credit risk, and digital security. Although the branches performed well in summer**[8] ,** several compliance gaps were identified in the third quarter. My colleague and **[9] I** prepared a **[10] well-structured** summary for the board, and the managers promised to resolve the issues before **F**riday.", "ten_mistakes": ["1. **yesterday -> Yesterday**: Capitalize the first word of the sentence (Cap Rule 1).", "2. **morning,**: Add a comma after the introductory time phrase 'Yesterday morning,' (Comma Rule 2).", "3. **director kamal -> Director Kamal**: Capitalize title used directly before a person's name (Cap Rule 6 & 3).", "4. **brac bank -> Brac Bank**: Capitalize the proper name of an organization/bank (Cap Rule 3).", "5. **dhaka -> Dhaka**: Capitalize the proper name of a city/place (Cap Rule 3).", "6. **areas:**: Add a colon after the complete clause 'We reviewed three critical areas' to introduce the list (Colon Rule 1).", "7. **summer,**: Add a comma after the introductory dependent clause 'Although the branches performed well in summer,' (Note: 'summer' stays lowercase per Cap Rule 4!).", "8. **i -> I**: Always capitalize the pronoun 'I' (Cap Rule 2).", "9. **well-structured**: Add a hyphen to the compound adjective before 'summary' (Hyphen Rule 1).", "10. **friday -> Friday**: Capitalize the name of a day of the week (Cap Rule 4)."]}, {"id": 2, "title": "Passage 2: Supply Chain Workshop in Chattogram", "faulty": "last monday our logistics department organized a workshop on supply chain management in chattogram the guest speaker, professor hasan, explained how ai driven forecasting reduces inventory waste. He highlighted three key benefits faster delivery, lower storage costs and improved customer satisfaction. After the session my supervisor asked where i had stored the vendors contracts.", "corrected": "**[1] L**ast **[2] M**onday**[3] ,** our logistics department organized a workshop on supply chain management in **[4] C**hattogram**[5] . T**he guest speaker, **[6] P**rofessor **[H]**asan, explained how **[7] AI-driven** forecasting reduces inventory waste. He highlighted three key benefits**[8] :** faster delivery, lower storage costs**[9] ,** and improved customer satisfaction. After the session, my supervisor asked where **[10] I** had stored the **vendors’** contracts.", "ten_mistakes": ["1. **last -> Last**: Capitalize the first word of the sentence (Cap Rule 1).", "2. **monday -> Monday**: Capitalize the day of the week (Cap Rule 4).", "3. **Monday,**: Add a comma after the introductory time phrase 'Last Monday,' (Comma Rule 2).", "4. **chattogram -> Chattogram**: Capitalize the proper noun city name (Cap Rule 3).", "5. **Chattogram. The**: Fix the run-on sentence with a period and capitalize 'The' (Period Rule 1 & Cap Rule 1).", "6. **professor hasan -> Professor Hasan**: Capitalize title + proper name (Cap Rule 6 & 3).", "7. **ai driven -> AI-driven**: Capitalize acronym 'AI' and hyphenate compound modifier (Cap Rule 9 & Hyphen Rule 1).", "8. **benefits:**: Add a colon after the complete sentence introducing the 3-item list (Colon Rule 1).", "9. **costs,**: Add the Oxford comma in the 3-item list (Comma Rule 1).", "10. **i / vendors -> I / vendors’**: Capitalize 'I' and add possessive apostrophe to 'vendors’' (Cap Rule 2 & Apostrophe Rule 1)."]}, {"id": 3, "title": "Passage 3: Product Launch & Customer Feedback", "faulty": "in january our marketing team launched a mobile app for small businesses in bangladesh the platform offers automated invoicing inventory tracking and real time sales analytics. The ceo said we must prioritize user security above everything else. However some early users reported login delays on tuesday, so the engineers released an urgent update.", "corrected": "**[1] I**n **[2] J**anuary**[3] ,** our marketing team launched a mobile app for small businesses in **[4] B**angladesh**[5] . T**he platform offers automated invoicing**[6] ,** inventory tracking, and **[7] real-time** sales analytics. The **[8] CEO** said**[9] , “W**e must prioritize user security above everything else.**”** However**[10] ,** some early users reported login delays on **T**uesday, so the engineers released an urgent update.", "ten_mistakes": ["1. **in -> In**: Capitalize the first word of the sentence (Cap Rule 1).", "2. **january -> January**: Capitalize the month of the year (Cap Rule 4).", "3. **January,**: Add an introductory phrase comma (Comma Rule 2).", "4. **bangladesh -> Bangladesh**: Capitalize proper country name (Cap Rule 3).", "5. **Bangladesh. The**: Add a period at the end of the first sentence and capitalize 'The' (Period Rule 1).", "6. **invoicing,**: Add comma separating items in the list (Comma Rule 1).", "7. **real-time**: Hyphenate compound adjective before 'sales analytics' (Hyphen Rule 1).", "8. **ceo -> CEO**: Capitalize initialism/acronym (Cap Rule 9).", "9. **said, “We ... else.”**: Add comma, quotation marks, and capital 'W' for direct speech (Quotation Rules 1, 2, 4).", "10. **However, / Tuesday**: Add introductory comma after 'However,' and capitalize 'Tuesday' (Comma Rule 2 & Cap Rule 4)."]}, {"id": 4, "title": "Passage 4: Academic Course Enrollment at IUT", "faulty": "this semester my roommate and i are taking introduction to finance and studying economics at islamic university of technology. Our lecturer, dr. rahman, assigned the book principles of corporate finance for our case study. He asked whether we had completed the data analysis? Because the deadline was approaching we worked on a part time schedule to finish the slides.", "corrected": "**[1] T**his semester**[2] ,** my roommate and **[3] I** are taking **[4] Introduction to Finance** and studying economics at **[5] Islamic University of Technology**. Our lecturer, **[6] Dr. Rahman**, assigned the book **[7] Principles of Corporate Finance** for our case study. He asked whether we had completed the data analysis**[8] .** Because the deadline was approaching**[9] ,** we worked on a **[10] part-time** schedule to finish the slides.", "ten_mistakes": ["1. **this -> This**: Capitalize the first word of the sentence (Cap Rule 1).", "2. **semester,**: Add a comma after the introductory phrase 'This semester,' (Comma Rule 2).", "3. **i -> I**: Always capitalize the pronoun 'I' (Cap Rule 2).", "4. **Introduction to Finance**: Capitalize specific course title (note: 'of/to' lowercase; general subject 'economics' stays lowercase per Cap Rule 10!).", "5. **Islamic University of Technology**: Capitalize proper name of the university (Cap Rule 3).", "6. **Dr. Rahman**: Capitalize title abbreviation and proper name (Cap Rule 6 & Period Rule 2).", "7. **Principles of Corporate Finance**: Capitalize major words in book title, keeping preposition 'of' lowercase (Cap Rule 8).", "8. **analysis.**: Replace the question mark (`?`) with a period (`.`) because 'He asked whether...' is an INDIRECT question (Question Mark Rule 2!).", "9. **approaching,**: Add a comma after the introductory dependent clause 'Because the deadline was approaching,' (Comma Rule 2).", "10. **part-time**: Hyphenate the compound modifier before 'schedule' (Hyphen Rule 1)."]}, {"id": 5, "title": "Passage 5: Cybersecurity Incident Response", "faulty": "during last nights server maintenance the it team detected an unusual login attempt. Mr. khan our chief security officer immediately isolated the database; and he notified all department heads. We must upgrade three systems cloud storage, firewall filters and employee authentication. The new process is called micro-sharding, which prevents data leaks.", "corrected": "**[1] D**uring last **[2] night’s** server maintenance**[3] ,** the **[4] IT** team detected an unusual login attempt. Mr. **[5] K**han**[6] ,** our chief security officer**[7] ,** immediately isolated the database**[8] ,** and he notified all department heads. We must upgrade three systems**[9] :** cloud storage, firewall filters, and employee authentication. The new process is called **[10] “micro-sharding,”** which prevents data leaks.", "ten_mistakes": ["1. **during -> During**: Capitalize the first word of the sentence (Cap Rule 1).", "2. **nights -> night’s**: Add an apostrophe for singular possessive 'last night’s maintenance' (Apostrophe Rule 1).", "3. **maintenance,**: Add a comma after the introductory prepositional phrase (Comma Rule 2).", "4. **it -> IT**: Capitalize the initialism for Information Technology (Cap Rule 9).", "5. **khan -> Khan**: Capitalize proper surname after 'Mr.' (Cap Rule 3).", "6 & 7. **, our chief security officer,**: Set off the appositive phrase with a pair of commas (Comma Rule 5; note general title 'chief security officer' is lowercase per Cap Rule 6).", "8. **database, and**: Replace the incorrect semicolon before 'and' with a comma in a compound sentence (Comma Rule 3).", "9. **systems:**: Add a colon after the complete sentence to introduce the list of three systems (Colon Rule 1).", "10. **“micro-sharding,”**: Enclose the first-time technical term in quotation marks with the comma inside the quotes and lowercase 'm' (Quotation Rules 4 & 10 N.B.)."]}, {"id": 6, "title": "Passage 6: E-Commerce Customer Service Review", "faulty": "in todays digital marketplace customers expect fast delivery, easy returns and responsive support last quarter our company surveyed two thousand shoppers in dhaka and sylhet. The survey revealed one major issue delayed refunds. Sara please share the updated policy with the support team before wednesday.", "corrected": "**[1] I**n **[2] today’s** digital marketplace**[3] ,** customers expect fast delivery, easy returns**[4] ,** and responsive support**[5] . L**ast quarter, our company surveyed two thousand shoppers in **[6] D**haka and **[7] S**ylhet. The survey revealed one major issue**[8] :** delayed refunds. **[9] Sara,** please share the updated policy with the support team before **[10] W**ednesday.", "ten_mistakes": ["1. **in -> In**: Capitalize sentence start (Cap Rule 1).", "2. **todays -> today’s**: Add possessive apostrophe (Apostrophe Rule 1).", "3. **marketplace,**: Add comma after introductory phrase (Comma Rule 2).", "4. **returns,**: Add Oxford comma in list (Comma Rule 1).", "5. **support. Last**: Add period to end first sentence and capitalize 'Last' (Period Rule 1 & Cap Rule 1).", "6. **dhaka -> Dhaka**: Capitalize proper city name (Cap Rule 3).", "7. **sylhet -> Sylhet**: Capitalize proper city name (Cap Rule 3).", "8. **issue:**: Add colon before the explanation 'delayed refunds' (Colon Rule 1).", "9. **Sara,**: Add comma after direct address 'Sara,' (Comma Rule 6).", "10. **wednesday -> Wednesday**: Capitalize day of the week (Cap Rule 4)."]}, {"id": 7, "title": "Passage 7: Renewable Energy Investment in Bangladesh", "faulty": "recently several garment factories in bangladesh have adopted solar power to cut carbon emissions although the initial installation is expensive it significantly lowers long term electricity bills. The ministry of power announced three incentives tax rebates, low interest loans, and technical training. Engineers believe that clean energy will boost our countrys export competitiveness.", "corrected": "**[1] R**ecently**[2] ,** several garment factories in **[3] B**angladesh have adopted solar power to cut carbon emissions**[4] . A**lthough the initial installation is expensive**[5] ,** it significantly lowers **[6] long-term** electricity bills. The **[7] Ministry of Power** announced three incentives**[8] :** tax rebates, **[9] low-interest** loans, and technical training. Engineers believe that clean energy will boost our **[10] country’s** export competitiveness.", "ten_mistakes": ["1. **recently -> Recently**: Capitalize first word of sentence (Cap Rule 1).", "2. **Recently,**: Add comma after introductory adverb (Comma Rule 2).", "3. **bangladesh -> Bangladesh**: Capitalize country name (Cap Rule 3).", "4. **emissions. Although**: Add period at end of sentence and capitalize 'Although' (Period Rule 1).", "5. **expensive,**: Add comma after introductory dependent clause (Comma Rule 2).", "6. **long-term**: Add hyphen in compound adjective before 'electricity bills' (Hyphen Rule 1).", "7. **Ministry of Power**: Capitalize official organization/ministry name (Cap Rule 3).", "8. **incentives:**: Add colon after complete sentence introducing the list (Colon Rule 1).", "9. **low-interest**: Add hyphen in compound adjective before 'loans' (Hyphen Rule 1).", "10. **countrys -> country’s**: Add possessive apostrophe (Apostrophe Rule 1)."]}, {"id": 8, "title": "Passage 8: Internship Interview at Grameenphone", "faulty": "on thursday my classmate and i attended an internship interview at grameenphone headquarters. The hr manager, ms. fatima, asked, What motivates you to work in telecommunications. I replied that i enjoy solving real world business problems and analyzing consumer data. The interview lasted forty minutes; it was a great learning experience.", "corrected": "**[1] O**n **[2] T**hursday**[3] ,** my classmate and **[4] I** attended an internship interview at **[5] G**rameenphone headquarters. The **[6] HR** manager, **[7] Ms. Fatima**, asked, **[8] “W**hat motivates you to work in telecommunications**[9] ?”** I replied that **I** enjoy solving **[10] real-world** business problems and analyzing consumer data. The interview lasted forty minutes; it was a great learning experience.", "ten_mistakes": ["1. **on -> On**: Capitalize sentence start (Cap Rule 1).", "2. **thursday -> Thursday**: Capitalize day of the week (Cap Rule 4).", "3. **Thursday,**: Add comma after introductory time phrase (Comma Rule 2).", "4. **i -> I**: Capitalize pronoun 'I' in both occurrences (Cap Rule 2).", "5. **grameenphone -> Grameenphone**: Capitalize proper company name (Cap Rule 3).", "6. **hr -> HR**: Capitalize initialism for Human Resources (Cap Rule 9).", "7. **ms. fatima -> Ms. Fatima**: Capitalize title and proper name (Cap Rule 6 & 3).", "8. **“What**: Add opening quotation mark before direct speech (Quotation Rule 1).", "9. **telecommunications?”**: Replace period with a question mark INSIDE the closing quotation mark because the quote itself is a direct question (Quotation Rule 5).", "10. **real-world**: Add hyphen in compound modifier before 'business problems' (Hyphen Rule 1)."]}, {"id": 9, "title": "Passage 9: University Book Fair & Guest Lecture", "faulty": "every autumn our department hosts a book fair on campus. This year professor rahim inaugurated the event and he discussed the famous article global warming impacts. Students bought textbooks journals and notebooks at a discount. My friend said, This fair is amazing, before buying a well known novel.", "corrected": "**[1] E**very autumn**[2] ,** our department hosts a book fair on campus. This year**[3] ,** **[4] P**rofessor **[R]**ahim inaugurated the event**[5] ,** and he discussed the famous article **[6] “Global Warming Impacts.”** Students bought textbooks**[7] ,** journals**[8] ,** and notebooks at a discount. My friend said, **[9] “This fair is amazing,”** before buying a **[10] well-known** novel.", "ten_mistakes": ["1. **every -> Every**: Capitalize first word of sentence (note: 'autumn' stays lowercase per Cap Rule 4!).", "2. **autumn,**: Add introductory phrase comma (Comma Rule 2).", "3. **This year,**: Add introductory phrase comma (Comma Rule 2).", "4. **professor rahim -> Professor Rahim**: Capitalize title + proper name (Cap Rule 6 & 3).", "5. **event, and**: Add comma before 'and' because it connects two independent clauses ('Professor Rahim inaugurated...' and 'he discussed...') (Comma Rule 3).", "6. **“Global Warming Impacts.”**: Use quotation marks and capitalize major words for the title of an article, with period inside quotes (Quotation Rule 4 & 6; Cap Rule 8).", "7 & 8. **textbooks, journals, and**: Add commas separating items in a 3-item list (Comma Rule 1).", "9. **“This fair is amazing,”**: Enclose direct speech in quotation marks with the comma inside (Quotation Rules 1 & 4).", "10. **well-known**: Hyphenate compound adjective before 'novel' (Hyphen Rule 1)."]}, {"id": 10, "title": "Passage 10: Healthcare Digitization Project", "faulty": "in recent months several hospitals in dhaka have introduced electronic health records doctors can now access patients medical histories instantly; which reduces diagnostic errors. However hospital administrators must focus on three priorities data privacy, staff training and high speed network connectivity.", "corrected": "**[1] I**n recent months**[2] ,** several hospitals in **[3] D**haka have introduced electronic health records**[4] . D**octors can now access **[5] patients’** medical histories instantly**[6] ,** which reduces diagnostic errors. However**[7] ,** hospital administrators must focus on three priorities**[8] :** data privacy, staff training**[9] ,** and **[10] high-speed** network connectivity.", "ten_mistakes": ["1. **in -> In**: Capitalize sentence start (Cap Rule 1).", "2. **months,**: Add comma after introductory time phrase (Comma Rule 2).", "3. **dhaka -> Dhaka**: Capitalize proper city name (Cap Rule 3).", "4. **records. Doctors**: Add period to end first sentence and capitalize 'Doctors' (Period Rule 1).", "5. **patients -> patients’**: Add apostrophe after plural 's' for plural possession ('patients’ medical histories') (Apostrophe Rule 1).", "6. **instantly, which**: Replace incorrect semicolon with a comma before the nonessential relative clause ', which reduces...' (Comma Rule 4).", "7. **However,**: Add comma after introductory transition word (Comma Rule 2).", "8. **priorities:**: Add colon after complete sentence to introduce the list (Colon Rule 1).", "9. **training,**: Add Oxford comma in 3-item list (Comma Rule 1).", "10. **high-speed**: Hyphenate compound modifier before 'network connectivity' (Hyphen Rule 1)."]}, {"id": 11, "title": "Passage 11: Quarterly Sales Review & Export Strategy", "faulty": "after the third quarter review our export division expanded into europe and north america. The director Mr. ahmed praised the teams performance during friday’s meeting. He had one clear objective to double online revenue. Consequently we hired five full time analysts who speak english and french fluently.", "corrected": "**[1] A**fter the **[2] third-quarter** review**[3] ,** our export division expanded into **[4] E**urope and **[5] N**orth **[A]**merica. The director**[6] ,** Mr. **[A]**hmed**[6] ,** praised the **[7] team’s** performance during **F**riday’s meeting. He had one clear objective**[8] :** to double online revenue. Consequently**[9] ,** we hired five **[10] full-time** analysts who speak **E**nglish and **F**rench fluently.", "ten_mistakes": ["1. **after -> After**: Capitalize sentence start (Cap Rule 1).", "2. **third-quarter**: Hyphenate compound modifier before 'review' (Hyphen Rule 1).", "3. **review,**: Add introductory phrase comma (Comma Rule 2).", "4 & 5. **Europe / North America**: Capitalize proper continent/region names (Cap Rule 3).", "6. **, Mr. Ahmed,**: Set off the appositive with commas and capitalize 'Ahmed' (Comma Rule 5 & Cap Rule 3).", "7. **teams / Friday’s -> team’s / Friday’s**: Add possessive apostrophe to 'team’s' and capitalize 'Friday’s' (Apostrophe Rule 1 & Cap Rule 4).", "8. **objective:**: Add colon before explanation 'to double online revenue' (Colon Rule 1).", "9. **Consequently,**: Add comma after introductory adverb (Comma Rule 2).", "10. **full-time / English and French**: Hyphenate 'full-time' and capitalize language names 'English' and 'French' (Hyphen Rule 1 & Cap Rule 5)."]}, {"id": 12, "title": "Passage 12: Fintech Startup Pitch at BTM Symposium", "faulty": "last wednesday our team participated in a fintech competition at iut. We presented a low cost payment gateway for rural merchants in bangladesh. The judges asked, How will your platform prevent fraud. My partner and i explained our two factor verification system, which uses biometric data.", "corrected": "**[1] L**ast **[2] W**ednesday**[3] ,** our team participated in a fintech competition at **[4] IUT**. We presented a **[5] low-cost** payment gateway for rural merchants in **[6] B**angladesh. The judges asked, **[7] “H**ow will your platform prevent fraud**[8] ?”** My partner and **[9] I** explained our **[10] two-factor** verification system, which uses biometric data.", "ten_mistakes": ["1. **last -> Last**: Capitalize sentence start (Cap Rule 1).", "2. **wednesday -> Wednesday**: Capitalize day of the week (Cap Rule 4).", "3. **Wednesday,**: Add comma after introductory time phrase (Comma Rule 2).", "4. **iut -> IUT**: Capitalize university acronym (Cap Rule 9).", "5. **low-cost**: Hyphenate compound adjective before 'payment gateway' (Hyphen Rule 1).", "6. **bangladesh -> Bangladesh**: Capitalize country name (Cap Rule 3).", "7. **“How**: Add opening quotation mark before direct question (Quotation Rule 1).", "8. **fraud?”**: Replace period with question mark inside closing quotation mark (Quotation Rule 5).", "9. **i -> I**: Capitalize pronoun 'I' (Cap Rule 2).", "10. **two-factor**: Hyphenate compound modifier before 'verification system' (Hyphen Rule 1)."]}, {"id": 13, "title": "Passage 13: Remote Team Productivity Survey", "faulty": "although remote work saves commuting time it can sometimes weaken team cohesion. Our hr department surveyed employees across three cities dhaka, khulna, and rajshahi. Most respondents said that they prefer a flexible schedule; however they still value in person brainstorming sessions on mondays.", "corrected": "**[1] A**lthough remote work saves commuting time**[2] ,** it can sometimes weaken team cohesion. Our **[3] HR** department surveyed employees across three cities**[4] :** **[5] D**haka, **[6] K**hulna, and **[7] R**ajshahi. Most respondents said that they prefer a flexible schedule; however**[8] ,** they still value **[9] in-person** brainstorming sessions on **[10] M**ondays.", "ten_mistakes": ["1. **although -> Although**: Capitalize sentence start (Cap Rule 1).", "2. **time,**: Add comma after introductory dependent clause (Comma Rule 2).", "3. **hr -> HR**: Capitalize acronym (Cap Rule 9).", "4. **cities:**: Add colon after complete sentence introducing the list of cities (Colon Rule 1).", "5, 6, 7. **Dhaka, Khulna, and Rajshahi**: Capitalize proper city names (Cap Rule 3).", "8. **however,**: Add comma after conjunctive adverb 'however,' following a semicolon (Comma Rule 2).", "9. **in-person**: Hyphenate compound modifier before 'brainstorming sessions' (Hyphen Rule 1).", "10. **mondays -> Mondays**: Capitalize day of the week (Cap Rule 4)."]}, {"id": 14, "title": "Passage 14: Warehouse Automation Upgrade", "faulty": "in december our operations director mr. karim visited a smart warehouse in singapore. He observed how autonomous robots sort packages scan barcodes and load delivery trucks. Because the system operates twenty four hours a day it reduces order processing time by half. We plan to adopt this state of the art technology next winter.", "corrected": "**[1] I**n **[2] D**ecember**[3] ,** our operations director**[4] , M**r. **[K]**arim**[4] ,** visited a smart warehouse in **[5] S**ingapore. He observed how autonomous robots sort packages**[6] ,** scan barcodes**[7] ,** and load delivery trucks. Because the system operates **[8] twenty-four** hours a day**[9] ,** it reduces order-processing time by half. We plan to adopt this **[10] state-of-the-art** technology next winter.", "ten_mistakes": ["1. **in -> In**: Capitalize sentence start (Cap Rule 1).", "2. **december -> December**: Capitalize month name (Cap Rule 4).", "3. **December,**: Add introductory comma (Comma Rule 2).", "4. **, Mr. Karim,**: Set off appositive with commas and capitalize 'Mr. Karim' (Comma Rule 5 & Cap Rule 3/6).", "5. **singapore -> Singapore**: Capitalize country/city name (Cap Rule 3).", "6 & 7. **packages, scan barcodes, and**: Add commas in 3-item verb phrase list (Comma Rule 1).", "8. **twenty-four**: Hyphenate compound number (Hyphen Rule 1).", "9. **day,**: Add comma after introductory dependent clause (Comma Rule 2).", "10. **state-of-the-art**: Hyphenate compound modifier before 'technology' (note: 'winter' stays lowercase per Cap Rule 4!)."]}, {"id": 15, "title": "Passage 15: Corporate Ethics Seminar & Case Analysis", "faulty": "yesterday afternoon professor salsabil conducted a special workshop on business ethics she distributed a short story titled the lottery and asked us to analyze group conformity. My partner Rahim said I didnt realize how strongly peer pressure affects workplace decisions. Everyone agreed that transparent leadership ethical training and open communication are essential.", "corrected": "**[1] Y**esterday afternoon**[2] ,** **[3] P**rofessor **[S]**alsabil conducted a special workshop on business ethics**[4] . S**he distributed a short story titled **[5] “The Lottery”** and asked us to analyze group conformity. My partner**[6] ,** Rahim**[6] ,** said**[7] , “I** **[8] didn’t** realize how strongly peer pressure affects workplace decisions.**”** Everyone agreed that transparent leadership**[9] ,** ethical training**[10] ,** and open communication are essential.", "ten_mistakes": ["1. **yesterday -> Yesterday**: Capitalize first word of sentence (Cap Rule 1).", "2. **afternoon,**: Add comma after introductory time phrase (Comma Rule 2).", "3. **professor salsabil -> Professor Salsabil**: Capitalize title + proper name (Cap Rule 6 & 3).", "4. **ethics. She**: End first sentence with a period and capitalize 'She' (Period Rule 1).", "5. **“The Lottery”**: Enclose short story title in quotation marks and capitalize major words (Quotation Rule 6 & Cap Rule 8).", "6. **, Rahim,**: Set off appositive name with commas (Comma Rule 5).", "7. **said, “I ... decisions.”**: Add comma and quotation marks around direct speech (Quotation Rules 1 & 4).", "8. **didnt -> didn’t**: Add apostrophe in contraction (Apostrophe Rule 2).", "9 & 10. **leadership, ethical training, and**: Add commas separating items in a 3-item list (Comma Rule 1)."]}], "cmPassages": [{"id": 1, "title": "Common Mistakes Passage 1: Project Review & Client Communication", "faulty": "Yesterday our project team met to (1) discuss about the upcoming software deployment. Although the initial prototype appeared effective, (2) but several technical issues emerged during testing. The lead engineer provided many valuable (3) informations regarding server stability and (4) emphasized on the need for stricter security protocols. However, one of the junior (5) analyst failed to (6) cope up with the tight deadline and forgot to test the backup module. We have already ordered for (7) new laboratory equipments to upgrade our testing facility. Could you please tell me when (8) will the client arrive tomorrow? Everyone must (9) abide with the updated safety guidelines and (10) return back the signed checklists by Friday.", "corrected": "Yesterday our project team met to **(1) discuss** the upcoming software deployment. Although the initial prototype appeared effective, **(2) [delete 'but']** several technical issues emerged during testing. The lead engineer provided **much valuable (3) information** (or *many valuable pieces of information*) regarding server stability and **(4) emphasized** the need for stricter security protocols. However, one of the junior **(5) analysts** failed to **(6) cope with** the tight deadline and forgot to test the backup module. We have already **ordered (7) new laboratory equipment** to upgrade our testing facility. Could you please tell me when **(8) the client will** arrive tomorrow? Everyone must **(9) abide by** the updated safety guidelines and **(10) return** the signed checklists by Friday.", "ten_mistakes": ["1. **discuss about -> discuss**: Transitive verb 'discuss' never takes 'about'.", "2. **Although..., but -> Although..., [remove 'but']**: Never use 'but' after 'Although/Though'.", "3. **many valuable informations -> much valuable information**: 'Information' is uncountable (no -s, no 'many').", "4. **emphasized on -> emphasized**: The verb 'emphasize' does not take 'on'.", "5. **one of the junior analyst -> one of the junior analysts**: 'One of the' must be followed by a plural noun.", "6. **cope up with -> cope with**: The correct idiom is 'cope with' (remove 'up').", "7. **ordered for new laboratory equipments -> ordered new laboratory equipment**: Verb 'order' takes no 'for', and 'equipment' is uncountable.", "8. **when will the client arrive -> when the client will arrive**: Indirect questions use statement word order (Subject + Verb).", "9. **abide with -> abide by**: Fixed phrasal verb is 'abide by'.", "10. **return back -> return**: 'Back' is redundant after 'return'."]}, {"id": 2, "title": "Common Mistakes Passage 2: HR Recruitment & Office Procurement", "faulty": "Our human resources committee (1) comprises of five senior managers who oversee campus recruitment. During the interview session, candidates who were (2) good in English communication performed significantly better. Because the applicants had (3) less mistakes in their written tests, (4) so the panel shortlisted twelve finalists. Most candidates stated that they (5) prefer hybrid work than traditional office schedules. Meanwhile, the administration purchased new (6) furnitures for the training wing and (7) congratulated the coordinator for organizing the event smoothly. Both the director (8) as well as the department heads reviewed the (9) positive feedbacks from participants before (10) entering into the boardroom.", "corrected": "Our human resources committee **(1) comprises** (or *consists of*) five senior managers who oversee campus recruitment. During the interview session, candidates who were **(2) good at** English communication performed significantly better. Because the applicants had **(3) fewer mistakes** in their written tests, **(4) [delete 'so']** the panel shortlisted twelve finalists. Most candidates stated that they **(5) prefer hybrid work to** traditional office schedules. Meanwhile, the administration purchased new **(6) furniture** for the training wing and **(7) congratulated the coordinator on** organizing the event smoothly. Both the director **(8) and** the department heads reviewed the **(9) positive feedback** from participants before **(10) entering** the boardroom.", "ten_mistakes": ["1. **comprises of -> comprises (or consists of)**: Active 'comprise' never takes 'of'.", "2. **good in -> good at**: We say 'good at' a subject or skill.", "3. **less mistakes -> fewer mistakes**: 'Mistakes' is countable plural, so use 'fewer', not 'less'.", "4. **Because..., so -> Because..., [remove 'so']**: Never pair 'Because' with 'so'.", "5. **prefer... than -> prefer... to**: 'Prefer X to Y' is the required preposition.", "6. **furnitures -> furniture**: 'Furniture' is strictly uncountable.", "7. **congratulated... for -> congratulated... on**: Always 'congratulate someone ON something'.", "8. **Both... as well as -> Both... and**: Correlative conjunction is 'Both X and Y'.", "9. **positive feedbacks -> positive feedback**: 'Feedback' is uncountable.", "10. **entering into the boardroom -> entering the boardroom**: Physical entry into a room takes no 'into'."]}, {"id": 3, "title": "Common Mistakes Passage 3: Research Grant & Financial Discrepancy", "faulty": "The research fellows conducted (1) several researches on renewable energy adoption in rural communities. Their new solar battery design is clearly (2) superior than conventional lead-acid models and is much more (3) economic to maintain. However, the external auditor (4) investigated into a minor discrepancy in the budget and gave us (5) a useful advise on expense tracking. The team (6) succeeded to resolve the accounting error without (7) repeating the calculation again. Every researcher was (8) capable to present the data clearly, and nobody wanted to (9) loose the sponsor's trust. Finally, the coordinator (10) requested for a short extension to submit the final report.", "corrected": "The research fellows conducted **(1) extensive research** (or *several research studies*) on renewable energy adoption in rural communities. Their new solar battery design is clearly **(2) superior to** conventional lead-acid models and is much more **(3) economical** to maintain. However, the external auditor **(4) investigated** a minor discrepancy in the budget and gave us **(5) useful advice** (or *a useful piece of advice*) on expense tracking. The team **(6) succeeded in resolving** the accounting error without **(7) repeating** the calculation. Every researcher was **(8) capable of presenting** the data clearly, and nobody wanted to **(9) lose** the sponsor's trust. Finally, the coordinator **(10) requested** a short extension to submit the final report.", "ten_mistakes": ["1. **several researches -> extensive research / several research studies**: 'Research' is uncountable.", "2. **superior than -> superior to**: Latin comparative 'superior' takes 'to', never 'than'.", "3. **economic -> economical**: 'Economical' means cost-saving/cheap to run; 'economic' relates to the national economy.", "4. **investigated into -> investigated**: Transitive verb 'investigate' takes no 'into'.", "5. **a useful advise -> useful advice**: 'Advice' is the uncountable noun (no 'a', spelled with 'c').", "6. **succeeded to resolve -> succeeded in resolving**: 'Succeed' takes 'in + V-ing'.", "7. **repeating... again -> repeating**: 'Again' is redundant after 'repeat'.", "8. **capable to present -> capable of presenting**: 'Capable' takes 'of + V-ing'.", "9. **loose -> lose**: 'Lose' is the verb; 'loose' means not tight.", "10. **requested for -> requested**: Transitive verb 'request' takes no 'for'."]}, {"id": 4, "title": "Common Mistakes Passage 4: Formal Business Email to a Client", "faulty": "Dear Mr. Shafiq, I am writing to follow up on the contract we (1) discussed about last Thursday. The recent currency fluctuation had a noticeable (2) affect on our import costs, (3) isn't it? Nevertheless, our management (4) insisted to maintain the agreed unit price so that it (5) compliments your long-term budget. Please (6) revert back to us by tomorrow if you require any changes to the shipment schedule. (7) Beside, I (8) also attach the revised invoice for your review. Unless we (9) do not receive the customs clearance today, the cargo will be delayed. We (10) await for your confirmation.", "corrected": "Dear Mr. Shafiq, I am writing to follow up on the contract we **(1) discussed** last Thursday. The recent currency fluctuation had a noticeable **(2) effect** on our import costs, **(3) didn't it?** (or remove tag in formal email). Nevertheless, our management **(4) insisted on maintaining** the agreed unit price so that it **(5) complements** your long-term budget. Please **(6) revert** (or *reply*) to us by tomorrow if you require any changes to the shipment schedule. **(7) Besides,** I **(8) have also attached** the revised invoice for your review. Unless we **(9) receive** the customs clearance today, the cargo will be delayed. We **(10) await** (or *wait for*) your confirmation.", "ten_mistakes": ["1. **discussed about -> discussed**: Remove redundant 'about'.", "2. **affect -> effect**: After 'a noticeable', the noun 'effect' is required ('affect' is a verb).", "3. **isn't it -> didn't it**: Past simple main verb 'had' requires question tag 'didn't it?'.", "4. **insisted to maintain -> insisted on maintaining**: 'Insist' takes 'on + V-ing'.", "5. **compliments -> complements**: 'Complement' means match/complete; 'compliment' means praise.", "6. **revert back -> revert / reply**: 'Back' is redundant after 'revert'.", "7. **Beside -> Besides**: 'Besides' means 'in addition / moreover'; 'beside' means 'next to'.", "8. **I also attach -> I have also attached / Please find attached**: Formal business email convention (Previous Year Q3!).", "9. **Unless we do not receive -> Unless we receive**: Double negative! 'Unless' already means 'if... not'.", "10. **await for -> await (or wait for)**: 'Await' never takes 'for'."]}, {"id": 5, "title": "Common Mistakes Passage 5: Manufacturing Quality Control Report", "faulty": "When our inspection team (1) reached at the factory in Gazipur, the supervisor showed us the newly installed (2) machineries. He explained that the (3) reason for the recent production halt was because a power transformer had overheated. To prevent such incidents (4) to happen again, the plant engineers (5) collaborated together with safety consultants. Each of the machine (6) operators were instructed to follow strict ethical (7) principals during shift handovers. Furthermore, the company updated (8) it's maintenance log and divided the monitoring duties (9) between the خمس (five) shift leaders. The (10) news about the improved safety rating are encouraging for foreign buyers.", "corrected": "When our inspection team **(1) reached** the factory in Gazipur, the supervisor showed us the newly installed **(2) machinery**. He explained that the **(3) reason for the recent production halt was that** a power transformer had overheated. To prevent such incidents **(4) from happening** again, the plant engineers **(5) collaborated** with safety consultants. Each of the machine **(6) operators was** instructed to follow strict ethical **(7) principles** during shift handovers. Furthermore, the company updated **(8) its** maintenance log and divided the monitoring duties **(9) among** the five shift leaders. The **(10) news** about the improved safety rating **is** encouraging for foreign buyers.", "ten_mistakes": ["1. **reached at -> reached**: 'Reach' takes no preposition before a destination.", "2. **machineries -> machinery**: 'Machinery' is uncountable.", "3. **reason... was because -> reason... was that**: Write 'The reason was that', never 'was because'.", "4. **prevent... to happen -> prevent... from happening**: 'Prevent' takes 'from + V-ing'.", "5. **collaborated together -> collaborated**: 'Together' is redundant after 'collaborate'.", "6. **Each of the... operators were -> Each of the... operators was**: 'Each of' takes a singular verb 'was'.", "7. **principals -> principles**: Moral/operational rules are 'principles'; 'principal' means head/main.", "8. **it's -> its**: Possessive adjective 'its' has no apostrophe.", "9. **between the five -> among the five**: Use 'among' for 3 or more people/items.", "10. **The news... are -> The news... is**: 'News' is singular uncountable."]}, {"id": 6, "title": "Common Mistakes Passage 6: Academic Seminar & Student Presentation", "faulty": "During yesterday's seminar on (1) Business Statistics, the lecturer explained how data analytics helps companies make smarter decisions. Note that (2) Statistics are a compulsory course for all first-year students in our department. Before the presentation started, (3) me and my group partner checked the projector and distributed handouts. Scarcely had we displayed the first chart (4) than a student asked (5) that how we had collected the survey sample. My partner, who is two years (6) senior than me, (7) answered to the question with confidence. He is thoroughly (8) accustomed with public speaking and (9) stressed on the importance of sample accuracy. In the end, our group (10) combined together all the findings into a single brief.", "corrected": "During yesterday's seminar on **(1) business statistics** (if general subject; or keep if official course title), Note that **(2) Statistics is** a compulsory course for all first-year students in our department. Before the presentation started, **(3) my group partner and I** checked the projector and distributed handouts. Scarcely had we displayed the first chart **(4) when** a student asked **(5) how** we had collected the survey sample. My partner, who is two years **(6) senior to** me, **(7) answered** the question with confidence. He is thoroughly **(8) accustomed to** public speaking and **(9) stressed** the importance of sample accuracy. In the end, our group **(10) combined** all the findings into a single brief.", "ten_mistakes": ["1. **on Business Statistics -> on business statistics**: General subject names are lowercase unless official course titles.", "2. **Statistics are -> Statistics is**: Academic subjects ending in -ics take a singular verb.", "3. **me and my group partner -> my group partner and I**: Subject pronoun 'I' placed second.", "4. **Scarcely... than -> Scarcely... when**: 'Scarcely/Hardly' pairs with 'when/before', not 'than'.", "5. **asked that how -> asked how**: Never put 'that' before a wh-word in indirect questions.", "6. **senior than -> senior to**: 'Senior' takes 'to', never 'than'.", "7. **answered to the question -> answered the question**: Transitive verb 'answer' takes no 'to'.", "8. **accustomed with -> accustomed to**: Always 'accustomed to'.", "9. **stressed on -> stressed**: Transitive verb 'stress' takes no 'on'.", "10. **combined together -> combined**: 'Together' is redundant after 'combine'."]}, {"id": 7, "title": "Common Mistakes Passage 7: Supply Chain Logistics & Customs Delay", "faulty": "Last week, our logistics officer (1) approached to the port authority regarding a delayed container. He carried (2) heavy luggages and a folder containing (3) sufficient evidences of tax payment. Because there was (4) many traffic near the port gate, he had to walk the final kilometre (5) by foot. The customs inspector was (6) satisfied from the documents and (7) told to him that the shipment would be released by evening. Our company always (8) aims to improving delivery speed, and we never (9) lack of commitment to client deadlines. The (10) final outcome was satisfactory for everyone.", "corrected": "Last week, our logistics officer **(1) approached** the port authority regarding a delayed container. He carried **(2) heavy luggage** and a folder containing **(3) sufficient evidence** of tax payment. Because there was **(4) much / heavy traffic** near the port gate, he had to walk the final kilometre **(5) on foot**. The customs inspector was **(6) satisfied with** the documents and **(7) told him** that the shipment would be released by evening. Our company always **(8) aims at improving** (or *aims to improve*) delivery speed, and we never **(9) lack** commitment to client deadlines. The **(10) outcome** was satisfactory for everyone.", "ten_mistakes": ["1. **approached to -> approached**: Verb 'approach' takes no 'to'.", "2. **luggages -> luggage**: 'Luggage' is uncountable.", "3. **evidences -> evidence**: 'Evidence' is uncountable.", "4. **many traffic -> much / heavy traffic**: 'Traffic' is uncountable.", "5. **by foot -> on foot**: Idiom is 'on foot' (contrast with 'by car/bus').", "6. **satisfied from -> satisfied with**: Always 'satisfied with'.", "7. **told to him -> told him**: 'Tell' takes an indirect object without 'to'.", "8. **aims to improving -> aims at improving (or aims to improve)**: Never 'to + V-ing' after 'aim'.", "9. **lack of -> lack**: As a verb, 'lack' never takes 'of'.", "10. **final outcome -> outcome**: 'Final' is redundant before 'outcome'."]}, {"id": 8, "title": "Common Mistakes Passage 8: Corporate Training & Employee Evaluation", "faulty": "Our annual training programme (1) consists in four intensive modules designed for newly hired executives. The facilitator’s role involves preparing case materials, conducting workshops, and (2) to evaluate individual progress. Every trainee must complete their daily (3) homeworks and submit (4) it before 9 a.m. (5) in the morning. One of the (6) trainee was (7) accused for copying a report from the internet. The director warned him that one must always perform (8) his duties honestly. Despite this incident, the team remains (9) confident to achieve its quarterly targets through (10) mutual cooperation.", "corrected": "Our annual training programme **(1) consists of** four intensive modules designed for newly hired executives. The facilitator’s role involves preparing case materials, conducting workshops, and **(2) evaluating** individual progress. Every trainee must complete their daily **(3) homework** and submit **(4) it** before 9 a.m. **(5) [delete 'in the morning']**. One of the **(6) trainees** was **(7) accused of** copying a report from the internet. The director warned him that one must always perform **(8) one's** duties honestly. Despite this incident, the team remains **(9) confident of achieving** its quarterly targets through **(10) cooperation**.", "ten_mistakes": ["1. **consists in -> consists of**: 'Consist of' means 'be composed of'.", "2. **and to evaluate -> and evaluating**: Parallel structure with 'preparing... conducting... and evaluating'.", "3. **homeworks -> homework**: 'Homework' is uncountable.", "4 & 5. **9 a.m. in the morning -> 9 a.m.**: 'In the morning' is redundant with 'a.m.'.", "6. **One of the trainee -> One of the trainees**: Plural noun required after 'One of the'.", "7. **accused for -> accused of**: Always 'accused of'.", "8. **one must... his -> one must... one's**: Indefinite pronoun 'one' takes 'one's'.", "9. **confident to achieve -> confident of achieving**: 'Confident' takes 'of + V-ing'.", "10. **mutual cooperation -> cooperation**: 'Mutual' is redundant before 'cooperation'."]}, {"id": 9, "title": "Common Mistakes Passage 9: Banking Compliance & Customer Service", "faulty": "All commercial banks must remain fully (1) compliant to central bank guidelines. Recently, our branch manager noticed that several customers were (2) interested for opening digital savings accounts. He assigned two officers who (3) resemble to each other in their analytical approach to guide the clients. Before (4) entering into the loan office, borrowers must provide (5) three thousands taka as a processing fee. However, we received (6) less applications this month because many clients (7) depended in outdated brochures. We have ordered new (8) stationary supplies to print updated forms and (9) regretted for the inconvenience caused (10) in Monday.", "corrected": "All commercial banks must remain fully **(1) compliant with** central bank guidelines. Recently, our branch manager noticed that several customers were **(2) interested in** opening digital savings accounts. He assigned two officers who **(3) resemble** each other in their analytical approach to guide the clients. Before **(4) entering** the loan office, borrowers must provide **(5) three thousand** taka as a processing fee. However, we received **(6) fewer** applications this month because many clients **(7) depended on** outdated brochures. We have ordered new **(8) stationery** supplies to print updated forms and **(9) regretted** the inconvenience caused **(10) on** Monday.", "ten_mistakes": ["1. **compliant to -> compliant with**: Always 'compliant with' / 'comply with'.", "2. **interested for -> interested in**: Always 'interested in'.", "3. **resemble to -> resemble**: 'Resemble' takes no preposition.", "4. **entering into the loan office -> entering the loan office**: Physical entry into a room takes no 'into'.", "5. **three thousands taka -> three thousand taka**: No plural -s on 'thousand' after a number.", "6. **less applications -> fewer applications**: 'Applications' is countable plural, so use 'fewer'.", "7. **depended in -> depended on**: Always 'depend on / upon'.", "8. **stationary -> stationery**: Office paper/supplies is 'stationery' (with e).", "9. **regretted for -> regretted**: Verb 'regret' takes a direct object without 'for'.", "10. **in Monday -> on Monday**: Use 'on' before days of the week."]}, {"id": 10, "title": "Common Mistakes Passage 10: Product Innovation & Market Expansion", "faulty": "Our R&D division is (1) famous about developing eco-friendly packaging solutions. Last month, the team introduced a (2) new innovation in biodegradable plastics that is (3) different than imported alternatives. Walking through the exhibition hall, (4) the product samples attracted many investors. Not only the CEO (5) praised the engineers, but also approved a bonus for their (6) past experience in polymer design. We must (7) contact with the regional distributors immediately so that we do not miss (8) future prospects. In my opinion, (9) I think that this product will succeed if we have (10) sufficient enough inventory.", "corrected": "Our R&D division is **(1) famous for** developing eco-friendly packaging solutions. Last month, the team introduced an **(2) innovation** in biodegradable plastics that is **(3) different from** imported alternatives. Walking through the exhibition hall, **(4) the investors were attracted to the product samples** (or *As the investors walked..., the samples...*). The CEO **(5) not only praised** the engineers, **but also approved** a bonus for their **(6) experience** in polymer design. We must **(7) contact** the regional distributors immediately so that we do not miss **(8) prospects**. **(9) In my opinion,** this product will succeed if we have **(10) sufficient** (or *enough*) inventory.", "ten_mistakes": ["1. **famous about -> famous for**: Always 'famous for'.", "2. **new innovation -> innovation**: 'New' is redundant before 'innovation'.", "3. **different than -> different from**: In formal standard English, use 'different from'.", "4. **Walking through..., the product samples...**: Dangling participle! Product samples cannot walk.", "5. **Not only the CEO praised -> The CEO not only praised**: Parallel placement of 'not only... but also'.", "6. **past experience -> experience**: 'Past' is redundant before 'experience'.", "7. **contact with -> contact**: As a verb, 'contact' takes no 'with'.", "8. **future prospects -> prospects**: 'Future' is redundant before 'prospects'.", "9. **In my opinion, I think -> In my opinion, (or I think)**: Redundant double opinion phrase.", "10. **sufficient enough -> sufficient (or enough)**: Redundant double modifier."]}, {"id": 11, "title": "Common Mistakes Passage 11: IT Helpdesk & Software Migration", "faulty": "During the software migration, several employees complained that they had (1) many works pending on their desktops. The IT supervisor (2) asked to the technicians to back up all (3) datas before installing the patch. Although the update was scheduled for midnight, (4) yet two servers crashed unexpectedly. No sooner had the system restarted (5) when users reported login errors. The support team (6) lacked of proper diagnostic tools and could not (7) cope up with the volume of tickets. Prior (8) than the migration, management had ignored our (9) advices regarding server capacity, which had a negative (10) affect on productivity.", "corrected": "During the software migration, several employees complained that they had **(1) much work** (or *many tasks*) pending on their desktops. The IT supervisor **(2) asked** the technicians to back up all **(3) data** before installing the patch. Although the update was scheduled for midnight, **(4) [delete 'yet']** two servers crashed unexpectedly. No sooner had the system restarted **(5) than** users reported login errors. The support team **(6) lacked** proper diagnostic tools and could not **(7) cope with** the volume of tickets. Prior **(8) to** the migration, management had ignored our **(9) advice** regarding server capacity, which had a negative **(10) effect** on productivity.", "ten_mistakes": ["1. **many works -> much work / many tasks**: 'Work' is uncountable.", "2. **asked to -> asked**: 'Ask' takes no 'to'.", "3. **datas -> data**: 'Data' is already plural (or uncountable mass noun); never 'datas'.", "4. **Although..., yet -> Although..., [remove 'yet']**: Do not pair 'Although' with 'yet/but'.", "5. **No sooner... when -> No sooner... than**: 'No sooner' always pairs with 'than'.", "6. **lacked of -> lacked**: Verb 'lack' takes no 'of'.", "7. **cope up with -> cope with**: Remove 'up'.", "8. **Prior than -> Prior to**: 'Prior' takes 'to', never 'than'.", "9. **advices -> advice**: 'Advice' is uncountable.", "10. **affect -> effect**: Noun required after 'a negative'."]}, {"id": 12, "title": "Common Mistakes Passage 12: Tourism & Hospitality Management in Cox's Bazar", "faulty": "Many foreign tourists visit Cox's Bazar to enjoy the coastal (1) sceneries during winter. However, several resort owners have failed to (2) emphasize on eco-friendly waste management. Last month, the municipal authority (3) ordered for twenty waste-collection trucks and fined hotels that were found (4) guilty for polluting the beach. Tourists often (5) prefer boutique resorts than crowded hotels because they offer (6) a Free gift upon arrival. Furthermore, one of the hotel (7) manager told us that (8) Economics are the main driver of local employment. Before guests (9) reach at the resort, the staff ensures that all (10) baggages are sanitized.", "corrected": "Many foreign tourists visit Cox's Bazar to enjoy the coastal **(1) scenery** during winter. However, several resort owners have failed to **(2) emphasize** eco-friendly waste management. Last month, the municipal authority **(3) ordered** twenty waste-collection trucks and fined hotels that were found **(4) guilty of**
