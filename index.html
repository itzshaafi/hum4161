<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUM 4161: Business English — Liquid Glass Interactive Teacher &amp; 20-Min Quiz Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
    /* ==========================================================================
       APPLE iOS 26 / visionOS LIQUID GLASS DESIGN SYSTEM — PRO UPGRADE
       ========================================================================== */
    :root, [data-theme="dark"] {
        --bg-base: #05070f;
        --bg-elevated: #0b1021;
        --glass-surface: rgba(17, 24, 43, 0.58);
        --glass-surface-hover: rgba(24, 34, 60, 0.72);
        --glass-Heavy: rgba(12, 17, 32, 0.82);
        --glass-pill: rgba(255, 255, 255, 0.07);
        --glass-pill-active: rgba(255, 255, 255, 0.95);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-border-strong: rgba(255, 255, 255, 0.24);
        --specular-top: rgba(255, 255, 255, 0.26);
        --text: #f8fafc;
        --text-secondary: #cbd5e1;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --primary-glow: rgba(56, 189, 248, 0.35);
        --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 55%, #a855f7 100%);
        --primary-dark: #0284c7;
        --accent: #818cf8;
        --success: #10b981;
        --success-bg: rgba(16, 185, 129, 0.14);
        --success-border: rgba(52, 211, 153, 0.38);
        --danger: #f43f5e;
        --danger-bg: rgba(244, 63, 94, 0.14);
        --danger-border: rgba(251, 113, 133, 0.38);
        --warning: #f59e0b;
        --warning-bg: rgba(245, 158, 11, 0.15);
        --warning-border: rgba(251, 191, 36, 0.4);

        /* Distinct Pane Hierarchy Variables */
        --passage-bg: rgba(6, 9, 19, 0.78);
        --input-bg: rgba(18, 27, 52, 0.88);
        --input-focus-bg: rgba(23, 35, 66, 0.95);
        --editor-elevation: 0 20px 45px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(56, 189, 248, 0.28), inset 0 1px 0 0 rgba(255, 255, 255, 0.22);
        --editor-focus-elevation: 0 24px 55px -8px rgba(56, 189, 248, 0.28), 0 0 0 2px var(--primary), inset 0 1px 0 0 rgba(255, 255, 255, 0.35);

        /* Categorized Error Heatmap Colors */
        --err-cap: #38bdf8;
        --err-cap-bg: rgba(56, 189, 248, 0.14);
        --err-punct: #f59e0b;
        --err-punct-bg: rgba(245, 158, 11, 0.15);
        --err-space: #a855f7;
        --err-space-bg: rgba(168, 85, 247, 0.16);
        --err-lex: #f43f5e;
        --err-lex-bg: rgba(244, 63, 94, 0.15);

        --hl-bg: rgba(56, 189, 248, 0.2);
        --hl-text: #7dd3fc;
        --card-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.18);
        --orb-opacity: 0.48;
        --sidebar-width: 276px;
        --sidebar-collapsed-width: 76px;
    }

    [data-theme="light"] {
        --bg-base: #eef2ff;
        --bg-elevated: #e0e7ff;
        --glass-surface: rgba(255, 255, 255, 0.68);
        --glass-surface-hover: rgba(255, 255, 255, 0.86);
        --glass-Heavy: rgba(255, 255, 255, 0.86);
        --glass-pill: rgba(15, 23, 42, 0.06);
        --glass-pill-active: #0f172a;
        --glass-border: rgba(15, 23, 42, 0.1);
        --glass-border-strong: rgba(59, 130, 246, 0.32);
        --specular-top: rgba(255, 255, 255, 0.9);
        --text: #0f172a;
        --text-secondary: #1e293b;
        --muted: #475569;
        --primary: #2563eb;
        --primary-glow: rgba(37, 99, 235, 0.25);
        --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 55%, #7c3aed 100%);
        --primary-dark: #1d4ed8;
        --accent: #4f46e5;
        --success: #059669;
        --success-bg: rgba(16, 185, 129, 0.12);
        --success-border: rgba(16, 185, 129, 0.4);
        --danger: #e11d48;
        --danger-bg: rgba(244, 63, 94, 0.1);
        --danger-border: rgba(244, 63, 94, 0.35);
        --warning: #d97706;
        --warning-bg: rgba(245, 158, 11, 0.14);
        --warning-border: rgba(245, 158, 11, 0.4);

        /* Distinct Pane Hierarchy Variables (Light) */
        --passage-bg: rgba(226, 232, 240, 0.75);
        --input-bg: #ffffff;
        --input-focus-bg: #ffffff;
        --editor-elevation: 0 18px 38px -10px rgba(37, 99, 235, 0.15), 0 0 0 1px rgba(37, 99, 235, 0.25), inset 0 1px 0 0 #ffffff;
        --editor-focus-elevation: 0 22px 48px -8px rgba(37, 99, 235, 0.28), 0 0 0 2px var(--primary);

        /* Categorized Error Heatmap Colors (Light) */
        --err-cap: #0284c7;
        --err-cap-bg: rgba(2, 132, 199, 0.12);
        --err-punct: #d97706;
        --err-punct-bg: rgba(217, 119, 6, 0.13);
        --err-space: #7c3aed;
        --err-space-bg: rgba(124, 58, 237, 0.12);
        --err-lex: #e11d48;
        --err-lex-bg: rgba(225, 29, 72, 0.11);

        --hl-bg: rgba(37, 99, 235, 0.14);
        --hl-text: #1d4ed8;
        --card-shadow: 0 18px 40px -15px rgba(15, 23, 42, 0.1), inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
        --orb-opacity: 0.32;
    }

    * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    html { scroll-behavior: smooth; }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
        background-color: var(--bg-base);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        transition: background-color 0.4s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s ease;
    }

    /* ================= AMBIENT LIQUID MESH / AURORA BACKGROUND ================= */
    .liquid-bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
    }
    .aurora-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(95px);
        opacity: var(--orb-opacity);
        animation: floatAurora 22s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
    }
    .orb-1 { width: 52vw; height: 52vw; max-width: 680px; max-height: 680px; background: radial-gradient(circle, #4f46e5 0%, #3b82f6 50%, transparent 75%); top: -14%; left: -10%; }
    .orb-2 { width: 46vw; height: 46vw; max-width: 600px; max-height: 600px; background: radial-gradient(circle, #06b6d4 0%, #0ea5e9 50%, transparent 75%); top: 18%; right: -12%; animation-delay: -6s; animation-duration: 26s; }
    .orb-3 { width: 48vw; height: 48vw; max-width: 640px; max-height: 640px; background: radial-gradient(circle, #8b5cf6 0%, #ec4899 50%, transparent 75%); bottom: -16%; left: 18%; animation-delay: -12s; animation-duration: 29s; }
    .orb-4 { width: 34vw; height: 34vw; max-width: 440px; max-height: 440px; background: radial-gradient(circle, #10b981 0%, #3b82f6 60%, transparent 75%); bottom: 12%; right: 15%; animation-delay: -17s; animation-duration: 24s; }
    .liquid-grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: 
            linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 50% 30%, black 35%, transparent 85%);
        -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 35%, transparent 85%);
    }
    @keyframes floatAurora {
        0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
        50%  { transform: translate3d(45px, -35px, 0) scale(1.08) rotate(8deg); }
        100% { transform: translate3d(-35px, 40px, 0) scale(0.95) rotate(-6deg); }
    }

    /* ================= TOP DYNAMIC ISLAND BAR ================= */
    .dynamic-island-wrap {
        max-width: 1600px;
        margin: 12px auto 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        z-index: 101;
        position: relative;
    }
    .dynamic-island {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 7px 16px;
        border-radius: 999px;
        background: var(--glass-Heavy);
        backdrop-filter: blur(30px) saturate(200%);
        -webkit-backdrop-filter: blur(30px) saturate(200%);
        border: 1px solid var(--glass-border-strong);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 var(--specular-top);
        font-size: 0.82rem;
        font-weight: 600;
    }
    .island-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 12px #10b981;
        animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.28); opacity: 0.65; }
    }
    .island-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .glass-icon-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--glass-surface);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid var(--glass-border);
        color: var(--text);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: inset 0 1px 0 0 var(--specular-top);
        transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-icon-btn:hover {
        background: var(--glass-surface-hover);
        border-color: var(--primary);
        transform: translateY(-1px);
    }
    .kbd-shortcut {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--glass-pill);
        border: 1px solid var(--glass-border);
        color: var(--muted);
    }

    /* ================= APP SHELL & COLLAPSIBLE SIDEBAR LAYOUT ================= */
    .app-shell {
        max-width: 1600px;
        margin: 14px auto 0 auto;
        padding: 0 20px 80px 20px;
        display: flex;
        align-items: flex-start;
        gap: 20px;
    }

    .app-sidebar {
        width: var(--sidebar-width);
        flex-shrink: 0;
        position: sticky;
        top: 14px;
        max-height: calc(100vh - 28px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--glass-Heavy);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border: 1px solid var(--glass-border-strong);
        border-radius: 24px;
        padding: 16px 12px;
        box-shadow: var(--card-shadow);
        transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1), padding 0.32s ease;
        z-index: 98;
        overflow: hidden;
    }

    body.sidebar-collapsed .app-sidebar {
        width: var(--sidebar-collapsed-width);
        padding: 16px 10px;
    }

    .sidebar-top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 6px 14px 6px;
        border-bottom: 1px solid var(--glass-border);
        margin-bottom: 12px;
    }

    .sidebar-brand {
        overflow: hidden;
        white-space: nowrap;
        transition: opacity 0.2s ease, width 0.2s ease;
    }
    .sidebar-brand h1 {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--text) 15%, var(--primary) 70%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .sidebar-brand p {
        margin: 2px 0 0 0;
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 500;
    }

    body.sidebar-collapsed .sidebar-brand,
    body.sidebar-collapsed .tab-label,
    body.sidebar-collapsed .tab-sub,
    body.sidebar-collapsed .mastery-details {
        opacity: 0;
        width: 0;
        height: 0;
        overflow: hidden;
        pointer-events: none;
        display: none;
    }

    .sidebar-collapse-btn {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        border: 1px solid var(--glass-border-strong);
        background: var(--glass-pill);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
        transition: all 0.22s ease;
    }
    .sidebar-collapse-btn:hover {
        background: var(--glass-surface-hover);
        border-color: var(--primary);
        color: var(--primary);
    }
    body.sidebar-collapsed .sidebar-top-header {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
    }

    .nav-tabs {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .tab-btn {
        width: 100%;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid transparent;
        padding: 11px 12px;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        font-family: inherit;
        text-align: left;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
    }
    .tab-btn .tab-icon {
        font-size: 1.2rem;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .tab-btn .tab-text-wrap {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        line-height: 1.25;
    }
    .tab-btn .tab-sub {
        font-size: 0.71rem;
        color: var(--muted);
        font-weight: 500;
        margin-top: 2px;
    }
    .tab-btn:hover {
        color: var(--text);
        background: var(--glass-pill);
        border-color: var(--glass-border);
    }
    .tab-btn.active {
        background: var(--primary-gradient);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 22px -4px var(--primary-glow), inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
    }
    .tab-btn.active .tab-sub {
        color: rgba(255, 255, 255, 0.82);
    }
    body.sidebar-collapsed .tab-btn {
        justify-content: center;
        padding: 12px 0;
    }

    /* Sidebar Mastery Footer */
    .sidebar-footer {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--glass-border);
    }
    .mastery-meter-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--glass-pill);
        border: 1px solid var(--glass-border);
        padding: 10px 12px;
        border-radius: 16px;
    }
    body.sidebar-collapsed .mastery-meter-wrap {
        justify-content: center;
        padding: 8px 4px;
    }
    .mastery-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 6px;
    }
    .mastery-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--primary-gradient);
        border-radius: 999px;
        transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ================= MAIN WORKSPACE & STICKY CONSOLIDATED TOOLBAR ================= */
    .workspace-main {
        flex: 1;
        min-width: 0;
    }

    .sticky-action-toolbar {
        position: sticky;
        top: 14px;
        z-index: 95;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        background: var(--glass-Heavy);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        padding: 12px 18px;
        border-radius: 22px;
        border: 1px solid var(--glass-border-strong);
        box-shadow: 0 18px 42px -10px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 var(--specular-top);
        margin-bottom: 22px;
        transition: all 0.3s ease;
    }

    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    /* ================= RADIAL PROGRESS RINGS (SVG GAUGES) ================= */
    .radial-gauge-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 8px;
        border-radius: 16px;
        background: var(--glass-pill);
        border: 1px solid var(--glass-border-strong);
        box-shadow: inset 0 1px 0 0 var(--specular-top);
    }
    .radial-svg {
        width: 44px;
        height: 44px;
        transform: rotate(-90deg);
        flex-shrink: 0;
    }
    .radial-bg {
        fill: none;
        stroke: rgba(148, 163, 184, 0.2);
        stroke-width: 4;
    }
    .radial-meter {
        fill: none;
        stroke: var(--success);
        stroke-width: 4;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.55s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease;
    }
    .radial-center-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem;
        font-weight: 800;
        fill: var(--text);
    }
    .radial-meta {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
    }
    .radial-meta-title {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 700;
    }
    .radial-meta-val {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.92rem;
        font-weight: 800;
        color: var(--text);
    }

    /* ================= DISTINCT PANE SEPARATION: PROMPT VS ACTIVE INPUT ================= */
    .reference-slate {
        background: var(--passage-bg);
        border: 1px solid var(--glass-border);
        border-left: 4px solid var(--muted);
        border-radius: 16px;
        padding: 14px 18px;
        margin: 12px 0 18px 0;
        box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.35);
        position: relative;
    }
    .pane-micro-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--glass-border);
    }
    .reference-slate .passage-body {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.08rem;
        line-height: 1.75;
        color: var(--text-secondary);
        user-select: text;
    }

    .active-editor-shell {
        background: var(--input-bg);
        border: 1px solid var(--glass-border-strong);
        border-radius: 18px;
        padding: 14px 16px;
        margin: 14px 0;
        box-shadow: var(--editor-elevation);
        transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .active-editor-shell:focus-within {
        background: var(--input-focus-bg);
        box-shadow: var(--editor-focus-elevation);
        transform: translateY(-1px);
    }
    .active-editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--glass-border);
    }
    .editor-focus-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.74rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--primary);
    }
    .editor-live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 8px var(--primary);
    }
    .active-editor-shell textarea {
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 4px 2px;
        width: 100%;
        min-height: 115px;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.1rem;
        line-height: 1.75;
        color: var(--text);
        resize: vertical;
    }
    .active-editor-shell textarea:focus {
        outline: none;
        box-shadow: none;
    }

    /* ================= LIVE PUNCTUATION MATCH & DIFF VISUALIZATION ENGINE ================= */
    .diff-viz-dashboard {
        margin-top: 16px;
        border-radius: 18px;
        background: var(--glass-Heavy);
        border: 1px solid var(--glass-border-strong);
        box-shadow: var(--card-shadow);
        overflow: hidden;
        display: none;
    }
    .diff-viz-dashboard.show {
        display: block;
        animation: panelFadeIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .diff-viz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        padding: 14px 18px;
        background: var(--glass-pill);
        border-bottom: 1px solid var(--glass-border);
    }
    .diff-gauges-row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }

    /* Heatmap Category Legend Pills */
    .heatmap-legend {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;

    .legend-pill {
        display: inline-flex;
        align-items: center;

        border: 1px solid transparent;

        width: 8px;
        height: 8px;

    .legend-punct { background: var(--err-punct-bg); color: var(--err-punct); border-color: var(--err-punct); }
    .legend-space { background: var(--err-space-bg); color: var(--err-space); border-color: var(--err-space); }
    .legend-lex { background: var(--err-lex-bg); color: var(--err-lex); border-color: var(--err-lex); }

    /* Segmented View Switcher (Inline vs Git Split) */
    .view-mode-switch {
        display: inline-flex;
        background: rgba(0, 0, 0, 0.25);
        padding: 4px;
        border-radius: 12px;
        border: 1px solid var(--glass-border);

    .view-mode-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 9px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .view-mode-btn.active {
        background: var(--primary-gradient);
        color: #ffffff;
        box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Inline Hover Diff Canvas */
    .diff-inline-view {
        padding: 20px 22px;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.12rem;
        line-height: 1.95;
        color: var(--text);
    }
    .diff-token-ok {
        color: var(--text);
        transition: color 0.15s ease;
    }
    .diff-token-err {
        position: relative;
        display: inline-block;
        padding: 0 4px;
        margin: 0 1px;
        border-radius: 5px;
        font-weight: 600;
        cursor: help;
        transition: all 0.18s ease;
    }
    .diff-token-err[data-cat="cap"] {
        background: var(--err-cap-bg);
        color: var(--err-cap);
        border-bottom: 2.5px solid var(--err-cap);
    }
    .diff-token-err[data-cat="punct"] {
        background: var(--err-punct-bg);
        color: var(--err-punct);
        border-bottom: 2.5px wavy var(--err-punct);
    }
    .diff-token-err[data-cat="space"] {
        background: var(--err-space-bg);
        color: var(--err-space);
        border-bottom: 2.5px dashed var(--err-space);
    }
    .diff-token-err[data-cat="lex"] {
        background: var(--err-lex-bg);
        color: var(--err-lex);
        border-bottom: 2.5px solid var(--err-lex);
    }
    .diff-token-err:hover, .diff-token-err.linked-hover {
        transform: translateY(-1px);
        filter: brightness(1.2);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Git-Style Side-by-Side Comparison View */
    .diff-split-view {
        display: none;
        position: relative;
        grid-template-columns: 1fr 64px 1fr;
        border-top: 1px solid var(--glass-border);
    }
    .diff-split-view.active {
        display: grid;
    }
    .split-pane {
        padding: 16px 18px;
        max-height: 310px;
        overflow-y: auto;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.05rem;
        line-height: 1.9;
        scroll-behavior: auto;
    }
    .split-pane-left {
        background: rgba(244, 63, 94, 0.03);
        border-right: 1px solid var(--glass-border);
    }
    .split-pane-right {
        background: rgba(16, 185, 129, 0.03);
        border-left: 1px solid var(--glass-border);
    }
    .split-pane-title {
        font-family: 'Inter', sans-serif;
        font-size: 0.73rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .split-gutter {
        position: relative;
        background: rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .git-connector-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
    }
    .git-connector-path {
        fill: none;
        stroke-width: 1.8;
        opacity: 0.55;
        transition: stroke-width 0.15s ease, opacity 0.15s ease;
    }
    .git-connector-path.active-line {
        stroke-width: 3.2;
        opacity: 1;
        filter: drop-shadow(0 0 6px currentColor);
    }

    /* Floating Interactive Diff Tooltip */
    .floating-diff-tooltip {
        position: fixed;
        z-index: 9999;
        max-width: 360px;
        background: var(--glass-Heavy);
        backdrop-filter: blur(28px) saturate(200%);
        -webkit-backdrop-filter: blur(28px) saturate(200%);
        border: 1px solid var(--glass-border-strong);
        border-radius: 16px;
        padding: 12px 15px;
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 0 var(--specular-top);
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px) scale(0.97);
        transition: opacity 0.16s ease, transform 0.16s ease;
    }
    .floating-diff-tooltip.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    .tt-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
    }
    .tt-cat-badge {
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 8px;
        border-radius: 999px;
    }
    .tt-transform {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.88rem;
        padding: 6px 10px;
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.28);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .tt-wrong { color: #fb7185; text-decoration: line-through; }
    .tt-right { color: #34d399; font-weight: 700; }
    .tt-rule {
        font-size: 0.81rem;
        color: var(--text-secondary);
        line-height: 1.45;
    }

    /* Toast Notification Banner (Replaces native alert) */
    .liquid-toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9998;
        background: var(--glass-Heavy);
        backdrop-filter: blur(28px) saturate(200%);
        border: 1px solid var(--primary);
        color: var(--text);
        padding: 14px 20px;
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        font-weight: 600;
        font-size: 0.9rem;
        display: none;
        align-items: center;
        gap: 10px;
        animation: panelFadeIn 0.28s ease;
    }
    .liquid-toast.show {
        display: flex;
    }

    /* ================= EXISTING COMPONENT REFINEMENTS ================= */
    .panel { display: none; animation: panelFadeIn 0.38s cubic-bezier(0.22, 1, 0.36, 1); }
    .panel.active { display: block; }
    @keyframes panelFadeIn {
        from { opacity: 0; transform: translateY(10px) scale(0.994); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
        position: relative;
        background: var(--glass-surface);
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        border: 1px solid var(--glass-border);
        border-radius: 22px;
        padding: 22px 24px;
        margin-bottom: 18px;
        box-shadow: var(--card-shadow);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        overflow: hidden;
    }
    .card:hover { border-color: var(--glass-border-strong); }

    select, input[type="text"] {
        padding: 9px 13px;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--glass-border-strong);
        border-radius: 12px;
        font-size: 0.88rem;
        font-family: inherit;
        outline: none;
        transition: all 0.2s ease;
    }
    select:focus, input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .btn {
        background: var(--primary-gradient);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 15px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.84rem;
        font-family: inherit;
        box-shadow: 0 6px 18px -4px var(--primary-glow), inset 0 1px 0 0 rgba(255, 255, 255, 0.35);
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .btn-outline { background: var(--glass-pill); color: var(--text); border: 1px solid var(--glass-border-strong); box-shadow: none; }
    .btn-outline:hover { background: var(--glass-surface-hover); border-color: var(--primary); }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; border-radius: 9px; }

    .timer-pill {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.08rem;
        font-weight: 800;
        padding: 7px 14px;
        border-radius: 12px;
        background: var(--warning-bg);
        color: #fbbf24;
        border: 1px solid var(--warning-border);
        font-variant-numeric: tabular-nums;
        display: inline-flex;
        align-items: center;
        gap: 7px;
    }
    [data-theme="light"] .timer-pill { color: #b45309; }
    .timer-pill.urgent {
        background: var(--danger-bg);
        color: #fb7185;
        border-color: var(--danger-border);
        animation: urgentPulse 1s infinite alternate;
    }
    @keyframes urgentPulse {
        from { transform: scale(1); }
        to   { transform: scale(1.04); }
    }

    .solution-box {
        background: var(--success-bg);
        border: 1px solid var(--success-border);
        border-left: 4px solid var(--success);
        padding: 18px 20px;
        border-radius: 16px;
        margin-top: 14px;
        display: none;
    }
    .solution-box.show { display: block; }
    .hl { background: var(--hl-bg); color: var(--hl-text); padding: 2px 7px; border-radius: 6px; font-weight: 700; }
    code { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; background: var(--glass-pill); padding: 2px 7px; border-radius: 6px; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 12px; }
    .check-item { display: flex; align-items: flex-start; gap: 10px; background: var(--glass-surface); border: 1px solid var(--glass-border); padding: 10px 13px; border-radius: 12px; font-size: 0.88rem; cursor: pointer; }
    .check-item input { margin-top: 4px; transform: scale(1.2); accent-color: var(--success); }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; font-size: 0.75rem; font-weight: 700; border-radius: 999px; background: var(--hl-bg); color: var(--hl-text); border: 1px solid rgba(56, 189, 248, 0.3); }
    .feedback-msg { margin-top: 10px; padding: 11px 15px; border-radius: 12px; font-weight: 600; display: none; }
    .feedback-msg.ok { display: block; background: var(--success-bg); color: #34d399; border: 1px solid var(--success-border); }
    .feedback-msg.err { display: block; background: var(--danger-bg); color: #fb7185; border: 1px solid var(--danger-border); }
    .quick-slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 12px 0; padding: 14px; border-radius: 16px; background: var(--glass-pill); border: 1px solid var(--glass-border); }
    .slot-box { display: flex; flex-direction: column; gap: 4px; }
    .slot-box label { font-size: 0.75rem; font-weight: 700; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .slot-box input.slot-ok { border-color: var(--success); background: var(--success-bg); }
    .slot-box input.slot-err { border-color: var(--danger); background: var(--danger-bg); }
    .star-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--muted); border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 0.82rem; }
    .star-btn.starred { color: #fbbf24; border-color: rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.12); }

    /* Command Palette & Tables */
    .cmd-backdrop { position: fixed; inset: 0; z-index: 999; background: rgba(2, 6, 23, 0.65); backdrop-filter: blur(12px); display: none; align-items: flex-start; justify-content: center; padding-top: 9vh; }
    .cmd-backdrop.open { display: flex; }
    .cmd-modal { width: 92%; max-width: 740px; background: var(--glass-Heavy); border: 1px solid var(--glass-border-strong); border-radius: 24px; overflow: hidden; }
    .cmd-header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--glass-border); }
    .cmd-header input { width: 100%; border: none; background: transparent; font-size: 1.05rem; color: var(--text); }
    .cmd-results { max-height: 62vh; overflow-y: auto; padding: 12px 16px; }
    .cmd-item { padding: 12px 14px; border-radius: 14px; margin-bottom: 8px; background: var(--glass-pill); }
    .liquid-table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--glass-border); }
    table.liquid-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.liquid-table thead tr { background: var(--primary-gradient); color: #ffffff; text-align: left; }
    table.liquid-table th, table.liquid-table td { padding: 12px 14px; border-bottom: 1px solid var(--glass-border); }

    @media (max-width: 1024px) {
        .app-shell { flex-direction: column; }
        .app-sidebar, body.sidebar-collapsed .app-sidebar { width: 100%; position: static; max-height: none; }
        .nav-tabs { flex-direction: row; flex-wrap: wrap; }
        .tab-btn { flex: 1 1 180px; }
        .diff-split-view.active { grid-template-columns: 1fr; }
        .split-gutter { display: none; }
    }
</style>
</head>

<script>
const DATA = {"verbRules": [{"rule_no": 1, "part": "Part 1: Subject–Verb Agreement", "title": "Basic Agreement between Subject and Verb", "rule": "A singular subject takes a singular verb (V+s/es, is, was, has, does), while a plural subject takes a plural verb (base V1, are, were, have, do).", "madam_examples": ["The dog barks when it is angry.", "The dogs growl when they are angry."], "wrong_to_right": "The financial reports shows a steady growth. -> show (Plural subject 'reports' requires plural verb 'show')."}, {"rule_no": 2, "part": "Part 1: Subject–Verb Agreement", "title": "Ignore Words Between Subject and Verb", "rule": "Prepositional phrases, relative clauses, or modifiers placed between the head subject and the verb NEVER change the number of the subject.", "madam_examples": ["The dog, who is chewing on my jeans, is usually very good.", "The colours of the rainbow are beautiful.", "A bouquet of yellow roses lends colour and fragrance to the room."], "wrong_to_right": "The quality of the products manufactured by this company have improved. -> has (Head subject is singular 'The quality', not 'products')."}, {"rule_no": 3, "part": "Part 1: Subject–Verb Agreement", "title": "Subjects Beginning with 'There' or 'Here'", "rule": "'There' and 'Here' are never the true subject. Look at the real noun AFTER the verb to decide singular vs. plural.", "madam_examples": ["There is a problem with the balance sheet.", "There are several problems with the balance sheet."], "wrong_to_right": "There is several discrepancies in the audit report. -> are (Real subject 'several discrepancies' is plural)."}, {"rule_no": 4, "part": "Part 1: Subject–Verb Agreement", "title": "Two Subjects Connected by 'and' (& Single-Concept Exception)", "rule": "Two distinct subjects joined by 'and' take a plural verb. EXCEPTION: When the two words refer to one person, one dish, or a single unified concept, use a singular verb.", "madam_examples": ["The cow and the pig are in the field.", "Jamal and Rahman are available.", "Swimming in the ocean and playing drums are my hobbies.", "Exception: Red beans and rice is my mother's favourite dish.", "Exception: Breaking and entering is against the law.", "Exception: The bed and breakfast was charming."], "wrong_to_right": "Research and development are the core unit of our firm. -> is (When treated as a single department/concept: 'Bread and butter is...', 'Slow and steady wins...')."}, {"rule_no": 5, "part": "Part 1: Subject–Verb Agreement", "title": "Or, Nor, Either...Or, Neither...Nor, Not Only...But Also (Rule of Proximity)", "rule": "When two subjects are joined by 'or', 'nor', 'either...or', 'neither...nor', or 'not only...but also', the verb agrees with the CLOSER subject (the subject nearest to the verb).", "madam_examples": ["Neither Jamal nor Rahman is available.", "Neither the teacher nor the students are present.", "Neither the students nor the teacher is present.", "Either Rahim or his friends are attending the programme.", "Not only the students but also the teacher is responsible for the arrangement."], "wrong_to_right": "Neither the teacher nor the students was aware of the sudden change. -> were (Nearest subject 'students' is plural)."}, {"rule_no": 6, "part": "Part 1: Subject–Verb Agreement", "title": "Subjects with Each, Every, No, Everybody, Nobody vs. Few, Many, Several, Both", "rule": "'Each', 'every', 'no', 'each of', 'everybody', 'everyone', 'nobody', 'someone', 'neither of', 'either of', 'one of' take a SINGULAR verb. However, 'few', 'many', 'several', and 'both' take a PLURAL verb.", "madam_examples": ["Every man and woman is required to check in.", "Each student and teacher has a responsibility.", "Everybody wants to be loved. / Nobody knows the answer.", "Each of the students has submitted the assignment.", "Contrast: Few/Many/Several/Both generally take plural verbs."], "wrong_to_right": "Each of the participants receive a certificate. -> receives ('Each of + plural noun' always takes a singular verb!)."}, {"rule_no": 7, "part": "Part 1: Subject–Verb Agreement", "title": "Collective Nouns", "rule": "Collective nouns (committee, class, team, board, herd, crowd, jury, family, management) take a SINGULAR verb when the group acts as one single unit.", "madam_examples": ["The committee has approved the proposal.", "The class is preparing for the examination."], "wrong_to_right": "The committee have approved the budget yesterday. -> approved / has approved (Treated as a single unit)."}, {"rule_no": 8, "part": "Part 1: Subject–Verb Agreement", "title": "Units of Measurement, Time, Money, Weight, and Distance", "rule": "When a plural quantity of time, money, distance, or weight is treated as one single amount or unit, it takes a SINGULAR verb.", "madam_examples": ["Three miles is too far to walk.", "Five years is a long time to wait."], "wrong_to_right": "Fifty thousand taka are a large sum for this startup. -> is (Single total sum of money)."}, {"rule_no": 9, "part": "Part 1: Subject–Verb Agreement", "title": "Accompaniment Expressions (along with, as well as, together with, in addition to)", "rule": "Phrases like 'along with', 'as well as', 'together with', 'accompanied by', 'in addition to', and 'including' DO NOT change the number of the first (main) subject.", "madam_examples": ["The politician, along with the newsmen, is expected shortly.", "Excitement, as well as nervousness, is the cause of her shaking."], "wrong_to_right": "The manager, along with his assistants, are attending the meeting at present. -> is (Agree with singular 'The manager', ignore 'along with his assistants')."}, {"rule_no": 10, "part": "Part 2: Tenses", "title": "Present Simple for Universal Truths, Scientific Facts & Habitual Actions", "rule": "Use the Present Simple (V1 / V+s/es) for general truths, scientific laws, and regular habits.", "madam_examples": ["The sun rises in the east.", "Water boils at 100°C at standard atmospheric pressure."], "wrong_to_right": "The earth was revolving around the sun. -> revolves (Universal truth always uses Present Simple)."}, {"rule_no": 11, "part": "Part 2: Tenses", "title": "Third-Person Singular in Present Simple & Negatives/Questions", "rule": "With he/she/it/singular noun, add -s/-es in affirmative sentences. After 'does not' or 'does', ALWAYS use the base verb V1 (drop the -s/-es!). Signal words: always, usually, often, sometimes, frequently, every day.", "madam_examples": ["The boy plays football. / She goes to university.", "He does not play football. / Does she go to university?"], "wrong_to_right": "He does not attends the seminar regularly. -> attend (After 'does not', use base form V1)."}, {"rule_no": 12, "part": "Part 2: Tenses", "title": "Present Continuous for Actions Happening Now", "rule": "Use am/is/are + V-ing for actions happening right now or around the present moment. Signal words: now, right now, at present, at the moment, currently.", "madam_examples": ["He is singing a song now.", "They are preparing for the examination at present.", "I am working on an assignment at the moment."], "wrong_to_right": "They prepare for the presentation at present. -> are preparing ('at present' triggers Present Continuous)."}, {"rule_no": 13, "part": "Part 2: Tenses", "title": "Past Simple for Completed Past Actions", "rule": "Use Past Simple (V2) for actions completed at a definite past time. Signal words: yesterday, last night, last week, last year, ago, in 2020.", "madam_examples": ["He left home last night.", "She visited Dhaka yesterday.", "They completed the assignment two days ago."], "wrong_to_right": "The committee has approved the proposal yesterday. -> approved (Definite past time 'yesterday' forbids Present Perfect; use Past Simple V2)."}, {"rule_no": 14, "part": "Part 2: Tenses", "title": "Future Forms (will + V1)", "rule": "Use will/shall + base verb (V1) for predictions, promises, and future events (tomorrow, next week, upcoming). Note: In passive voice, use 'will be + V3'.", "madam_examples": ["Rina will go to university tomorrow.", "I will help you with the assignment.", "They will complete the work next week."], "wrong_to_right": "The final examination results will publish by the department next week. -> will be published (Future Passive: results are published by the department)."}, {"rule_no": 15, "part": "Part 2: Tenses", "title": "Present Perfect with just, already, yet, recently, lately, so far", "rule": "Use have/has + V3 with 'just', 'already', 'yet', 'recently', 'lately', 'ever', 'never', 'so far' when a past action connects to the present.", "madam_examples": ["I have just finished my work.", "She has already submitted the assignment.", "Have you finished yet?", "I have recently read that book."], "wrong_to_right": "She completed the assignment already, so she can rest now. -> has completed ('already' + present result requires Present Perfect)."}, {"rule_no": 16, "part": "Part 2: Tenses", "title": "'Since' and 'For' with Present Perfect / Present Perfect Continuous", "rule": "Use 'have/has been + V-ing' (or 'have/has + V3' for stative verbs like know, be, have) when an action started in the past and continues up to now with 'since' (starting point: since 2021, since Monday) or 'for' (duration: for two hours, for five years).", "madam_examples": ["I have been studying for two hours.", "She has been working here since 2022.", "I have known him for five years."], "wrong_to_right": "She is working at this institution since 2021. -> has been working (Never use simple Present Continuous 'is working' with 'since/for'!)."}, {"rule_no": 17, "part": "Part 2: Tenses", "title": "Sequence of Past Actions: 'Before' and 'After' (Past Perfect)", "rule": "When two actions occurred in the past, the EARLIER action takes Past Perfect (had + V3) and the LATER action takes Past Simple (V2). Formula: [Past Perfect (had + V3)] + BEFORE / BY THE TIME + [Past Simple (V2)]; [Past Simple (V2)] + AFTER + [Past Perfect (had + V3)].", "madam_examples": ["The patient died after the doctor had arrived.", "The patient had died before the doctor arrived."], "wrong_to_right": "The patient died after the doctor arrived at the hospital. -> had arrived (After + Past Perfect 'had arrived')."}, {"rule_no": 18, "part": "Part 3: Modal Verbs & Special Structures", "title": "Modal Verbs Followed by Base Form (modal + V1)", "rule": "After can, could, may, might, must, shall, should, will, would, ought to, had better, would rather, use the bare infinitive V1 (or 'modal + be + V3' in passive).", "madam_examples": ["I must go there.", "She can solve the problem.", "You should study regularly."], "wrong_to_right": "You must reads the instructions carefully before operating the machine. -> read (Modal 'must' + V1)."}, {"rule_no": 19, "part": "Part 3: Modal Verbs & Special Structures", "title": "'It is time' and 'It is high time'", "rule": "When 'It is time' or 'It is high time' is followed by a subject, ALWAYS use the Past Simple (V2)! (Note: If there is no subject after 'time', use 'to + V1', e.g., 'It is time to leave').", "madam_examples": ["It is time we left.", "It is high time he left.", "It is time you started studying."], "wrong_to_right": "It is high time the authorities take effective measures to reduce traffic congestion. -> took ('It is high time + subject' requires V2 'took')."}, {"rule_no": 20, "part": "Part 3: Modal Verbs & Special Structures", "title": "'Wish' and Hypothetical Situations", "rule": "After 'wish': (1) For an unreal PRESENT state/action, use Past Simple (V2) or subjunctive 'were' (for all persons: I/he/she were). (2) For regret about the PAST, use Past Perfect (had + V3).", "madam_examples": ["I wish I were rich. (Unreal present situation)", "I wish I knew the answer. (Present situation)", "I wish I had studied harder. (Regret about the past)"], "wrong_to_right": "I wish I know how to solve this mathematical problem. -> knew (Unreal present wish requires V2 'knew')."}, {"rule_no": 21, "part": "Part 3: Modal Verbs & Special Structures", "title": "'As if' and 'As though'", "rule": "(1) Present verb + as if / as though + Past Simple (V2 / were) for an unreal present comparison. (2) Past verb (or clear prior past context) + as if / as though + Past Perfect (had + V3).", "madam_examples": ["He behaves as if he were mad.", "She talks as though she knew everything.", "He looked as if he had seen a ghost."], "wrong_to_right": "She speaks as though she knows everything about the incident. -> knew (Unreal comparison after 'as though' takes V2 'knew')."}, {"rule_no": 22, "part": "Part 3: Modal Verbs & Special Structures", "title": "'Lest' (Fear of Undesirable Result)", "rule": "'Lest' means 'for fear that' and is ALWAYS followed by 'should + V1' (active) or 'should be + V3' (passive) — or subjunctive base V1. Never use 'not' after 'lest'!", "madam_examples": ["Walk carefully lest you should fall.", "Study regularly lest you should fail."], "wrong_to_right": "The thief ran away lest he caught by the security guards. -> should be caught (Passive after 'lest': 'should be + V3')."}, {"rule_no": 23, "part": "Part 3: Modal Verbs & Special Structures", "title": "'No sooner...than', 'Hardly...when', 'Scarcely...when/before'", "rule": "Inverted Past Perfect structures: (1) No sooner + had + Subject + V3 + THAN + Subject + V2. (2) Hardly / Scarcely + had + Subject + V3 + WHEN / BEFORE + Subject + V2.", "madam_examples": ["No sooner had I reached home than she left.", "Hardly had the class begun when the electricity went out.", "Scarcely had he arrived before the meeting started."], "wrong_to_right": "No sooner had the examination began than the students started talking. -> begun (After 'had', use V3 'begun', not V2 'began'!)."}, {"rule_no": 24, "part": "Part 4: Gerunds", "title": "Gerunds (V-ing) as Subjects", "rule": "A single gerund or gerund phrase used as the subject of a sentence takes a SINGULAR verb. Two distinct gerund phrases joined by 'and' take a plural verb.", "madam_examples": ["Swimming is good exercise.", "Giving is better than receiving.", "Seeing is believing.", "Contrast: Swimming in the ocean and playing drums are my hobbies."], "wrong_to_right": "Maintaining accurate financial records are essential for every firm. -> is (Subject is the singular gerund phrase 'Maintaining...')."}, {"rule_no": 25, "part": "Part 4: Gerunds", "title": "Gerunds After Prepositions", "rule": "Whenever a verb immediately follows a preposition (in, on, of, at, for, from, about, before, after, besides), it MUST be in the Gerund form (V-ing).", "madam_examples": ["He insisted on going.", "I am fond of catching fish.", "I am tired of writing."], "wrong_to_right": "She is capable of handle complex negotiations. -> handling (After preposition 'of', use V-ing)."}, {"rule_no": 26, "part": "Part 4: Gerunds", "title": "Gerunds After 'to' Used as a Preposition (High-Frequency Exam Trap!)", "rule": "After phrasal expressions where 'to' is a preposition, ALWAYS use V-ing (NOT V1!): look forward to, with a view to, be accustomed to, get used to, be used to, object to, be committed to, be dedicated to, be devoted to, contribute to, confess to,be opposed to.", "madam_examples": ["I look forward to meeting you.", "He went with a view to confessing.", "She is accustomed to working late."], "wrong_to_right": "I look forward to meet you at the annual programme next week. -> meeting ('look forward to' takes V-ing!)."}, {"rule_no": 27, "part": "Part 4: Gerunds", "title": "'By' and 'Without' Followed by a Gerund", "rule": "Both 'by' and 'without' are prepositions and must be followed by V-ing.", "madam_examples": ["By eating a balanced diet, you can maintain good health.", "Without working hard, you cannot succeed."], "wrong_to_right": "Without collect sufficient evidence, the investigator could not reach a conclusion. -> collecting (After 'without', use V-ing)."}, {"rule_no": 28, "part": "Part 4: Gerunds", "title": "Specific Verbs Followed by Gerunds (NOT Infinitives)", "rule": "Use V-ing after: enjoy, avoid, suggest, mind, admit, deny, finish, consider, practise, postpone, miss, quit, delay, risk, appreciate, resent.", "madam_examples": ["He enjoys reading.", "She avoided answering the question.", "Would you mind opening the window?"], "wrong_to_right": "He avoided to make any comments about the disagreement. -> making ('avoid' is followed by V-ing, never 'to + V1')."}, {"rule_no": 29, "part": "Part 4: Gerunds", "title": "Gerunds in Fixed Expressions & 'Used to' vs. 'Be/Get used to'", "rule": "Use V-ing after: cannot help / could not help, it is no use / it is no good, worth, busy, feel like, give up, keep (on), stop (quit), succeed in, excel in. CRITICAL DISTINCTION: Subject + used to + V1 (past habit) vs. Subject + be/get used to + V-ing (be/become accustomed to).", "madam_examples": ["I could not help laughing. / It is no use crying over spilt milk.", "He succeeded in solving the problem. / She excels in drawing pictures.", "He used to smoke. (Past habit = V1) vs. He is used to working late. (Accustomed = V-ing)"], "wrong_to_right": "I could not help to laugh at his remark. -> laughing ('could not help' takes V-ing)."}, {"rule_no": 30, "part": "Part 5: Infinitives", "title": "Full Infinitives (to + V1) After Specific Verbs", "rule": "Use 'to + V1' after: decide, desire, expect, promise, wish, want, offer, hope, refuse, agree, attempt, choose, fail, manage, plan, afford,pretend, seem, tend.", "madam_examples": ["She promised to speak the truth.", "We decided to go there.", "She refused to help me. / He managed to solve the problem."], "wrong_to_right": "She refused helping me with the documentation. -> to help ('refuse' takes full infinitive 'to + V1')."}, {"rule_no": 31, "part": "Part 5: Infinitives", "title": "Bare Infinitives (V1 without 'to') After 'Make' and 'Let'", "rule": "In the ACTIVE voice, 'make' and 'let' (+ causatives 'have' and 'bid') take Object + Bare Infinitive (V1 without 'to'). NOTE: In the PASSIVE voice, 'make' takes 'to + V1' ('He was made to apologize' - Rule 40).", "madam_examples": ["Let him stay.", "He made me cry.", "The teacher made the students rewrite the assignment."], "wrong_to_right": "The principal made the students to fill in the application forms again. -> fill in (Active 'make + object' takes bare infinitive V1 without 'to')."}, {"rule_no": 32, "part": "Part 5: Infinitives", "title": "Perception Verbs (see, hear, watch, feel, notice, observe) + Object + V1 or V-ing", "rule": "After perception verbs + object, use Bare Infinitive (V1) for a complete action viewed from start to finish, or Present Participle (V-ing) to emphasize an action in progress.", "madam_examples": ["I watched them play. / Did you hear me call you?", "We saw the plane land. / We felt the earth shake.", "In progress: The teacher noticed the students talking during the lecture."], "wrong_to_right": "The teacher noticed the students to talk during the lecture. -> talking / talk (Never 'to talk' after 'notice + object'!)."}, {"rule_no": 33, "part": "Part 5: Infinitives", "title": "Verb + Object + Full Infinitive (to + V1) & Special Rule for 'Help'", "rule": "Use 'Object + to + V1' (or 'not to + V1') after: ask, advise, command, compel, encourage, force, instruct, invite, oblige, order, remind, request, require, urge, warn. After 'help', BOTH bare infinitive and full infinitive are correct.", "madam_examples": ["I asked him to wait. / He forced me to open the door.", "She encouraged me to apply. / They warned us not to enter.", "He helped me carry (OR to carry) the luggage."], "wrong_to_right": "The teacher advised us checking our answers before submitting. -> to check ('advise + object' takes 'to + V1')."}, {"rule_no": 34, "part": "Part 5: Infinitives", "title": "'Prefer / Would prefer' with 'Rather than'", "rule": "In 'prefer to V1 rather than V1' or 'would prefer to V1 rather than V1', the verb after 'rather than' takes the bare infinitive (V1).", "madam_examples": ["I prefer to walk rather than take a bus.", "I would prefer to fight rather than surrender."], "wrong_to_right": "I would prefer to resign rather than accepting unethical terms. -> accept (After 'would prefer to V1 rather than', use bare V1)."}, {"rule_no": 35, "part": "Part 6: Participles", "title": "Present Participles (V-ing as Adjective / Active Modifier)", "rule": "Use V-ing to describe a noun or reduce an active relative clause ('who/which is doing something') when the noun performs the action.", "madam_examples": ["The sleeping child needs rest.", "The burning house was evacuated.", "The girl carrying a basket of flowers is my sister."], "wrong_to_right": "The boy stand near the entrance is a new student in our department. -> standing (Reduced active clause 'who is standing' -> 'standing')."}, {"rule_no": 36, "part": "Part 6: Participles", "title": "Past Participles (V3 as Adjective / Passive Modifier)", "rule": "Use V3 to modify a noun when the noun RECEIVES the action (reduced passive relative clause 'which was written/broken/burnt by...').", "madam_examples": ["The burnt house is not ours.", "The broken glass was on the floor.", "The letter was written yesterday."], "wrong_to_right": "The book wrote by the professor contains useful case studies. -> written (Reduced passive 'which was written' -> 'written', NOT main verb V2 'wrote' because 'contains' is already the main verb!)."}, {"rule_no": 37, "part": "Part 6: Participles", "title": "Perfect Participles (Having + V3)", "rule": "Use 'Having + V3' (active) or 'Having been + V3' (passive) at the start of a sentence to show that one action was completely finished before the next action began.", "madam_examples": ["Having done the work, I went to sleep.", "Having finished the assignment, she submitted it.", "Having received the message, he called me."], "wrong_to_right": "Complete the report, the researcher presented the findings to the committee. -> Having completed (Shows completion of the first action before presenting)."}, {"rule_no": 38, "part": "Part 6: Participles", "title": "Participles Taking Direct Objects", "rule": "Participles retain verb properties and can take objects while introducing a participial phrase (subject of both clauses must be the same!).", "madam_examples": ["Hearing a noise, he woke up.", "I saw a boy mending his shoes.", "Having completed the assignment, she left the room."], "wrong_to_right": "Hear a loud alarm, the workers evacuated the building immediately. -> Hearing (Present participle phrase)."}, {"rule_no": 39, "part": "Part 6: Participles", "title": "Participial Phrases & Nominative Absolute Constructions", "rule": "When the introductory phrase has its own subject different from the main clause subject, use an absolute construction: [Noun + being/having + V3], [Main Clause].", "madam_examples": ["The sky being clear, the plane took off.", "Having finished his work, he went home."], "wrong_to_right": "The weather was favourable, the outdoor seminar proceeded smoothly. -> being ('The weather being favourable, ...' avoids a comma splice!)."}, {"rule_no": 40, "part": "Part 7: Passive Voice", "title": "Passive Voice Across Tenses (be + V3) & Causative Passive", "rule": "When the subject RECEIVES the action (especially when 'by + agent' is present or the subject is an inanimate object like 'policy, report, studies, documents, results, furniture'), use 'be + V3' matching the tense: Present Simple (am/is/are + V3), Past Simple (was/were + V3), Present Continuous (am/is/are being + V3), Past Continuous (was/were being + V3), Present Perfect (have/has been + V3), Past Perfect (had been + V3), Future/Modal (will/must/should be + V3). Causative passive: 'was/were made to + V1'.", "madam_examples": ["A letter is written by him. / A letter was written by him.", "The work has been completed by him. / The report is being prepared by him.", "Active: They made him apologize. -> Passive: He was made to apologize."], "wrong_to_right": "The documents prepared by the administrative officer before the meeting started. -> had been prepared (Past Perfect Passive before 'started')."}, {"rule_no": 41, "part": "Part 9: Conditional Sentences", "title": "Zero Conditional (Scientific Facts & Always-True Results)", "rule": "Structure: If + Present Simple (V1 / V+s/es), Present Simple (V1 / V+s/es).", "madam_examples": ["If water reaches 100°C at standard atmospheric pressure, it boils."], "wrong_to_right": "If you heat ice, it will turns into water. -> turns (Zero conditional scientific fact: Present Simple in both clauses)."}, {"rule_no": 42, "part": "Part 9: Conditional Sentences", "title": "First Conditional (Real / Possible Future Situations)", "rule": "Structure: If + Present Simple (V1 / V+s/es), will / can / may + V1. (NEVER use 'will' inside the 'If' clause!).", "madam_examples": ["If it rains, I will stay home."], "wrong_to_right": "If the weather will be favourable tomorrow, we will arrange the programme outdoors. -> is (In 1st Conditional, the 'If' clause uses Present Simple 'is', never 'will be'!)."}, {"rule_no": 43, "part": "Part 9: Conditional Sentences", "title": "Second Conditional (Unreal / Hypothetical Present or Future)", "rule": "Structure: If + Past Simple (V2 / subjunctive 'were' for all subjects), would / could / might + V1.", "madam_examples": ["If I were rich, I would help the poor."], "wrong_to_right": "If the university provides additional laboratories, students would have better access. -> provided (Main clause has 'would + V1', so 'If' clause must be Past Simple V2 'provided')."}, {"rule_no": 44, "part": "Part 9: Conditional Sentences", "title": "Third Conditional (Unreal Past / Regret About Past)", "rule": "Structure: If + Past Perfect (had + V3), would / could / might + have + V3. (Also inverted form: 'Had + Subject + V3, Subject + would have + V3').", "madam_examples": ["If he had studied, he would have passed."], "wrong_to_right": "If she studied harder, she would have secured a better position in the examination. -> had studied (Main clause has 'would have + V3', so 'If' clause must be 'had + V3')."}], "capRules": [{"no": 1, "title": "First Word of Every Sentence", "rule": "Always capitalize the first word of every new sentence (and never randomly capitalize mid-sentence words like 'and', 'vegetables', etc.).", "examples": ["The project was completed on time.", "Because it was raining, the match was cancelled."]}, {"no": 2, "title": "The Pronoun 'I'", "rule": "No matter where it appears in a sentence, the pronoun 'I' (and contractions 'I'm', 'I've', 'I'll') is ALWAYS capitalized.", "examples": ["My friend and I are planning a trip.", "When I arrived, they had already started."]}, {"no": 3, "title": "Proper Nouns (People, Places, Organizations, Brands)", "rule": "Capitalize specific names of people (Dr. Rahman, Fatima), places (Bangladesh, Dhaka, North South University, Neo Innovation Center, The Red Sea), and organizations/brands (United Nations, Brac University, Microsoft, Google).", "examples": ["She works at Microsoft.", "We met Professor Hasan at North South University in Dhaka."]}, {"no": 4, "title": "Days, Months, Holidays — But NOT Seasons!", "rule": "Capitalize days (Monday, Friday), months (January, June), and holidays (Eid-ul-Fitr,Eid-ul-Adha, Christmas). Do NOT capitalize seasons (spring, summer, autumn, winter)!", "examples": ["The meeting is on Monday in June.", "I love summer because of the long days."]}, {"no": 5, "title": "Languages, Nationalities, and Religions", "rule": "Always capitalize languages (English, Bengali, Arabic), nationalities (Bangladeshi, Japanese), and religions/religious adjectives (Islam, Muslim, Christian).", "examples": ["He speaks English fluently.", "She is Bangladeshi and follows Islam."]}, {"no": 6, "title": "Titles Used Before Names vs. General Use", "rule": "Capitalize a title ONLY when used immediately before a person's name (Professor Rahim, Director Ahmed, Dr. Rahman). Do NOT capitalize when used generally with 'a/the' (She is a professor; I met the president; the manager welcomed us).", "examples": ["I spoke with Director Ahmed today.", "My uncle is a doctor and she is a professor at the university."]}, {"no": 7, "title": "First Word of a Direct Quotation", "rule": "Capitalize the first word of a complete direct quote inside quotation marks. Do NOT capitalize when a quote is smoothly integrated after 'that' or when the second half of an interrupted quote continues the same sentence.", "examples": ["He said, “We must leave now.”", "He said that we must “finish the work today.”", "“This project,” he said, “is very important.”"]}, {"no": 8, "title": "Major Words in Book, Article, and Chapter Titles", "rule": "Capitalize the first and last word, plus all nouns, verbs, adjectives, adverbs, and pronouns. Do NOT capitalize articles (a, an, the), short prepositions (in, on, at, to, for, of), or coordinating conjunctions (and, but, or) unless they are the first/last word.", "examples": ["Principles of Marketing", "The Art of War", "A Brief History of Time"]}, {"no": 9, "title": "Acronyms and Initialisms", "rule": "Capitalize all letters in acronyms and initialisms.", "examples": ["UN, GDP, AI, AI-based, HRM, NASA, IUT, BTM, CEO"]}, {"no": 10, "title": "Specific Course Titles vs. General Subjects", "rule": "Capitalize official course titles (Business Communication, Introduction to Finance, Business English). Do NOT capitalize general school/university subjects (biology, mathematics, economics, digital marketing) unless they are language names (English).", "examples": ["I am taking Business Communication this semester.", "I like studying biology, but he teaches Introduction to Finance."]}], "punctRules": [{"code": "A", "name": "Period / Full Stop ( . )", "rules": ["End a declarative statement (watch out for run-on sentences where two independent clauses are joined with no punctuation!).", "Use after abbreviations: Dr., Mr., Ms., Prof., etc., a.m., p.m."], "examples": ["The presentation starts at 10 a.m. She completed the assignment.", "Dr. Rahman and Mr. Khan arrived early."]}, {"code": "B", "name": "Question Mark ( ? )", "rules": ["Rule 1: End a direct question ('Where are you going?').", "Rule 2 (EXAM TRAP!): Do NOT use a question mark after an INDIRECT question ('He asked where I was going.' / 'Tell me why you are late.')."], "examples": ["Did you complete the report?", "He asked where I was going."]}, {"code": "C", "name": "Exclamation Mark ( ! )", "rules": ["Use after interjections or strong emotions."], "examples": ["Stop!", "That’s amazing!", "Watch out!"]}, {"code": "D", "name": "Comma ( , ) — 6 Essential Rules", "rules": ["Rule 1 (List / Oxford Comma): Separate 3 or more items in a list, including a comma before 'and/or' (Oxford comma) in Madam's answer keys ('pens, notebooks, markers, and folders').", "Rule 2 (Introductory Words/Phrases/Clauses): Always put a comma after introductory transitions, time phrases, prepositional phrases, or dependent clauses ('Yesterday,', 'Last week,', 'In recent years,', 'After the tour,', 'During the conference,', 'According to him,', 'However,', 'Interestingly,', 'Although this approach offers flexibility,').", "Rule 3 (Compound Sentences vs. Simple Predicates — HUGE EXAM TRAP!): Put a comma before FANBOYS (and, but, so, or, yet) ONLY when joining two complete sentences (two independent clauses with their own subjects). Do NOT put a comma before 'and/but' when a single subject has two verbs or two objects ('I bought apples and oranges' -> NO comma; 'I bought apples, and my brother bought oranges' -> COMMA).", "Rule 4 (Nonessential Relative Clauses): Set off extra 'who/which' clauses with commas ('visited the campus library, which has an impressive collection of business books.').", "Rule 5 (Appositives & Interrupters): Set off renaming nouns or mid-sentence transitions with a pair of commas ('Mr. Khan, our manager, is retiring.' / 'Employees, on the other hand, need discipline.').", "Rule 6 (Direct Address): Set off the name of the person being spoken to ('Sara, please close the door.' / 'Please help me, Rahim.' / 'Thank you, sir.')."], "examples": ["Yesterday, our team visited the Neo Innovation Center in Dhaka.", "He emphasized three major areas: renewable energy adoption, waste-reduction strategies, and eco-friendly packaging solutions.", "Students asked many questions, and the discussion became very interactive."]}, {"code": "E", "name": "Semicolon ( ; )", "rules": ["Connect two closely related independent clauses (complete sentences) without a conjunction (or before conjunctive adverbs like '; however,')."], "examples": ["She loves traveling; he prefers staying home.", "The system failed; the backup plan worked."]}, {"code": "F", "name": "Colon ( : )", "rules": ["Rule 1: Introduce a list, explanation, or example AFTER a complete independent sentence.", "CRITICAL TRAP: Never place a colon directly after a verb or preposition ('My favourite subjects are: English...' is WRONG! Write 'My favourite subjects are English...' OR 'I have three favourite subjects: English, Mathematics, and Economics.')."], "examples": ["We need three things: money, time, and support.", "He emphasized three major areas: renewable energy adoption, waste-reduction strategies, and eco-friendly packaging solutions."]}, {"code": "G", "name": "Quotation Marks ( “ ” )", "rules": ["Rules 1–3: Enclose direct speech; capitalize the first word inside a quote, EXCEPT the second part of an interrupted quote (“This project,” he said, “is very important.”).", "Rule 4: Commas and periods ALWAYS go INSIDE quotation marks (“It’s done,” she said.).", "Rule 5: Question marks and exclamation marks go inside ONLY if they belong to the quoted speech (He asked, “Where are you going?” vs. Did he say, “I’m leaving”?).", "Rule 6: Use quotation marks for titles of short works: poems (“The Road Not Taken”), articles (“Global Warming Impacts”), songs (“Perfect”), short stories (“The Lottery”).", "Rule 7: Use single quotation marks (‘ ’) for a quote inside a quote (He said, “I heard her say, ‘I’m leaving now.’”).", "Rules 8–10 & 13: Use quotes for ironic words (“busy”), nicknames (“The Greatest”), first-time technical terms (“micro-sharding”, “hashing” — lowercase unless proper noun/sentence start!), and specific words (“innovation”).", "Rule 11: NEVER use quotation marks for indirect speech (He said that he would come later.)."], "examples": ["My friend said, “Let’s have a coffee break,” so we went to a cafe.", "The process is called “hashing.”"]}, {"code": "H", "name": "Apostrophe ( ’ )", "rules": ["Rule 1 (Possession): Singular noun + ’s (Maria’s laptop, the company’s policy, today’s competitive job market); Plural noun ending in s + ’ (students’ results).", "Rule 2 (Contractions): Don’t, I’m, let’s (let us), it’s (it is — contrast with possessive pronoun 'its' which has NO apostrophe!)."], "examples": ["in today’s competitive job market", "My friend said, “Let’s have a coffee break.”"]}, {"code": "I", "name": "Hyphen ( - )", "rules": ["Join compound words and compound adjectives before a noun: AI-based, real-life, waste-reduction, eco-friendly, long-term, cross-sector, in-office, well-known, part-time."], "examples": ["AI-based tools, real-life case studies, eco-friendly packaging, long-term costs, cross-sector collaboration, in-office tasks"]}, {"code": "J–M", "name": "Parentheses ( ), Brackets [ ], Ellipsis ( … ), Slash ( / )", "rules": ["Parentheses ( ): Extra clarifying info ('The report (final version) is ready.').", "Brackets [ ]: Editorial clarification inside a quote ('He said, “I will go there tomorrow [Monday].”').", "Ellipsis ( … ): Omission or unfinished thought ('I was thinking… maybe we should leave.').", "Slash ( / ): Alternatives ('and/or', 'handwritten/typed', '2025/2026', 'yes/no')."], "examples": ["The report (final version) is ready.", "He said, “I will go there tomorrow [Monday].”"]}], "commonMistakes100": [{"id": 1, "cat": "1. Redundant Prepositions", "wrong": "discuss about the proposal", "right": "discuss the proposal", "why": "'Discuss' is a transitive verb meaning 'talk about'; adding 'about' is redundant."}, {"id": 2, "cat": "1. Redundant Prepositions", "wrong": "emphasize on sustainability", "right": "emphasize sustainability (OR lay emphasis on)", "why": "The verb 'emphasize' never takes 'on'."}, {"id": 3, "cat": "1. Redundant Prepositions", "wrong": "stress on effective teamwork", "right": "stress effective teamwork (OR lay stress on)", "why": "As a transitive verb, 'stress' takes a direct object without 'on'."}, {"id": 4, "cat": "1. Redundant Prepositions", "wrong": "comprise of five departments", "right": "comprise five departments (OR consist of / be composed of)", "why": "'Comprise' means 'consist of'—never use 'of' after 'comprise' in active voice."}, {"id": 5, "cat": "1. Redundant Prepositions", "wrong": "request for additional funding", "right": "request additional funding (OR make a request for)", "why": "When used as a verb, 'request' does not take 'for'."}, {"id": 6, "cat": "1. Redundant Prepositions", "wrong": "order for new office equipment", "right": "order new office equipment (OR place an order for)", "why": "The verb 'order' takes a direct object without 'for'."}, {"id": 7, "cat": "1. Redundant Prepositions", "wrong": "enter into the conference room", "right": "enter the conference room", "why": "Physical entry into a place uses 'enter' without 'into' (note: 'enter into an agreement/partnership' is correct for abstract agreements)."}, {"id": 8, "cat": "1. Redundant Prepositions", "wrong": "reach at the airport / university", "right": "reach the airport / university", "why": "'Reach' (arrive at) takes no preposition before a destination."}, {"id": 9, "cat": "1. Redundant Prepositions", "wrong": "await for the committee's decision", "right": "await the committee's decision (OR wait for)", "why": "'Await' already means 'wait for'."}, {"id": 10, "cat": "1. Redundant Prepositions", "wrong": "investigate into the discrepancy", "right": "investigate the discrepancy (OR inquire into)", "why": "'Investigate' takes a direct object without 'into'."}, {"id": 11, "cat": "1. Redundant Prepositions", "wrong": "resemble to her manager", "right": "resemble her manager", "why": "'Resemble' never takes 'to' or 'with'."}, {"id": 12, "cat": "1. Redundant Prepositions", "wrong": "approach to the director", "right": "approach the director", "why": "As a verb, 'approach' takes no preposition."}, {"id": 13, "cat": "1. Redundant Prepositions", "wrong": "answer to my question", "right": "answer my question (OR give an answer to)", "why": "As a verb, 'answer' takes no 'to'."}, {"id": 14, "cat": "1. Redundant Prepositions", "wrong": "tell to me the truth", "right": "tell me the truth", "why": "'Tell' takes an indirect object directly without 'to' ('said to me' vs. 'told me')."}, {"id": 15, "cat": "1. Redundant Prepositions", "wrong": "ask to the coordinator", "right": "ask the coordinator", "why": "'Ask' takes the person directly without 'to'."}, {"id": 16, "cat": "1. Redundant Prepositions", "wrong": "lack of technical skills (as verb: 'he lacks of')", "right": "he lacks technical skills (OR has a lack of)", "why": "The verb 'lack' never takes 'of'; the noun 'a lack of' does."}, {"id": 17, "cat": "1. Redundant Prepositions", "wrong": "regret for the delay (as verb: 'we regret for')", "right": "we regret the delay", "why": "The transitive verb 'regret' takes a direct object without 'for'."}, {"id": 18, "cat": "1. Redundant Prepositions", "wrong": "contact with the client", "right": "contact the client (OR get in contact with)", "why": "As a verb, 'contact' takes no 'with'."}, {"id": 19, "cat": "2. Wrong Prepositions", "wrong": "cope up with the workload", "right": "cope with the workload", "why": "The idiom is 'cope with', never 'cope up with'."}, {"id": 20, "cat": "2. Wrong Prepositions", "wrong": "prefer remote work than office work", "right": "prefer remote work to office work", "why": "With nouns/gerunds, 'prefer' always takes 'to', never 'than'."}, {"id": 21, "cat": "2. Wrong Prepositions", "wrong": "superior / inferior than competitors", "right": "superior / inferior to competitors", "why": "Latin comparatives ending in -or (superior, inferior, senior, junior, prior) take 'to', never 'than'."}, {"id": 22, "cat": "2. Wrong Prepositions", "wrong": "senior / junior than me", "right": "senior / junior to me", "why": "Always use 'to' after senior, junior, prior, anterior, posterior."}, {"id": 23, "cat": "2. Wrong Prepositions", "wrong": "accustomed with digital tools", "right": "accustomed to using digital tools", "why": "'Accustomed' takes 'to' (+ noun or V-ing), never 'with'."}, {"id": 24, "cat": "2. Wrong Prepositions", "wrong": "insisted to go / insisted for going", "right": "insisted on going", "why": "The verb 'insist' always takes 'on + V-ing'."}, {"id": 25, "cat": "2. Wrong Prepositions", "wrong": "succeeded to solve the issue", "right": "succeeded in solving the issue", "why": "'Succeed' takes 'in + V-ing', never 'to + V1'."}, {"id": 26, "cat": "2. Wrong Prepositions", "wrong": "capable to handle the project", "right": "capable of handling the project", "why": "'Capable' (and 'incapable') takes 'of + V-ing'."}, {"id": 27, "cat": "2. Wrong Prepositions", "wrong": "prevented him to submit", "right": "prevented him from submitting", "why": "'Prevent' (and 'prohibit/refrain/abstain') takes 'from + V-ing'."}, {"id": 28, "cat": "2. Wrong Prepositions", "wrong": "good in English / weak in mathematics", "right": "good at English / weak in (or at) mathematics", "why": "'Good at', 'bad at', 'clever at', 'quick at' a skill or subject."}, {"id": 29, "cat": "2. Wrong Prepositions", "wrong": "congratulated her for her promotion", "right": "congratulated her on her promotion", "why": "Always 'congratulate someone ON something'."}, {"id": 30, "cat": "2. Wrong Prepositions", "wrong": "accused for financial misconduct", "right": "accused of financial misconduct (OR charged
